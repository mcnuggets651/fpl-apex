name: Apex V2 Dastan Shadow

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: apex-v2-dastan-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dastan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.number == 90 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/apex-v2-cleanroom' &&
       github.event.label.name == 'help wanted')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APEX_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APEX_CODE_SHA }}
          fetch-depth: 0

      - name: Verify shadow-attempt identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$APEX_CODE_SHA" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$APEX_CODE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Apex tooling
        run: python -m pip install -e '.[dev]'

      - name: Resolve exact Dastan pin
        id: dastan
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          source = json.load(open('upstreams.lock.json', encoding='utf-8'))['sources']['dastan']
          print(f"repository={source['repository']}")
          print(f"sha={source['commit']}")
          PY

      - name: Checkout Dastan and install its pinned data runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workers artifacts/v2/challengers acquisition/providers .dastan-raw
          git clone --filter=blob:none "https://github.com/${{ steps.dastan.outputs.repository }}.git" workers/dastan
          git -C workers/dastan checkout --detach "${{ steps.dastan.outputs.sha }}"
          python -m pip install -r workers/dastan/requirements-data.txt

      - name: Verify immutable Dastan release contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=workers/dastan python -m dastan.artifacts

      - name: Capture Official FPL pre-Dastan seal
        id: official_before
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(apex-v2 official-hash --season 2026-2027)"
          test -n "$HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Official FPL pre-Dastan authority hash: $HASH"

      - name: Audit current roster and resolve reviewed club identities
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dastan_identity_preflight.py \
            --mapping workers/dastan/data/mappings/fpl_understat_current.csv \
            --output artifacts/v2/challengers/dastan_identity_preflight.json

      - name: Generate leakage-safe Dastan H1 shadow forecast
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_dastan_shadow_worker.py \
            --dastan-root workers/dastan \
            --identity-preflight artifacts/v2/challengers/dastan_identity_preflight.json \
            --raw-dir .dastan-raw \
            --output acquisition/providers/dastan.csv \
            --manifest artifacts/v2/challengers/dastan_shadow_manifest.json

      - name: Re-seal Official FPL and verify shadow provenance
        shell: bash
        run: |
          set -euo pipefail
          POST_HASH="$(apex-v2 official-hash --season 2026-2027)"
          test "$POST_HASH" = "${{ steps.official_before.outputs.hash }}"
          python - <<'PY'
          import json
          import pandas as pd

          expected = "${{ steps.official_before.outputs.hash }}"
          manifest = json.load(open(
              'artifacts/v2/challengers/dastan_shadow_manifest.json', encoding='utf-8'
          ))
          frame = pd.read_csv('acquisition/providers/dastan.csv')
          assert manifest['official_source_hash'] == expected
          assert bool(manifest['placeholder_invariance']) is True
          assert bool(manifest['serve_authorized']) is False
          assert manifest['predictive_status'] == 'INSUFFICIENT_HISTORY'
          assert len(frame) == int(manifest['official_players'])
          assert frame['source_snapshot'].astype(str).nunique() == 1
          assert frame['source_snapshot'].astype(str).iloc[0] == expected
          assert frame['scoring_rules_version'].astype(str).nunique() == 1
          assert frame['scoring_rules_version'].astype(str).iloc[0] == 'fpl-2026-27-v1'
          print(json.dumps({
              'official_players': int(manifest['official_players']),
              'forecast_rows': int(manifest['forecast_rows']),
              'no_forecast_rows': int(manifest['no_forecast_rows']),
              'target_gameweek': int(manifest['target_gameweek']),
              'source_snapshot': expected,
              'serve_authorized': False,
          }, sort_keys=True))
          PY

      - name: Upload immutable shadow diagnostic copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-v2-dastan-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/v2/challengers/
            acquisition/providers/dastan.csv
            .dastan-raw/downloads.json
          retention-days: 30
