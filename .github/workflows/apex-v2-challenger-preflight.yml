name: Apex V2 Challenger Shadows

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: apex-v2-challenger-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dastan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.number == 90 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/apex-v2-cleanroom' &&
       github.event.label.name == 'help wanted')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APEX_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APEX_CODE_SHA }}
          fetch-depth: 0

      - name: Verify shadow-attempt identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$APEX_CODE_SHA" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$APEX_CODE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Apex tooling
        run: python -m pip install -e '.[dev]'

      - name: Capture Official FPL pre-Dastan seal
        id: official_before
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(apex-v2 official-hash --season 2026-2027)"
          test -n "$HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Official FPL pre-Dastan authority hash: $HASH"

      - name: Acquire and qualify isolated Dastan H1 shadow
        shell: bash
        run: |
          set -euo pipefail
          python scripts/acquire_dastan_shadow.py \
            --expected-official-hash '${{ steps.official_before.outputs.hash }}'

      - name: Re-seal Official FPL after Dastan
        shell: bash
        run: |
          set -euo pipefail
          POST_HASH="$(apex-v2 official-hash --season 2026-2027)"
          test "$POST_HASH" = "${{ steps.official_before.outputs.hash }}"

      - name: Assert Dastan remains non-serving
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          report = json.load(open(
              'artifacts/v2/challengers/dastan_shadow_qualification.json',
              encoding='utf-8',
          ))
          assert report['serve_authorized'] is False
          assert report['predictive_status'] == 'INSUFFICIENT_HISTORY'
          assert report['official_forecast_coverage'] == 1.0
          assert report['material_probability_order_violations'] == 0
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Upload immutable Dastan shadow diagnostic copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-v2-dastan-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/v2/challengers/
            acquisition/providers/dastan.csv
            .dastan-raw/downloads.json
          retention-days: 30

  openfpl-reference:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.number == 90 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/apex-v2-cleanroom' &&
       github.event.label.name == 'help wanted')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APEX_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APEX_CODE_SHA }}
          fetch-depth: 0

      - name: Verify shadow-attempt identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$APEX_CODE_SHA" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$APEX_CODE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Apex tooling
        run: python -m pip install -e '.[dev]'

      - name: Checkout exact OpenFPL reference pin
        shell: bash
        run: |
          set -euo pipefail
          OPENFPL_COMMIT="$(python - <<'PY'
          import json
          print(json.load(open('upstreams.lock.json'))['sources']['openfpl']['commit'])
          PY
          )"
          git init .openfpl
          git -C .openfpl remote add origin https://github.com/daniegr/OpenFPL.git
          git -C .openfpl fetch --depth=1 origin "$OPENFPL_COMMIT"
          git -C .openfpl checkout --detach FETCH_HEAD
          test "$(git -C .openfpl rev-parse HEAD)" = "$OPENFPL_COMMIT"

      - name: Audit reference implementation and current-rules blocker
        shell: bash
        run: |
          set -euo pipefail
          python scripts/openfpl_reference_preflight.py \
            --openfpl-root .openfpl \
            --output artifacts/v2/challengers/openfpl_reference_preflight.json
          python - <<'PY'
          import json
          report = json.load(open(
              'artifacts/v2/challengers/openfpl_reference_preflight.json',
              encoding='utf-8',
          ))
          assert report['reference_assets_valid'] is True
          assert report['current_rules_compatible'] is False
          assert report['serve_authorized'] is False
          assert report['predictive_status'] == 'INSUFFICIENT_HISTORY'
          assert report['sample_column_count'] >= 200
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Audit exact current-rule history readiness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/openfpl_current_readiness.py \
            --policy config/openfpl_training_policy.yaml \
            --output artifacts/v2/challengers/openfpl_current_readiness.json
          python - <<'PY'
          import json
          report = json.load(open(
              'artifacts/v2/challengers/openfpl_current_readiness.json',
              encoding='utf-8',
          ))
          policy = report['training_policy']
          assert policy['valid'] is True
          assert policy['policy_version'] == 'openfpl-current-training-v1'
          assert policy['feature_contract_version'] == 'openfpl-current-nonscore-v1'
          assert policy['minimum_exact_rule_gameweeks'] == 10
          assert len(policy['sha256']) == 64
          assert report['serve_authorized'] is False
          assert report['legacy_reference_weights_reused'] is False
          assert report['exact_rule_gameweek_count'] >= 1
          assert all(
              gw < report['target_gameweek']
              for gw in report['completed_exact_rule_gameweeks']
          )
          minimum = report['minimum_exact_rule_gameweeks']
          count = report['exact_rule_gameweek_count']
          if count < minimum:
              assert report['state'] == 'CURRENT_LABEL_HISTORY_INSUFFICIENT'
              assert report['training_ready'] is False
              assert report['model_construction_authorized'] is False
          else:
              assert report['state'] == 'CURRENT_LABEL_HISTORY_READY'
              assert report['training_ready'] is True
              assert report['model_construction_authorized'] is True
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Upload immutable OpenFPL reference diagnostic copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-v2-openfpl-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/v2/challengers/openfpl_reference_preflight.json
            artifacts/v2/challengers/openfpl_current_readiness.json
            config/openfpl_training_policy.yaml
          retention-days: 30
