name: Apex V2 Auth Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "22 */6 * * *"

permissions:
  contents: read

concurrency:
  group: apex-v2-fpl-auth
  cancel-in-progress: false

env:
  FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  refresh:
    if: vars.APEX_V2_PRIVATE_MANAGER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_APEX_SHA }}
          fetch-depth: 0

      - name: Verify frozen keepalive identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          echo "Apex V2 auth keepalive pinned to $FROZEN_APEX_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen Apex V2 tooling
        run: pip install -e '.[dev]'

      - name: Preflight private auth store
        env:
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APEX_PRIVATE_GITHUB_REPOSITORY"
          test -n "$APEX_PRIVATE_GITHUB_TOKEN"
          test "$APEX_PRIVATE_GITHUB_REPOSITORY" != "$GITHUB_REPOSITORY"
          apex-v2 private-store-preflight

      - name: Materialize exact operations auth controller
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CONTROL_PLANE_SHA"
          git fetch --no-tags origin "$CONTROL_PLANE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$CONTROL_PLANE_SHA"
          git show "$CONTROL_PLANE_SHA:scripts/apex_v2_auth_ops.py" > "$RUNNER_TEMP/apex_v2_auth_ops.py"
          test -s "$RUNNER_TEMP/apex_v2_auth_ops.py"
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"

      - name: Rotate and persist owner refresh state
        env:
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_REFRESH_WRAP_KEY: ${{ secrets.FPL_REFRESH_WRAP_KEY }}
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/apex_v2_auth_ops.py" \
            --mode keepalive \
            --preflight-script scripts/preflight_fpl_auth.py \
            --config config/apex_v2.yaml

      - name: Prove frozen worktree stayed untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
