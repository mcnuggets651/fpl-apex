name: Champion Authority Development Gate

on:
  push:
    branches: [v2/champion-authority-chain]

permissions:
  contents: read

concurrency:
  group: champion-authority-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex CI environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run champion authority contracts
        run: .venv/bin/python -m pytest -q tests/test_v2_champion_authority.py
      - name: Ruff champion authority surface
        run: >-
          .venv/bin/ruff check
          src/apex_fpl/core/champion_authority.py
          src/apex_fpl/control/champion_authority.py
          src/apex_fpl/control/empirical_qualification_admission.py
          tests/champion_authority_helpers.py
          tests/test_v2_champion_authority.py
      - name: Enumerate integration call sites
        shell: bash
        run: |
          echo '=== ProductionPublicationAuthorization constructors ==='
          grep -R -n --include='*.py' 'ProductionPublicationAuthorization(' src tests || true
          echo '=== execute_production_cutover calls ==='
          grep -R -n --include='*.py' 'execute_production_cutover(' src tests || true
