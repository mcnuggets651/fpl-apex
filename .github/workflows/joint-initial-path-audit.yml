name: Apex Joint Initial Path Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/apex_fpl/services/joint_initial_path.py"
      - "scripts/audit_joint_initial_path.py"
      - "tests/test_joint_initial_path.py"
      - ".github/workflows/joint-initial-path-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Apex + pinned AIrsenal worker
        run: scripts/install_pinned_airsenal.sh
      - name: Unit tests
        run: pytest -q tests/test_joint_initial_path.py
      - name: Cache AIrsenal database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v3
      - name: Refresh genuine AIrsenal forecasts
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then airsenal_setup_initial_db --fpl_team_id 1; fi
          python scripts/update_airsenal_worker.py
          python scripts/run_airsenal_worker.py --db "$AIRSENAL_DB_FILE" --horizon 8 --output data/generated/airsenal.csv
      - name: Build sealed GW1-GW8 decision bundle
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: python scripts/build_decision_bundle.py --horizon 8 --force
      - name: Run joint starting-squad transfer-path audit
        run: python scripts/audit_joint_initial_path.py --bundle-dir data/generated/decision_bundle --output reports/joint_initial_path.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-initial-path-${{ github.run_id }}
          path: reports/joint_initial_path.json
          retention-days: 90
