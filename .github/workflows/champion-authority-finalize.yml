name: Champion Authority Finalize

on:
  push:
    branches: [v2/champion-authority-chain]

permissions:
  contents: write

concurrency:
  group: champion-authority-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex CI environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Reuse exact guarded publication patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/champion-authority-integrate.yml').read_text()
          start_marker = '      - name: Apply exact champion-authority publication integration\n'
          end_marker = '      - name: Run champion/cutover/answer authority regression surface\n'
          start = source.find(start_marker)
          end = source.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit(f'guarded patch markers invalid: start={start} end={end}')
          block = source[start:end].splitlines()
          run_index = next(i for i, line in enumerate(block) if line == '        run: |')
          script_lines = block[run_index + 1:]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script_lines) + '\n'
          Path('/tmp/apply-champion-authority.sh').write_text(script)
          PY
          bash /tmp/apply-champion-authority.sh
          git diff --check
      - name: Run exact authority boundary regression
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_v2_champion_authority.py::test_champion_authority_replays_all_four_bundle_champions
          tests/test_v2_champion_authority.py::test_decision_policy_admission_binds_exact_qualification_artifact
          tests/test_v2_production_cutover.py::test_production_cutover_publishes_only_after_complete_pass_and_exact_cas
          tests/test_v2_production_cutover.py::test_missing_champion_authority_is_withheld_without_pointer_write
          tests/test_v2_production_cutover.py::test_unqualified_backend_withholds_even_when_release_certificate_passes
          tests/test_v2_production_cutover.py::test_stale_writer_fails_closed_and_cannot_become_current
          tests/test_v2_production_authority.py::test_exact_current_proof_authorized_release_is_only_actionable_authority
      - name: Ruff integrated authority surface
        run: >-
          .venv/bin/ruff check
          src/apex_fpl/core/champion_authority.py
          src/apex_fpl/core/production.py
          src/apex_fpl/control/champion_authority.py
          src/apex_fpl/control/empirical_qualification_admission.py
          src/apex_fpl/control/production_cutover.py
          src/apex_fpl/control/production_authority.py
          tests/champion_authority_helpers.py
          tests/test_v2_champion_authority.py
          tests/test_v2_production_cutover.py
          tests/test_v2_production_authority.py
      - name: Commit validated integration and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .github/workflows/champion-authority-dev.yml \
            .github/workflows/champion-authority-integrate.yml \
            .github/workflows/champion-authority-gate-tune.yml \
            .github/workflows/champion-authority-finalize.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Bind publication to replayed champion authority"
          git push origin HEAD:v2/champion-authority-chain
