name: Champion Deep Replay Traceability Land

on:
  push:
    branches: [v2/champion-authority-chain]

permissions:
  contents: write

concurrency:
  group: champion-deep-replay-traceability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply deep replay traceability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/land_champion_deep_replay_traceability.py")
          text = path.read_text(encoding="utf-8")
          old = '    if count != 1:\n        raise SystemExit(f"{path}: expected one target, found {count}: {old[:120]!r}")\n'
          new = '    if count < 1:\n        raise SystemExit(f"{path}: replacement target missing: {old[:120]!r}")\n'
          if text.count(old) != 1:
              raise SystemExit("deep replay patcher helper target mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/land_champion_deep_replay_traceability.py
      - name: Validate diff
        run: git diff --check
      - name: Commit non-workflow traceability and retire landing files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/apex.yml .github/workflows/v2-shadow-production.yml
          rm scripts/land_champion_deep_replay_traceability.py
          rm .github/workflows/champion-deep-replay-traceability-land.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Close deep champion replay traceability"
          git push origin HEAD:v2/champion-authority-chain
