name: Champion Authority Publication Land

on:
  push:
    branches: [v2/champion-authority-chain]

permissions:
  contents: write

concurrency:
  group: champion-authority-publication-land-${{ github.ref }}
  cancel-in-progress: true

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Apply exact previously reviewed publication integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              [
                  "git",
                  "show",
                  "04cb17147ad2c9c684b3b6661e905dd7ca3a9d10:.github/workflows/champion-authority-integrate.yml",
              ],
              text=True,
          )
          start_marker = "      - name: Apply exact champion-authority publication integration\n"
          end_marker = "      - name: Run champion/cutover/answer authority regression surface\n"
          start = source.find(start_marker)
          end = source.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit(f"guarded patch markers invalid: start={start} end={end}")
          block = source[start:end].splitlines()
          run_index = next(i for i, line in enumerate(block) if line == "        run: |")
          script_lines = block[run_index + 1 :]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script_lines
          ) + "\n"
          script = script.replace(".venv/bin/python - <<'PY'", "python - <<'PY'", 1)
          Path("/tmp/apply-champion-publication.sh").write_text(script)
          PY
          bash /tmp/apply-champion-publication.sh
          git diff --check
          python -m compileall -q \
            src/apex_fpl/core/production.py \
            src/apex_fpl/control/production_cutover.py \
            src/apex_fpl/control/production_authority.py
      - name: Commit publication binding and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/champion-authority-publication-land.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Bind publication to replayed champion authority"
          git push origin HEAD:v2/champion-authority-chain
