name: Apex V2 Production

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    types: [labeled]

permissions:
  contents: write

concurrency:
  group: apex-v2-production
  cancel-in-progress: false

jobs:
  produce:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.number == 90 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/apex-v2-cleanroom' &&
       github.event.label.name == 'enhancement')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APEX_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      APEX_PRIVATE_MANAGER_ENABLED: ${{ vars.APEX_V2_PRIVATE_MANAGER_ENABLED == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APEX_CODE_SHA }}
          fetch-depth: 0

      - name: Verify PR rehearsal identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$APEX_CODE_SHA" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$APEX_CODE_SHA"
          echo "PR-scoped Apex V2 rehearsal pinned to $APEX_CODE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Apex V2 tooling
        run: pip install -e '.[dev]'

      - name: Open immutable attempt intent
        id: intent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STARTED="$(apex-v2 intent --run-id "$RUN_KEY" --season 2026-2027 --gameweek 0 --code-sha "$APEX_CODE_SHA")"
          echo "run_key=$RUN_KEY" >> "$GITHUB_OUTPUT"
          echo "started=$STARTED" >> "$GITHUB_OUTPUT"

      - name: Capture Official FPL pre-provider seal
        id: official_seal
        shell: bash
        run: |
          set -euo pipefail
          OFFICIAL_HASH="$(apex-v2 official-hash --season 2026-2027)"
          test -n "$OFFICIAL_HASH"
          echo "hash=$OFFICIAL_HASH" >> "$GITHUB_OUTPUT"
          echo "Official FPL pre-provider hash: $OFFICIAL_HASH"

      - name: Resolve pinned AIrsenal
        id: airsenal
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          source = json.load(open("upstreams.lock.json", encoding="utf-8"))["sources"]["airsenal"]
          print(f"repository={source['repository']}")
          print(f"sha={source['commit']}")
          PY

      - name: Cache AIrsenal database
        uses: actions/cache@v4
        with:
          path: .airsenal
          key: ${{ runner.os }}-apex-v2-airsenal-${{ steps.airsenal.outputs.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-apex-v2-airsenal-${{ steps.airsenal.outputs.sha }}-

      - name: Generate fresh AIrsenal candidate
        env:
          AIRSENAL_HOME: ${{ github.workspace }}/.airsenal
          AIRSENAL_DB_FILE: ${{ github.workspace }}/.airsenal/data.db
          FPL_TEAM_ID: "1"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          mkdir -p workers acquisition/providers "$AIRSENAL_HOME"
          git clone --filter=blob:none "https://github.com/${{ steps.airsenal.outputs.repository }}.git" workers/airsenal
          git -C workers/airsenal checkout --detach "${{ steps.airsenal.outputs.sha }}"
          (cd workers/airsenal && uv sync)
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            (cd workers/airsenal && uv run airsenal_setup_initial_db --fpl_team_id 1)
          fi
          (cd workers/airsenal && uv run python "$GITHUB_WORKSPACE/scripts/update_airsenal_worker.py")
          python scripts/patch_airsenal_positions.py "$AIRSENAL_DB_FILE" workers/airsenal
          (cd workers/airsenal && uv run python "$GITHUB_WORKSPACE/scripts/run_airsenal_worker.py" \
            --db "$AIRSENAL_DB_FILE" --horizon 8 \
            --output "$GITHUB_WORKSPACE/acquisition/providers/airsenal.csv")

      - name: Acquire Dastan H1 shadow in isolated provider runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/acquire_dastan_shadow.py \
            --expected-official-hash '${{ steps.official_seal.outputs.hash }}'

      - name: Re-anchor Official truth and freeze all inputs once
        id: freeze
        env:
          FPL_SESSION_COOKIE: ${{ vars.APEX_V2_PRIVATE_MANAGER_ENABLED == 'true' && secrets.FPL_SESSION_COOKIE || '' }}
          FPL_X_API_AUTHORIZATION: ${{ vars.APEX_V2_PRIVATE_MANAGER_ENABLED == 'true' && secrets.FPL_X_API_AUTHORIZATION || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APEX_PRIVATE_MANAGER_ENABLED" = "1" ]; then
            test -n "$FPL_SESSION_COOKIE$FPL_X_API_AUTHORIZATION" || {
              echo "Private-manager kill switch is enabled but no FPL credential is configured." >&2
              exit 1
            }
          else
            test -z "$FPL_SESSION_COOKIE$FPL_X_API_AUTHORIZATION"
          fi
          SNAPSHOT="$(apex-v2 acquire \
            --config config/apex_v2.yaml \
            --run-id '${{ steps.intent.outputs.run_key }}' \
            --code-sha "$APEX_CODE_SHA" \
            --run-started-at '${{ steps.intent.outputs.started }}' \
            --expected-official-hash '${{ steps.official_seal.outputs.hash }}')"
          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Solve frozen snapshot with network-independent decision code
        env:
          APEX_ALLOW_NETWORK_DURING_SOLVE: "0"
        run: |
          python scripts/check_v2_architecture.py
          apex-v2 solve "${{ steps.freeze.outputs.snapshot }}" --output artifacts/v2/decision_bundle.json

      - name: Publish immutable completed attempt
        if: always() && steps.freeze.outputs.snapshot != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f artifacts/v2/decision_bundle.json ]; then
            echo "Solve did not produce a final decision bundle; intent remains orphaned for evaluator escalation."
            exit 1
          fi
          GW="$(python - <<'PY'
          import json
          print(json.load(open('artifacts/v2/decision_bundle.json'))['manifest']['target_gameweek'])
          PY
          )"
          apex-v2 publish \
            "${{ steps.freeze.outputs.snapshot }}" \
            artifacts/v2/decision_bundle.json \
            --season 2026-2027 \
            --gameweek "$GW" \
            --run-id '${{ steps.intent.outputs.run_key }}' \
            --code-sha "$APEX_CODE_SHA"

      - name: Upload sanitized diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-v2-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/v2/diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  diagnose:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 90 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/apex-v2-cleanroom' &&
      github.event.label.name == 'help wanted'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APEX_CODE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APEX_CODE_SHA }}
          fetch-depth: 0

      - name: Verify diagnostic rehearsal identity
        shell: bash
        run: |
          set -euo pipefail
          test "$APEX_CODE_SHA" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$APEX_CODE_SHA"
          echo "Non-publishing Apex V2 diagnostic pinned to $APEX_CODE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Apex V2 tooling
        run: pip install -e '.[dev]'

      - name: Open local-only diagnostic intent
        id: intent
        shell: bash
        run: |
          set -euo pipefail
          RUN_KEY="diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STARTED="$(apex-v2 intent \
            --run-id "$RUN_KEY" \
            --season 2026-2027 \
            --gameweek 0 \
            --code-sha "$APEX_CODE_SHA" \
            --no-publish)"
          echo "run_key=$RUN_KEY" >> "$GITHUB_OUTPUT"
          echo "started=$STARTED" >> "$GITHUB_OUTPUT"

      - name: Capture Official FPL pre-provider seal
        id: official_seal
        shell: bash
        run: |
          set -euo pipefail
          OFFICIAL_HASH="$(apex-v2 official-hash --season 2026-2027)"
          test -n "$OFFICIAL_HASH"
          echo "hash=$OFFICIAL_HASH" >> "$GITHUB_OUTPUT"
          echo "Official FPL pre-provider hash: $OFFICIAL_HASH"

      - name: Resolve pinned AIrsenal
        id: airsenal
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          source = json.load(open("upstreams.lock.json", encoding="utf-8"))["sources"]["airsenal"]
          print(f"repository={source['repository']}")
          print(f"sha={source['commit']}")
          PY

      - name: Cache AIrsenal database
        uses: actions/cache@v4
        with:
          path: .airsenal
          key: ${{ runner.os }}-apex-v2-airsenal-${{ steps.airsenal.outputs.sha }}-diagnostic
          restore-keys: |
            ${{ runner.os }}-apex-v2-airsenal-${{ steps.airsenal.outputs.sha }}-

      - name: Generate fresh AIrsenal candidate
        env:
          AIRSENAL_HOME: ${{ github.workspace }}/.airsenal
          AIRSENAL_DB_FILE: ${{ github.workspace }}/.airsenal/data.db
          FPL_TEAM_ID: "1"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          mkdir -p workers acquisition/providers "$AIRSENAL_HOME"
          git clone --filter=blob:none "https://github.com/${{ steps.airsenal.outputs.repository }}.git" workers/airsenal
          git -C workers/airsenal checkout --detach "${{ steps.airsenal.outputs.sha }}"
          (cd workers/airsenal && uv sync)
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            (cd workers/airsenal && uv run airsenal_setup_initial_db --fpl_team_id 1)
          fi
          (cd workers/airsenal && uv run python "$GITHUB_WORKSPACE/scripts/update_airsenal_worker.py")
          python scripts/patch_airsenal_positions.py "$AIRSENAL_DB_FILE" workers/airsenal
          (cd workers/airsenal && uv run python "$GITHUB_WORKSPACE/scripts/run_airsenal_worker.py" \
            --db "$AIRSENAL_DB_FILE" --horizon 8 \
            --output "$GITHUB_WORKSPACE/acquisition/providers/airsenal.csv")

      - name: Acquire Dastan H1 shadow in isolated provider runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/acquire_dastan_shadow.py \
            --expected-official-hash '${{ steps.official_seal.outputs.hash }}'

      - name: Re-anchor Official truth and freeze all inputs once
        id: freeze
        env:
          FPL_SESSION_COOKIE: ""
          FPL_X_API_AUTHORIZATION: ""
        shell: bash
        run: |
          set -euo pipefail
          test -z "$FPL_SESSION_COOKIE$FPL_X_API_AUTHORIZATION"
          SNAPSHOT="$(apex-v2 acquire \
            --config config/apex_v2.yaml \
            --run-id '${{ steps.intent.outputs.run_key }}' \
            --code-sha "$APEX_CODE_SHA" \
            --run-started-at '${{ steps.intent.outputs.started }}' \
            --expected-official-hash '${{ steps.official_seal.outputs.hash }}')"
          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Solve frozen snapshot offline
        env:
          APEX_ALLOW_NETWORK_DURING_SOLVE: "0"
        run: |
          python scripts/check_v2_architecture.py
          apex-v2 solve "${{ steps.freeze.outputs.snapshot }}" --output artifacts/v2/decision_bundle.json

      - name: Build public-safe diagnostic material
        env:
          SNAPSHOT: ${{ steps.freeze.outputs.snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from apex.runtime.publication import build_publication_materials

          material = build_publication_materials(
              Path(os.environ["SNAPSHOT"]),
              Path("artifacts/v2/decision_bundle.json"),
              Path("artifacts/v2"),
          )
          assert not material.authenticated_manager_state
          assert not material.private_files
          print("Sanitized diagnostic publication material built successfully.")
          PY

      - name: Assert diagnostic produced a sealed decision artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/v2/decision_bundle.json
          test -s artifacts/v2/diagnostics/publication_summary.json
          python - <<'PY'
          import json
          decision = json.load(open("artifacts/v2/decision_bundle.json", encoding="utf-8"))
          assert decision["manifest"]["code_sha"] == "${{ env.APEX_CODE_SHA }}"
          print(json.dumps({
              "state": decision["certification"]["state"],
              "actionable": decision["certification"]["actionable"],
              "target_gameweek": decision["manifest"]["target_gameweek"],
              "serving_provider_by_horizon": decision["manifest"]["serving_provider_by_horizon"],
          }, sort_keys=True))
          PY

      - name: Upload sanitized diagnostic snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-v2-downstream-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/v2/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
