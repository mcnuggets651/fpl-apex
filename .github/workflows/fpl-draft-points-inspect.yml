name: FPL Draft Points Inspect

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.event.pull_request.number == 90 &&
      github.event.label.name == 'draft-points-proof' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Draft points privately
        shell: bash
        env:
          FPL_SESSION_COOKIE: ${{ secrets.FPL_SESSION_COOKIE }}
          FPL_X_API_AUTHORIZATION: ${{ secrets.FPL_X_API_AUTHORIZATION }}
          PROOF_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAhHJV7CIwjZ318GzOX4PL
            +yE07h8nR9H3vpYZaLZWNqmD8wIJSUwOB7qF8GgVIAGJ7djwxvfzLsUkzDwjBprf
            BNb0scRyUxJ56UdaJO1mT0M3PqsvQ9moi6kl+80/5WDQfH85Fu4Rkl8A5vB+fuXZ
            YU7dudgqGdyh4nqdp2YMd1J1qZD8y5rTLPJzBzdRF6gY/ukuJqnNUmwrMdyhemoW
            xa2fqlD/L/aCRsOQTD4RppiSXLeDBE0g7bCvgHTM9wyc70TJrh7kuQCdM6Sjn4I6
            TsTV/FlMteARb7sNGpPJh3v0YQLRheC19zI6raGE0P1D0sZJ1Tl5QWU2lcYSF6ef
            2lSdLmXvvL1SeyI/csnem3y0MA7SU+BRW/+/B3z7razV7NqQU841Lv0jseQoOaVr
            vbcq4O1GuX7F+dp62cZygdM3+LINwx2upvgI6BpvceZr6jgfko9QyBf/RldYQ6ef
            0PY8CtyQyEBOEULq/1F8AiqWCKN4RVIPL82rZAUMUB1FJ1iXujJZtsAcBD8zwCjX
            cPl/7xwJpqzfbzs0l+9d/nllCwk+MJFUzoH1D3/Z8oE5UtCwKFp0KgMXmHzT3m9Y
            RTdQ5F0bde7MXkyBoTr6TMzZKPNjyhxHXdmVF3Rz8obI4kNR4JDXhBhMhNd3QJo/
            sA1MRozK3ARGWV++Z9DHmN0CAwEAAQ==
            -----END PUBLIC KEY-----
        run: |
          set +x
          python - <<'PY'
          import json, os, zlib
          from urllib.request import Request, urlopen
          D='https://draft.premierleague.com/api'
          cookie=os.getenv('FPL_SESSION_COOKIE','').strip(); token=os.getenv('FPL_X_API_AUTHORIZATION','').strip()
          h={'Accept':'application/json','User-Agent':'fpl-apex-proof/3','Referer':'https://draft.premierleague.com/'}
          if cookie: h['Cookie']=cookie
          if token: h['X-API-Authorization']=token if token.lower().startswith('bearer ') else 'Bearer '+token
          def get(u):
              with urlopen(Request(u,headers=h),timeout=25) as r: return json.loads(r.read().decode())
          boot=get(D+'/bootstrap-static')
          nm={int(x['id']):str(x.get('web_name') or x.get('second_name') or x['id']) for x in boot.get('elements',[])}
          event=get(D+'/entry/172178/event/2')
          live=get(D+'/event/2/live')
          def picklist(x):
              if not isinstance(x,dict): return []
              for k in ('picks','elements','squad','team'):
                  v=x.get(k)
                  if isinstance(v,list) and sum(isinstance(r,dict) and r.get('element',r.get('element_id')) is not None for r in v)>=11:return v
              for v in x.values():
                  q=picklist(v)
                  if q:return q
              return []
          ps=picklist(event)
          event_packet={
             'top_keys':list(event.keys()) if isinstance(event,dict) else [],
             'top_scalars':{k:v for k,v in event.items() if isinstance(v,(str,int,float,bool)) or v is None} if isinstance(event,dict) else {},
             'rows':[]}
          for i,r in enumerate(ps,1):
              pid=int(r.get('element',r.get('element_id')))
              event_packet['rows'].append([nm.get(pid,str(pid)),{k:v for k,v in r.items() if isinstance(v,(str,int,float,bool)) or v is None}])
          live_packet={'type':type(live).__name__}
          if isinstance(live,dict):
              live_packet['top_keys']=list(live.keys())
              live_packet['top_scalars']={k:v for k,v in live.items() if isinstance(v,(str,int,float,bool)) or v is None}
              for k,v in live.items():
                  if isinstance(v,list):
                      live_packet['list_key']=k; live_packet['list_len']=len(v)
                      live_packet['samples']=[x for x in v[:3] if isinstance(x,dict)]
                      break
          elif isinstance(live,list):
              live_packet['list_len']=len(live); live_packet['samples']=[x for x in live[:3] if isinstance(x,dict)]
          for label,obj in [('event',event_packet),('live',live_packet)]:
              raw=json.dumps(obj,ensure_ascii=False,separators=(',',':')).encode(); comp=zlib.compress(raw,9)
              if len(comp)>400:
                  # Reduce event rows to only point-like scalar fields if needed.
                  if label=='event':
                      obj['rows']=[[n,{k:v for k,v in d.items() if any(t in k.lower() for t in ('point','score','mult','position'))}] for n,d in obj['rows']]
                  if label=='live' and 'samples' in obj:
                      obj['samples']=[{k:v for k,v in s.items() if isinstance(v,(str,int,float,bool)) or v is None} for s in obj['samples'][:2]]
                  comp=zlib.compress(json.dumps(obj,ensure_ascii=False,separators=(',',':')).encode(),9)
              if len(comp)>400: raise RuntimeError(f'{label} packet too large {len(comp)}')
              open('/tmp/'+label+'.z','wb').write(comp)
          PY
          printf '%s\n' "$PROOF_PUBLIC_KEY" >/tmp/pub.pem
          for label in event live; do
            openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in "/tmp/${label}.z" -out "/tmp/${label}.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
            upper=$(echo "$label"|tr '[:lower:]' '[:upper:]')
            echo "APEX_DRAFT_${upper}=$(base64 -w0 /tmp/${label}.enc)"
          done
          rm -f /tmp/event.z /tmp/live.z /tmp/event.enc /tmp/live.enc /tmp/pub.pem
