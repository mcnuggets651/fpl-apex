name: Temporary PITCHSIDE patch applicator

on:
  push:
    branches:
      - agent/pitchside-predeadline-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/pitchside-predeadline-recovery
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply exact bounded patch
        run: python .github/patches/apply_pitchside_recovery.py

      - name: Install test tooling
        run: python -m pip install -e '.[dev]'

      - name: Run targeted tournament regressions
        run: python -m pytest ops_tests/test_apex_v2_tournament_ops.py -q

      - name: Lint touched Python surfaces
        run: python -m ruff check scripts/apex_v2_tournament_ops.py scripts/apex_v2_tournament_contract.py ops_tests/test_apex_v2_tournament_ops.py

      - name: Verify patch hygiene
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/patches/apply_pitchside_recovery.py
          test ! -e .github/workflows/_temporary-pitchside-patch.yml
          grep -F "github.event_name == 'schedule'" .github/workflows/apex-v2-prospective-tournament.yml
          grep -F 'tournament_sealed_at' scripts/apex_v2_tournament_contract.py
          grep -F '_candidate_seal_id' scripts/apex_v2_tournament_ops.py

      - name: Commit validated repair
        env:
          BRANCH: agent/pitchside-predeadline-recovery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Fix PITCHSIDE predeadline tournament recovery'
          git push origin "HEAD:$BRANCH"
