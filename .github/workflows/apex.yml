name: Apex CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: apex-ci-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check src tests scripts
      - run: python scripts/check_upstreams.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

# Production team generation is intentionally excluded from this workflow.
# The only scheduled/user-facing decision workflow is `.github/workflows/pinnacle.yml`
# (display name: Apex Unified), which runs `scripts/run_apex.py` and publishes only
# `data/generated/apex_recommendation_latest.*`.
