name: Apex CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: apex-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      # Temporary candidate probe: validate today's immutable FPL Core revision
      # before the production lock is allowed to move. Remove after promotion.
      - name: Validate candidate FPL Core revision before pin promotion
        run: >-
          python scripts/validate_core_candidate.py
          --ref 0ec337a60cbeaa2eca3f8f98b288c46fa2f8fdba
          --season 2026-2027
          --cache-dir data/cache/core-candidate
      - run: pytest -q
      - run: ruff check src tests scripts
      - run: python scripts/check_upstreams.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python scripts/check_governance_consistency.py

# Production team generation is intentionally excluded from this workflow.
# The only scheduled/user-facing decision workflow is `.github/workflows/pinnacle.yml`
# (display name: Apex Unified), which runs `scripts/run_apex.py` and publishes only
# `data/generated/apex_recommendation_latest.*`.
