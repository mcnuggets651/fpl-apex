name: Apex CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: apex-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci
          POSTGRES_DB: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APEX_TEST_POSTGRES_DSN: postgresql://apex:apex-ci@127.0.0.1:5432/apex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex CI environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run production control fast-fail contracts
        run: >-
          .venv/bin/python -m pytest -q --durations=20
          tests/test_v2_postgres_backend.py
          tests/test_v2_backend_operational_qualification.py
          tests/test_v2_backend_qualification_traceability.py
          tests/test_v2_production_backend_runtime.py
          tests/test_v2_production_authority_root.py
          tests/test_v2_production_authority_enforcement.py
          tests/test_v2_postgres_atomic_publication.py
          tests/test_v2_operations_authority_cli.py
          tests/test_v2_production_architecture.py
          tests/test_v2_production_bundle_architecture.py
          tests/test_v2_production_traceability.py
          tests/test_v2_empirical_qualification_traceability.py
          tests/test_v2_ci_certification_identity.py
      - name: Ruff production control contract surface
        run: >-
          .venv/bin/ruff check
          src/apex_fpl/core/backend_qualification.py
          src/apex_fpl/core/champion_authority.py
          src/apex_fpl/core/production.py
          src/apex_fpl/core/artifact_manifest.py
          src/apex_fpl/core/authority_root_backend_qualification.py
          src/apex_fpl/core/production_authority_root.py
          src/apex_fpl/control/artifact_manifest.py
          src/apex_fpl/control/authority_root_backend_qualification.py
          src/apex_fpl/control/authority_root_registry.py
          src/apex_fpl/control/backend_operational_qualification.py
          src/apex_fpl/control/backend_ports.py
          src/apex_fpl/control/postgres_backend.py
          src/apex_fpl/control/postgres_authority_root_registry.py
          src/apex_fpl/control/postgres_atomic_publication.py
          src/apex_fpl/control/production_backend_qualification.py
          src/apex_fpl/control/production_backend_runtime.py
          src/apex_fpl/control/production_cutover.py
          src/apex_fpl/control/production_authority.py
          src/apex_fpl/control/production_authority_root.py
          src/apex_fpl/control/production_authority_verification.py
          src/apex_fpl/control/provenance_replay.py
          src/apex_fpl/control/release_registry.py
          src/apex_fpl/control/empirical_qualification_admission.py
          src/apex_fpl/v2_operations_cli.py
          tests/production_authority_root_helpers.py
          tests/test_v2_backend_qualification_traceability.py
          tests/test_v2_production_authority_root.py
          tests/test_v2_production_authority_enforcement.py
          tests/test_v2_postgres_atomic_publication.py
          tests/test_v2_operations_authority_cli.py
          tests/test_v2_production_architecture.py
          tests/test_v2_production_bundle_architecture.py
          tests/test_v2_production_traceability.py
          tests/test_v2_empirical_qualification_traceability.py
          tests/test_v2_ci_certification_identity.py

  production-cutover-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci
          POSTGRES_DB: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APEX_TEST_POSTGRES_DSN: postgresql://apex:apex-ci@127.0.0.1:5432/apex
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex CI environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run cutover transaction integration shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t nodeids < <(
            .venv/bin/python -m pytest --collect-only -q tests/test_v2_production_cutover.py \
              | grep '^tests/test_v2_production_cutover.py::'
          )
          selected=()
          for index in "${!nodeids[@]}"; do
            if (( index % 4 == SHARD )); then
              selected+=("${nodeids[$index]}")
            fi
          done
          if (( ${#selected[@]} == 0 )); then
            echo "No cutover tests assigned to shard ${SHARD}"
            exit 0
          fi
          printf 'Cutover shard %s running %s tests\n' "$SHARD" "${#selected[@]}"
          .venv/bin/python -m pytest -q --durations=15 "${selected[@]}"

  production-authority-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci
          POSTGRES_DB: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APEX_TEST_POSTGRES_DSN: postgresql://apex:apex-ci@127.0.0.1:5432/apex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex CI environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run rooted answer-authority integration contracts
        run: >-
          .venv/bin/python -m pytest -q --durations=30
          tests/test_v2_production_authority.py

  repository-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci
          POSTGRES_DB: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APEX_TEST_POSTGRES_DSN: postgresql://apex:apex-ci@127.0.0.1:5432/apex
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex CI environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run repository test-file shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find tests -maxdepth 1 -type f -name 'test_*.py' -print \
              | sort \
              | grep -v '^tests/test_v2_production_cutover.py$' \
              | grep -v '^tests/test_v2_production_authority.py$'
          )
          selected=()
          for index in "${!files[@]}"; do
            if (( index % 8 == SHARD )); then
              selected+=("${files[$index]}")
            fi
          done
          if (( ${#selected[@]} == 0 )); then
            echo "No repository test files assigned to shard ${SHARD}"
            exit 0
          fi
          printf 'Repository shard %s running %s files\n' "$SHARD" "${#selected[@]}"
          .venv/bin/python -m pytest -q --durations=20 "${selected[@]}"

  test:
    needs:
      - backend-contract
      - production-cutover-integration
      - production-authority-integration
      - repository-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex CI environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - run: .venv/bin/ruff check src tests scripts
      - run: .venv/bin/python scripts/check_upstreams.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: .venv/bin/python scripts/check_governance_consistency.py

      - name: Build immutable Apex core image
        shell: bash
        run: |
          docker build --iidfile "$RUNNER_TEMP/apex-core.iid" -t apex-core:qualified .
          cat "$RUNNER_TEMP/apex-core.iid"

      - name: Generate build SBOM and provenance evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apex-build-evidence"
          .venv/bin/python scripts/generate_spdx_sbom.py \
            --output "$RUNNER_TEMP/apex-build-evidence/sbom.spdx.json"
          cat > "$RUNNER_TEMP/apex-build-evidence/provenance.json" <<JSON
          {
            "schema_name": "apex-build-provenance",
            "schema_version": 1,
            "builder_identity": "github-actions:${{ github.repository }}:${{ github.workflow }}",
            "source_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_attempt": "${{ github.run_attempt }}"
          }
          JSON
          runtime_digest="$(cat "$RUNNER_TEMP/apex-core.iid")"
          .venv/bin/python scripts/build_runtime_manifest.py \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --runtime-digest "$runtime_digest" \
            --builder-identity "github-actions:${{ github.repository }}:${{ github.workflow }}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --sbom "$RUNNER_TEMP/apex-build-evidence/sbom.spdx.json" \
            --provenance "$RUNNER_TEMP/apex-build-evidence/provenance.json" \
            --output "$RUNNER_TEMP/apex-build-evidence/build_manifest.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apex-build-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/apex-build-evidence/
          retention-days: 30

# Production team generation is intentionally excluded from this workflow.
# `.github/workflows/pinnacle.yml` runs production and publishes only an immutable
# runtime artifact packet. It is forbidden from committing recommendation state to main.
