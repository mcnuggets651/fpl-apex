name: Apex CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: apex-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci
          POSTGRES_DB: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APEX_TEST_POSTGRES_DSN: postgresql://apex:apex-ci@127.0.0.1:5432/apex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex CI environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run production backend contract tests
        shell: bash
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_v2_postgres_backend.py \
            tests/test_v2_backend_operational_qualification.py
          .venv/bin/python -m pytest -q tests/test_v2_production_cutover.py \
            -k 'unqualified_backend or reference_filesystem_backends or random_nonreference_green_backend or backend_qualification_must_match'
          .venv/bin/python -m pytest -q tests/test_v2_production_authority.py \
            -k 'authorization_cannot_be_replayed_through_different_backend_identities'
      - name: Ruff production backend contract surface
        run: >-
          .venv/bin/ruff check
          src/apex_fpl/core/backend_qualification.py
          src/apex_fpl/control/backend_operational_qualification.py
          src/apex_fpl/control/backend_ports.py
          src/apex_fpl/control/postgres_backend.py
          src/apex_fpl/control/production_backend_qualification.py
          src/apex_fpl/control/production_cutover.py
          src/apex_fpl/control/release_registry.py
          tests/backend_qualification_helpers.py
          tests/test_v2_postgres_backend.py
          tests/test_v2_backend_operational_qualification.py
          tests/test_v2_production_cutover.py
          tests/test_v2_production_authority.py

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci
          POSTGRES_DB: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APEX_TEST_POSTGRES_DSN: postgresql://apex:apex-ci@127.0.0.1:5432/apex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex CI environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/ruff check src tests scripts
      - run: .venv/bin/python scripts/check_upstreams.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: .venv/bin/python scripts/check_governance_consistency.py

      - name: Build immutable Apex core image
        shell: bash
        run: |
          docker build --iidfile "$RUNNER_TEMP/apex-core.iid" -t apex-core:qualified .
          cat "$RUNNER_TEMP/apex-core.iid"

      - name: Generate build SBOM and provenance evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apex-build-evidence"
          .venv/bin/python scripts/generate_spdx_sbom.py \
            --output "$RUNNER_TEMP/apex-build-evidence/sbom.spdx.json"
          cat > "$RUNNER_TEMP/apex-build-evidence/provenance.json" <<JSON
          {
            "schema_name": "apex-build-provenance",
            "schema_version": 1,
            "builder_identity": "github-actions:${{ github.repository }}:${{ github.workflow }}",
            "source_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_attempt": "${{ github.run_attempt }}"
          }
          JSON
          runtime_digest="$(cat "$RUNNER_TEMP/apex-core.iid")"
          .venv/bin/python scripts/build_runtime_manifest.py \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --runtime-digest "$runtime_digest" \
            --builder-identity "github-actions:${{ github.repository }}:${{ github.workflow }}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --sbom "$RUNNER_TEMP/apex-build-evidence/sbom.spdx.json" \
            --provenance "$RUNNER_TEMP/apex-build-evidence/provenance.json" \
            --output "$RUNNER_TEMP/apex-build-evidence/build_manifest.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apex-build-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/apex-build-evidence/
          retention-days: 30

# Production team generation is intentionally excluded from this workflow.
# `.github/workflows/pinnacle.yml` runs production and publishes only an immutable
# runtime artifact packet. It is forbidden from committing recommendation state to main.
