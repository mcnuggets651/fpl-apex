name: FPL API Access Proof Compact

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.number == 90 &&
      github.event.label.name == 'api-proof-compact' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and encrypt compact proof
        shell: bash
        env:
          FPL_SESSION_COOKIE: ${{ secrets.FPL_SESSION_COOKIE }}
          FPL_X_API_AUTHORIZATION: ${{ secrets.FPL_X_API_AUTHORIZATION }}
          PROOF_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAhHJV7CIwjZ318GzOX4PL
            +yE07h8nR9H3vpYZaLZWNqmD8wIJSUwOB7qF8GgVIAGJ7djwxvfzLsUkzDwjBprf
            BNb0scRyUxJ56UdaJO1mT0M3PqsvQ9moi6kl+80/5WDQfH85Fu4Rkl8A5vB+fuXZ
            YU7dudgqGdyh4nqdp2YMd1J1qZD8y5rTLPJzBzdRF6gY/ukuJqnNUmwrMdyhemoW
            xa2fqlD/L/aCRsOQTD4RppiSXLeDBE0g7bCvgHTM9wyc70TJrh7kuQCdM6Sjn4I6
            TsTV/FlMteARb7sNGpPJh3v0YQLRheC19zI6raGE0P1D0sZJ1Tl5QWU2lcYSF6ef
            2lSdLmXvvL1SeyI/csnem3y0MA7SU+BRW/+/B3z7razV7NqQU841Lv0jseQoOaVr
            vbcq4O1GuX7F+dp62cZygdM3+LINwx2upvgI6BpvceZr6jgfko9QyBf/RldYQ6ef
            0PY8CtyQyEBOEULq/1F8AiqWCKN4RVIPL82rZAUMUB1FJ1iXujJZtsAcBD8zwCjX
            cPl/7xwJpqzfbzs0l+9d/nllCwk+MJFUzoH1D3/Z8oE5UtCwKFp0KgMXmHzT3m9Y
            RTdQ5F0bde7MXkyBoTr6TMzZKPNjyhxHXdmVF3Rz8obI4kNR4JDXhBhMhNd3QJo/
            sA1MRozK3ARGWV++Z9DHmN0CAwEAAQ==
            -----END PUBLIC KEY-----
        run: |
          set +x
          python - <<'PY'
          import json, os, zlib
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          C='https://fantasy.premierleague.com/api'
          D='https://draft.premierleague.com/api'
          cookie=os.getenv('FPL_SESSION_COOKIE','').strip()
          token=os.getenv('FPL_X_API_AUTHORIZATION','').strip()
          auth={'Accept':'application/json','User-Agent':'fpl-apex-proof/2','Referer':'https://fantasy.premierleague.com/'}
          if cookie: auth['Cookie']=cookie
          if token: auth['X-API-Authorization']=token if token.lower().startswith('bearer ') else 'Bearer '+token
          if not cookie and not token: raise SystemExit('owner credential missing')

          def get(url, use_auth=False):
              try:
                  h=auth if use_auth else {'Accept':'application/json','User-Agent':'fpl-apex-proof/2'}
                  with urlopen(Request(url,headers=h),timeout=25) as r:
                      return json.loads(r.read().decode())
              except HTTPError as e: raise RuntimeError(f'HTTP {e.code}') from None
              except URLError: raise RuntimeError('network failure') from None

          def names(boot):
              return {int(x['id']):str(x.get('web_name') or x.get('second_name') or x['id']) for x in boot.get('elements',[])}

          def live_map(payload):
              out={}
              rows=payload.get('elements',[]) if isinstance(payload,dict) else payload if isinstance(payload,list) else []
              for x in rows:
                  if not isinstance(x,dict): continue
                  pid=x.get('id',x.get('element'))
                  st=x.get('stats') if isinstance(x.get('stats'),dict) else x
                  pts=st.get('total_points',st.get('points'))
                  if pid is not None and pts is not None: out[int(pid)]=int(pts)
              return out

          def picks(payload):
              if not isinstance(payload,dict): return []
              for k in ('picks','elements','squad','team'):
                  v=payload.get(k)
                  if isinstance(v,list) and sum(isinstance(x,dict) and x.get('element',x.get('element_id')) is not None for x in v)>=11: return v
              for v in payload.values():
                  q=picks(v)
                  if q: return q
              return []

          boot=get(C+'/bootstrap-static/')
          nm=names(boot)
          events=boot.get('events',[])
          current=next((int(e['id']) for e in events if e.get('is_current') is True),None)
          if current is None:
              unfinished=[int(e['id']) for e in events if not e.get('finished')]
              current=min(unfinished) if unfinished else max(int(e['id']) for e in events if e.get('finished'))

          classic={}
          try:
              me=get(C+'/me/',True)
              if int(((me.get('player') or {}).get('entry'))) != 63984: raise RuntimeError('owner mismatch')
              mt=get(C+'/my-team/63984/',True)
              cur=mt.get('picks') or []
              locked=get(f'{C}/entry/63984/event/{current}/picks/')
              lp=live_map(get(f'{C}/event/{current}/live/'))
              lk=locked.get('picks') or []
              classic={'ok':1,'gw':current,'cur':[nm.get(int(x['element']),str(x['element'])) for x in sorted(cur,key=lambda y:int(y.get('position',99)))],
                       'locked':[[nm.get(int(x['element']),str(x['element'])),lp.get(int(x['element']),0),int(x.get('multiplier',0) or 0),1 if x.get('is_captain') else 0,1 if x.get('is_vice_captain') else 0] for x in sorted(lk,key=lambda y:int(y.get('position',99)))],
                       'pts':sum(lp.get(int(x['element']),0)*int(x.get('multiplier',0) or 0) for x in lk),
                       'api_pts':(locked.get('entry_history') or {}).get('points')}
          except Exception as e: classic={'ok':0,'err':str(e)}

          draft={}
          try:
              dyn=get(D+'/bootstrap-dynamic',True)
              leagues=dyn.get('leagues') if isinstance(dyn,dict) else None
              if isinstance(leagues,dict): leagues=list(leagues.values())
              if not isinstance(leagues,list): raise RuntimeError('no leagues payload')
              ids=[]
              for r in leagues:
                  if not isinstance(r,dict): continue
                  v=r.get('id',r.get('league_id'))
                  if v is not None:
                      try: ids.append(int(v))
                      except: pass
              matches=[]
              for lid in dict.fromkeys(ids):
                  try: det=get(f'{D}/league/{lid}/details',True)
                  except: continue
                  for ent in det.get('league_entries') or []:
                      if isinstance(ent,dict) and ent.get('entry_id') is not None and 'mcnuggets' in str(ent.get('entry_name') or '').casefold(): matches.append((lid,det,ent))
              if len(matches)!=1: raise RuntimeError(f'team matches={len(matches)}')
              lid,det,ent=matches[0]; eid=int(ent['entry_id'])
              db=get(D+'/bootstrap-static')
              dnm=names(db)
              ev=get(f'{D}/entry/{eid}/event/{current}',True)
              dl=live_map(get(f'{D}/event/{current}/live',True))
              ps=picks(ev)
              if len(ps)<11: raise RuntimeError(f'squad rows={len(ps)}')
              rows=[]; total=0
              for i,x in enumerate(ps,1):
                  pid=int(x.get('element',x.get('element_id'))); slot=int(x.get('position',i) or i); mul=x.get('multiplier'); starter=int(mul)>0 if mul is not None else slot<=11; pt=dl.get(pid)
                  if starter and pt is not None: total+=pt
                  rows.append([dnm.get(pid,str(pid)),pt,1 if starter else 0,slot])
              league=(det.get('league') or {}) if isinstance(det.get('league'),dict) else {}
              draft={'ok':1,'gw':current,'team':ent.get('entry_name'),'league':league.get('name'),'eid':eid,'squad':rows,'pts':total,'api_pts':(ev.get('entry_history') or {}).get('points') if isinstance(ev,dict) else None}
          except Exception as e: draft={'ok':0,'err':str(e)}

          for label,obj in [('classic',classic),('draft',draft)]:
              raw=json.dumps(obj,ensure_ascii=False,separators=(',',':')).encode()
              comp=zlib.compress(raw,9)
              if len(comp)>400: raise RuntimeError(f'{label} compact packet too large: {len(comp)}')
              open('/tmp/'+label+'.z','wb').write(comp)
          PY
          printf '%s\n' "$PROOF_PUBLIC_KEY" >/tmp/pub.pem
          for label in classic draft; do
            openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in "/tmp/${label}.z" -out "/tmp/${label}.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
            upper=$(echo "$label" | tr '[:lower:]' '[:upper:]')
            echo "APEX_${upper}_COMPACT=$(base64 -w0 "/tmp/${label}.enc")"
          done
          rm -f /tmp/classic.z /tmp/draft.z /tmp/classic.enc /tmp/draft.enc /tmp/pub.pem
