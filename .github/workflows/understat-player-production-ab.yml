name: Apex Understat Player Production A/B

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/apex_fpl/data/http.py"
      - "src/apex_fpl/models/projection.py"
      - "src/apex_fpl/evaluation/understat_player_ab.py"
      - "scripts/audit_understat_player_production_ab.py"
      - "scripts/audit_understat_player_cvar_phase.py"
      - "scripts/run_understat_player_production_ab_bounded.py"
      - "tests/test_http_cache.py"
      - "tests/test_projection.py"
      - "tests/test_understat_player_ab.py"
      - ".github/workflows/understat-player-production-ab.yml"

permissions:
  contents: read

concurrency:
  group: understat-production-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex + isolated AIrsenal worker
        run: |
          bash scripts/install_frozen_apex.sh
          bash scripts/install_pinned_airsenal.sh
      - name: Unit tests
        run: |
          "$APEX_CORE_PYTHON" -m pytest -q \
            tests/test_http_cache.py \
            tests/test_projection.py \
            tests/test_understat.py \
            tests/test_understat_players.py \
            tests/test_understat_player_ab.py
      - name: Lint bounded change
        run: |
          ruff check \
            src/apex_fpl/data/http.py \
            src/apex_fpl/models/projection.py \
            src/apex_fpl/evaluation/understat_player_ab.py \
            scripts/audit_understat_player_production_ab.py \
            scripts/audit_understat_player_cvar_phase.py \
            scripts/run_understat_player_production_ab_bounded.py \
            tests/test_http_cache.py \
            tests/test_projection.py \
            tests/test_understat_player_ab.py
      - name: Cache AIrsenal database
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v4-py3147
      - name: Cache official FPL HTTP payloads
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: data/cache
          key: official-fpl-2627-${{ runner.os }}-v1-${{ github.sha }}
          restore-keys: |
            official-fpl-2627-${{ runner.os }}-v1-
      - name: Refresh genuine AIrsenal forecasts
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            "$AIRSENAL_WORKER_BIN/airsenal_setup_initial_db" --fpl_team_id 1
          fi
          "$AIRSENAL_WORKER_PYTHON" scripts/update_airsenal_worker.py
          "$AIRSENAL_WORKER_PYTHON" scripts/run_airsenal_worker.py \
            --db "$AIRSENAL_DB_FILE" \
            --horizon 8 \
            --output data/generated/airsenal.csv
      - name: Warm official FPL cache
        run: |
          "$APEX_CORE_PYTHON" - <<'PY'
          from pathlib import Path

          from apex_fpl.data.http import CachedHttp
          from apex_fpl.data.official import OfficialFPLClient

          snapshot = OfficialFPLClient(CachedHttp(Path("data/cache"))).snapshot(force=True)
          print("official_bootstrap_sha256", snapshot.bootstrap_sha256)
          print("official_fixtures_sha256", snapshot.fixtures_sha256)
          PY
      - name: Reconfirm historical player predictive gate
        env:
          APEX_SEASON: "2026-2027"
        run: |
          "$APEX_CORE_PYTHON" scripts/audit_understat_player_signal.py \
            --source-season 2024 \
            --target-season 2025 \
            --minimum-minutes 450 \
            --bootstrap-samples 5000 \
            --output reports/understat_player_predictive_audit.json
      - name: Build one sealed production decision bundle
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          APEX_UNDERSTAT_PLAYER_MODEL_MODE: "shadow"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: |
          "$APEX_CORE_PYTHON" scripts/build_decision_bundle.py \
            --horizon 8 \
            --force \
            --bundle-dir data/generated/decision_bundle
      - name: Run baseline 256-scenario CVaR phase
        env:
          APEX_SEASON: "2026-2027"
        run: |
          "$APEX_CORE_PYTHON" scripts/audit_understat_player_cvar_phase.py \
            --surface baseline \
            --bundle-dir data/generated/decision_bundle \
            --historical-audit reports/understat_player_predictive_audit.json \
            --stochastic-scenarios 256 \
            --scenario-seed 20260807 \
            --output reports/understat_player_production_ab_baseline_cvar.json
      - name: Run challenger 256-scenario CVaR phase
        env:
          APEX_SEASON: "2026-2027"
        run: |
          "$APEX_CORE_PYTHON" scripts/audit_understat_player_cvar_phase.py \
            --surface challenger \
            --bundle-dir data/generated/decision_bundle \
            --historical-audit reports/understat_player_predictive_audit.json \
            --stochastic-scenarios 256 \
            --scenario-seed 20260807 \
            --output reports/understat_player_production_ab_challenger_cvar.json
      - name: Run exact regret and finalize identical-snapshot A/B
        env:
          APEX_SEASON: "2026-2027"
        run: |
          "$APEX_CORE_PYTHON" scripts/run_understat_player_production_ab_bounded.py \
            --bundle-dir data/generated/decision_bundle \
            --historical-audit reports/understat_player_predictive_audit.json \
            --baseline-cvar reports/understat_player_production_ab_baseline_cvar.json \
            --challenger-cvar reports/understat_player_production_ab_challenger_cvar.json \
            --stochastic-scenarios 256 \
            --scenario-seed 20260807 \
            --output reports/understat_player_production_ab.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: understat-player-production-ab-${{ github.run_id }}
          path: |
            reports/understat_player_predictive_audit.json
            reports/understat_player_predictive_panel.csv
            reports/understat_player_weight_grid.csv
            reports/understat_player_production_ab.json
            reports/understat_player_production_ab_baseline_cvar.json
            reports/understat_player_production_ab_challenger_cvar.json
            reports/understat_player_production_ab_rankings.csv
            reports/understat_player_production_ab_baseline_regret.csv
            reports/understat_player_production_ab_challenger_regret.csv
            reports/understat_player_production_ab_challenger_surface.csv
            data/generated/decision_bundle/
          retention-days: 30
