name: Bootstrap published Apex snapshot

# One-shot bootstrap helper. Creating this workflow triggers exactly one publish
# run. Later data commits do not touch this file, so the workflow stays dormant.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-publish.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run current full Apex gate
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: apex-fpl run --scenario both --horizon 8 --force
      - run: python scripts/publish_snapshot.py reports data/generated
      - name: Commit first repository-readable Apex result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/generated/apex_latest.json data/generated/apex_latest.md
          git commit -m "data: publish initial green Apex snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
