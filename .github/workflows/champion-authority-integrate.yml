name: Champion Authority Integration Patch

on:
  push:
    branches: [v2/champion-authority-chain]

permissions:
  contents: write

concurrency:
  group: champion-authority-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex CI environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Apply exact champion-authority publication integration
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}\nTARGET:\n{old}")
              p.write_text(text.replace(old, new, 1))

          # --- ProductionPublicationAuthorization becomes schema v2 and binds champion authority. ---
          path = "src/apex_fpl/core/production.py"
          replace_once(
              path,
              "    artifact_manifest_id: str\n    assurance_case_id: str\n",
              "    artifact_manifest_id: str\n    champion_generation_artifact_id: str | None\n    assurance_case_id: str\n",
          )
          replace_once(
              path,
              "    backend_qualification_artifact_ids: tuple[str, ...]\n    schema_version: int = 1\n\n    def __post_init__(self) -> None:\n        if self.schema_version != 1:\n            raise ValueError(\"unsupported ProductionPublicationAuthorization schema_version\")\n",
              "    backend_qualification_artifact_ids: tuple[str, ...]\n    schema_version: int = 2\n\n    def __post_init__(self) -> None:\n        if self.schema_version != 2:\n            raise ValueError(\"unsupported ProductionPublicationAuthorization schema_version\")\n",
          )
          replace_once(
              path,
              "        manifest_id = str(self.artifact_manifest_id).strip()\n        case_id = str(self.assurance_case_id).strip()\n",
              "        manifest_id = str(self.artifact_manifest_id).strip()\n        champion_raw = self.champion_generation_artifact_id\n        champion_artifact = None if champion_raw is None else str(champion_raw).strip()\n        case_id = str(self.assurance_case_id).strip()\n",
          )
          replace_once(
              path,
              "        if self.valid_until is not None and not valid_until:\n            raise ValueError(\"production authorization valid_until cannot be empty\")\n",
              "        if self.valid_until is not None and not valid_until:\n            raise ValueError(\"production authorization valid_until cannot be empty\")\n        if champion_raw is not None and not champion_artifact:\n            raise ValueError(\"production authorization champion generation cannot be empty\")\n        if champion_artifact is not None:\n            algorithm, separator, digest = champion_artifact.partition(\":\")\n            if algorithm != \"sha256\" or not separator or len(digest) != 64:\n                raise ValueError(\"production authorization champion generation must be sha256 identity\")\n            try:\n                int(digest, 16)\n            except ValueError as exc:\n                raise ValueError(\"production authorization champion generation digest is invalid\") from exc\n",
          )
          replace_once(
              path,
              "        object.__setattr__(self, \"artifact_manifest_id\", manifest_id)\n        object.__setattr__(self, \"assurance_case_id\", case_id)\n",
              "        object.__setattr__(self, \"artifact_manifest_id\", manifest_id)\n        object.__setattr__(self, \"champion_generation_artifact_id\", champion_artifact)\n        object.__setattr__(self, \"assurance_case_id\", case_id)\n",
          )
          replace_once(
              path,
              "            and self.bundle_id is not None\n            and self.world_id is not None\n            and self.valid_until is not None\n",
              "            and self.bundle_id is not None\n            and self.world_id is not None\n            and self.valid_until is not None\n            and self.champion_generation_artifact_id is not None\n",
          )
          replace_once(
              path,
              "            \"artifact_manifest_id\": self.artifact_manifest_id,\n            \"assurance_case_id\": self.assurance_case_id,\n",
              "            \"artifact_manifest_id\": self.artifact_manifest_id,\n            \"champion_generation_artifact_id\": self.champion_generation_artifact_id,\n            \"assurance_case_id\": self.assurance_case_id,\n",
          )

          # --- Cutover creates, seals and independently replays the authority binding. ---
          path = "src/apex_fpl/control/production_cutover.py"
          replace_once(
              path,
              "from apex_fpl.control.backend_operational_qualification import (\n    verify_backend_qualification_evidence,\n    verify_stored_backend_qualification_evidence,\n)\n",
              "from apex_fpl.control.backend_operational_qualification import (\n    verify_backend_qualification_evidence,\n    verify_stored_backend_qualification_evidence,\n)\nfrom apex_fpl.control.champion_authority import (\n    load_production_champion_generation,\n    verify_bundle_champion_authority,\n)\n",
          )
          replace_once(
              path,
              "    backend_qualification: ProductionBackendQualification,\n) -> tuple[str, ...]:\n",
              "    backend_qualification: ProductionBackendQualification,\n    champion_generation_artifact_id: str | None,\n) -> tuple[str, ...]:\n",
          )
          replace_once(
              path,
              "    if world_id is None:\n        blockers.append(\"production GlobalWorld identity is missing\")\n\n    created: datetime | None = None\n",
              "    if world_id is None:\n        blockers.append(\"production GlobalWorld identity is missing\")\n    if champion_generation_artifact_id is None:\n        blockers.append(\"production champion authority is missing\")\n\n    created: datetime | None = None\n",
          )
          replace_once(
              path,
              "    artifact_store: ArtifactStore,\n    production_registry: ProductionReleaseRegistry,\n) -> ProductionCutoverOutcome:\n",
              "    artifact_store: ArtifactStore,\n    production_registry: ProductionReleaseRegistry,\n    champion_generation_artifact_id: str | None = None,\n) -> ProductionCutoverOutcome:\n",
          )
          replace_once(
              path,
              "    claim_artifacts = _claim_artifacts(\n        assurance_case,\n        obligations_tuple,\n        artifact_store,\n        season=season,\n        as_of=created_at,\n        empirical_bindings=empirical_bindings,\n        verified_bundle=verified_bundle,\n    )\n    backend_artifacts = (\n",
              "    claim_artifacts = _claim_artifacts(\n        assurance_case,\n        obligations_tuple,\n        artifact_store,\n        season=season,\n        as_of=created_at,\n        empirical_bindings=empirical_bindings,\n        verified_bundle=verified_bundle,\n    )\n    champion_artifact_id: str | None = None\n    if champion_generation_artifact_id is not None:\n        champion_artifact_id = _verify_artifact(\n            artifact_store,\n            champion_generation_artifact_id,\n            label=\"production champion generation\",\n        )\n        if verified_bundle is None:\n            load_production_champion_generation(\n                champion_artifact_id,\n                as_of=created_at,\n                store=artifact_store,\n            )\n        else:\n            verify_bundle_champion_authority(\n                champion_artifact_id,\n                verified_bundle=verified_bundle,\n                as_of=created_at,\n                store=artifact_store,\n            )\n    backend_artifacts = (\n",
          )
          replace_once(
              path,
              "        assurance_case=assurance_case,\n        backend_qualification=backend_qualification,\n    )\n",
              "        assurance_case=assurance_case,\n        backend_qualification=backend_qualification,\n        champion_generation_artifact_id=champion_artifact_id,\n    )\n",
          )
          replace_once(
              path,
              "        artifact_manifest_id=manifest_id,\n        assurance_case_id=certificate.assurance_case_id,\n",
              "        artifact_manifest_id=manifest_id,\n        champion_generation_artifact_id=champion_artifact_id,\n        assurance_case_id=certificate.assurance_case_id,\n",
          )
          replace_once(
              path,
              "                release_record_artifact_id,\n                *((str(bundle_id),) if bundle_id is not None else ()),\n",
              "                release_record_artifact_id,\n                *((str(bundle_id),) if bundle_id is not None else ()),\n                *((champion_artifact_id,) if champion_artifact_id is not None else ()),\n",
          )
          replace_once(
              path,
              "        artifact_manifest_id=str(payload.get(\"artifact_manifest_id\") or \"\"),\n        assurance_case_id=str(payload.get(\"assurance_case_id\") or \"\"),\n",
              "        artifact_manifest_id=str(payload.get(\"artifact_manifest_id\") or \"\"),\n        champion_generation_artifact_id=_optional_string(\n            payload.get(\"champion_generation_artifact_id\"),\n            label=\"authorization champion_generation_artifact_id\",\n        ),\n        assurance_case_id=str(payload.get(\"assurance_case_id\") or \"\"),\n",
          )
          replace_once(
              path,
              "    empirical_bindings = _bundle_empirical_bindings(verified_bundle)\n    case = _replay_assurance_case(\n",
              "    empirical_bindings = _bundle_empirical_bindings(verified_bundle)\n    if authorization.champion_generation_artifact_id is not None:\n        if verified_bundle is None:\n            load_production_champion_generation(\n                authorization.champion_generation_artifact_id,\n                as_of=authorization.created_at,\n                store=artifact_store,\n            )\n        else:\n            verify_bundle_champion_authority(\n                authorization.champion_generation_artifact_id,\n                verified_bundle=verified_bundle,\n                as_of=authorization.created_at,\n                store=artifact_store,\n            )\n    case = _replay_assurance_case(\n",
          )
          replace_once(
              path,
              "        assurance_case=case,\n        backend_qualification=qualification,\n    )\n",
              "        assurance_case=case,\n        backend_qualification=qualification,\n        champion_generation_artifact_id=authorization.champion_generation_artifact_id,\n    )\n",
          )

          # --- Answer authority independently replays the generation a second time. ---
          path = "src/apex_fpl/control/production_authority.py"
          replace_once(
              path,
              "from apex_fpl.control.artifact_store import ArtifactStore\n",
              "from apex_fpl.control.artifact_store import ArtifactStore\nfrom apex_fpl.control.champion_authority import verify_bundle_champion_authority\n",
          )
          replace_once(
              path,
              "    if str(bundle.world_id) != record.world_id:\n        return _unavailable(key, \"production planning bundle world does not match ReleaseRecord\")\n\n    try:\n        qualification = load_production_backend_qualification(\n",
              "    if str(bundle.world_id) != record.world_id:\n        return _unavailable(key, \"production planning bundle world does not match ReleaseRecord\")\n    if authorization.champion_generation_artifact_id is None:\n        return _unavailable(key, \"publication authorization lacks production champion authority\")\n    try:\n        verify_bundle_champion_authority(\n            authorization.champion_generation_artifact_id,\n            verified_bundle=verified_bundle,\n            as_of=authorization.created_at,\n            store=artifact_store,\n        )\n    except (FileNotFoundError, ValueError) as exc:\n        return _unavailable(key, f\"current production champion authority is invalid: {exc}\")\n\n    try:\n        qualification = load_production_backend_qualification(\n",
          )

          # --- Production cutover test helper supplies real synthetic authority. ---
          path = "tests/test_v2_production_cutover.py"
          replace_once(
              path,
              "from backend_qualification_helpers import synthetic_production_backend_qualification\n",
              "from backend_qualification_helpers import synthetic_production_backend_qualification\nfrom champion_authority_helpers import synthetic_production_champion_authority\n",
          )
          replace_once(
              path,
              "    registry=None,\n    valid_until: str | None = VALID_UNTIL,\n):\n",
              "    registry=None,\n    valid_until: str | None = VALID_UNTIL,\n    with_champion_authority: bool = True,\n):\n",
          )
          replace_once(
              path,
              "    fixture = _fixture(store)\n    manifest = _artifact(store, \"manifest\")\n    claim_artifact = _artifact(store, \"claim\")\n",
              "    fixture = _fixture(store)\n    champion_artifact_id = (\n        synthetic_production_champion_authority(\n            store=store, fixture=fixture, reviewed_at=CREATED_AT\n        ).generation.artifact_id\n        if with_champion_authority\n        else None\n    )\n    manifest = _artifact(store, \"manifest\")\n    claim_artifact = _artifact(store, \"claim\")\n",
          )
          replace_once(
              path,
              "        production_registry=registry,\n    )\n\n\ndef test_production_cutover_publishes_only_after_complete_pass_and_exact_cas",
              "        production_registry=registry,\n        champion_generation_artifact_id=champion_artifact_id,\n    )\n\n\ndef test_production_cutover_publishes_only_after_complete_pass_and_exact_cas",
          )
          marker = "\n\ndef test_legacy_v1_bundle_is_rejected_before_pointer_write"
          insert = '''\n\ndef test_missing_champion_authority_is_withheld_without_pointer_write(tmp_path: Path) -> None:\n    store, registry, outcome = _execute(tmp_path, with_champion_authority=False)\n    assert outcome.report.status is ProductionCutoverStatus.WITHHELD\n    assert outcome.release_record.status is ReleaseStatus.WITHHELD\n    assert any("champion authority is missing" in item for item in outcome.report.cutover_blockers)\n    assert registry.current_release_id(ReleaseKey(SEASON, ENTRY, GAMEWEEK)) is None\n'''
          replace_once(path, marker, insert + marker)

          # --- Answer-authority success fixture supplies the same replay-valid authority. ---
          path = "tests/test_v2_production_authority.py"
          replace_once(
              path,
              "from backend_qualification_helpers import synthetic_production_backend_qualification\n",
              "from backend_qualification_helpers import synthetic_production_backend_qualification\nfrom champion_authority_helpers import synthetic_production_champion_authority\n",
          )
          replace_once(
              path,
              "    parity = synthetic_planning_parity_material(store=store, fixture=fixture)\n    evidence = _artifact(store, \"proof-evidence\")\n",
              "    parity = synthetic_planning_parity_material(store=store, fixture=fixture)\n    champion = synthetic_production_champion_authority(\n        store=store, fixture=fixture, reviewed_at=CREATED_AT\n    )\n    evidence = _artifact(store, \"proof-evidence\")\n",
          )
          replace_once(
              path,
              "        production_registry=registry,\n    )\n    return store, registry, outcome\n",
              "        production_registry=registry,\n        champion_generation_artifact_id=champion.generation.artifact_id,\n    )\n    return store, registry, outcome\n",
          )

          # Correct #87 commentary: stable empirical subject identity already existed centrally.
          path = "src/apex_fpl/control/empirical_qualification_admission.py"
          replace_once(
              path,
              "    DecisionPolicy embeds its qualification artifact in its own semantic payload. A\n    certificate therefore cannot hash the already-qualified payload without requiring an\n    impossible SHA fixed point. The empirical candidate is the exact substantive policy\n    before admission: SHADOW with no qualification artifact. Production replay first\n    requires that the materialized policy is QUALIFIED by the *same* retained certificate,\n    then normalizes only those two authority fields back to the candidate semantics.\n\n    Other subject kinds remain byte-for-byte semantic subjects.\n",
              "    The experiment core already derives a stable pre-qualification subject identity\n    by excluding qualification-state/artifact fields. This control-layer guard adds a stricter\n    production binding: a materialized DecisionPolicy must be QUALIFIED and must name the exact\n    retained certificate being replayed. Normalizing these two authority fields before calling\n    the central subject-identity helper is therefore redundant for identity but explicit about\n    the production transition being verified. Other subject kinds remain unchanged here.\n",
          )

          print("exact publication integration applied")
          PY
      - name: Run champion/cutover/answer authority regression surface
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_v2_champion_authority.py
          tests/test_v2_production_cutover.py
          tests/test_v2_production_authority.py
      - name: Ruff integrated authority surface
        run: >-
          .venv/bin/ruff check
          src/apex_fpl/core/champion_authority.py
          src/apex_fpl/core/production.py
          src/apex_fpl/control/champion_authority.py
          src/apex_fpl/control/empirical_qualification_admission.py
          src/apex_fpl/control/production_cutover.py
          src/apex_fpl/control/production_authority.py
          tests/champion_authority_helpers.py
          tests/test_v2_champion_authority.py
          tests/test_v2_production_cutover.py
          tests/test_v2_production_authority.py
      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/apex_fpl/core/production.py \
            src/apex_fpl/control/production_cutover.py \
            src/apex_fpl/control/production_authority.py \
            src/apex_fpl/control/empirical_qualification_admission.py \
            tests/test_v2_production_cutover.py \
            tests/test_v2_production_authority.py
          if git diff --cached --quiet; then
            echo "No integration diff to commit"
            exit 0
          fi
          git commit -m "Bind production publication to replayed champion authority"
          git push origin HEAD:v2/champion-authority-chain
