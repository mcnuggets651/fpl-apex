name: Apex V2 External Shadow Health

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apex-v2-shadow-health.yml"
      - "scripts/apex_v2_shadow_provider_ops.py"
  schedule:
    - cron: "15 7 * * *"
    - cron: "15 13 * * *"
    - cron: "15 19 * * *"

permissions:
  contents: read

concurrency:
  group: apex-v2-external-shadow-health
  cancel-in-progress: true

env:
  FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install diagnostic dependencies
        run: python -m pip install 'requests>=2.31' 'PyYAML>=6.0'

      - name: Materialize frozen provider provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FROZEN_APEX_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FROZEN_APEX_SHA"
          git show "$FROZEN_APEX_SHA:upstreams.lock.json" > "$RUNNER_TEMP/apex-v2-upstreams.lock.json"
          git show "$FROZEN_APEX_SHA:config/openfpl_training_policy.yaml" > "$RUNNER_TEMP/openfpl_training_policy.yaml"
          test -s "$RUNNER_TEMP/apex-v2-upstreams.lock.json"
          test -s "$RUNNER_TEMP/openfpl_training_policy.yaml"

      - name: Check Dastan frozen pin availability
        if: always()
        run: |
          python scripts/apex_v2_shadow_provider_ops.py dastan-pin-health \
            --lock "$RUNNER_TEMP/apex-v2-upstreams.lock.json" \
            --report artifacts/v2/diagnostics/external-shadow/dastan.json

      - name: Check PITCHSIDE external diagnostic
        if: always()
        run: |
          python scripts/apex_v2_shadow_provider_ops.py pitchside-health \
            --report artifacts/v2/diagnostics/external-shadow/pitchside.json

      - name: Check OpenFPL governed readiness
        if: always()
        run: |
          python scripts/apex_v2_shadow_provider_ops.py openfpl-readiness \
            --policy "$RUNNER_TEMP/openfpl_training_policy.yaml" \
            --lock "$RUNNER_TEMP/apex-v2-upstreams.lock.json" \
            --history-ref master \
            --report artifacts/v2/diagnostics/external-shadow/openfpl.json

      - name: Classify external diagnostic health
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/v2/diagnostics/external-shadow")
          dastan = json.loads((root / "dastan.json").read_text())
          pitchside = json.loads((root / "pitchside.json").read_text())
          openfpl = json.loads((root / "openfpl.json").read_text())
          print("### Apex V2 shadow-provider health")
          print(f"Dastan: {dastan.get('health')} / {dastan.get('state')} — pin={dastan.get('pinned_commit')}")
          print(
              f"PITCHSIDE: {pitchside.get('health')} — "
              f"decision_coverage={pitchside.get('decision_universe_coverage_ratio')} "
              f"age_h={pitchside.get('age_hours')} H1={pitchside.get('h1_available')} "
              f"H2-H8={pitchside.get('h2_h8_available')}"
          )
          print(
              f"OpenFPL: {openfpl.get('health')} / {openfpl.get('state')} — "
              f"exact-rule GWs={openfpl.get('exact_rule_gameweek_count')}/"
              f"{openfpl.get('minimum_exact_rule_gameweeks')} "
              f"history_sha={openfpl.get('observed_history_commit')}"
          )
          for provider in (dastan, pitchside, openfpl):
              health = str(provider.get("health") or "ERROR")
              if health in {"INCOMPLETE", "STALE"}:
                  print(
                      f"::warning::{provider.get('provider_id')} external diagnostic is {health}: "
                      f"{' ; '.join(provider.get('reasons') or [])}"
                  )
          if any(str(provider.get("health") or "ERROR") == "ERROR" for provider in (dastan, pitchside, openfpl)):
              raise SystemExit("shadow-provider monitor encountered an ERROR state")
          PY

      - name: Upload health diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apex-v2-external-shadow-health-${{ github.run_id }}
          path: artifacts/v2/diagnostics/external-shadow/
          if-no-files-found: error
          retention-days: 30
