name: Apex Joint Path Promotion Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/apply_joint_path_promotion.py"
      - "scripts/run_apex.py"
      - "tests/test_joint_path_promotion.py"
      - ".github/workflows/joint-path-promotion-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Apex + pinned AIrsenal worker
        run: bash scripts/install_pinned_airsenal.sh
      - name: Promotion unit tests
        run: pytest -q tests/test_joint_path_promotion.py tests/test_joint_initial_path.py
      - name: Cache AIrsenal database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v3
      - name: Refresh genuine AIrsenal forecasts
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then airsenal_setup_initial_db --fpl_team_id 1; fi
          python scripts/update_airsenal_worker.py
          python scripts/run_airsenal_worker.py --db "$AIRSENAL_DB_FILE" --horizon 8 --output data/generated/airsenal.csv
      - name: Build sealed GW1-GW8 decision bundle
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: python scripts/build_decision_bundle.py --horizon 8 --force
      - name: Run canonical Apex with guarded joint-path promotion
        run: python scripts/run_apex.py --horizon 8 --reuse-bundle --output-dir data/generated --bundle-dir data/generated/decision_bundle
      - name: Verify promoted canonical contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/generated/apex_recommendation_latest.json').read_text())
          context = json.loads(Path('data/generated/apex_answer_context.json').read_text())
          assert payload['ready_to_act'] is True
          assert context['safe_to_act'] is True
          rec = payload['recommendation']
          assert rec['selector'] == 'joint_gw1_gw8_transfer_path_maximum_ev'
          assert rec['gain_vs_static_path'] >= 0.25
          assert rec['planned_transfer_hit_cost'] == 0
          assert len(rec['squad']) == 15
          assert len(rec['xi']) == 11
          diag = payload['internal_diagnostics']['joint_initial_path']
          assert diag['promotion_gate']['promotion_candidate'] is True
          assert diag['candidate_pool_stable'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-path-promotion-${{ github.run_id }}
          path: |
            data/generated/apex_recommendation_latest.json
            data/generated/apex_answer_context.json
            data/generated/pinnacle_latest.json
          retention-days: 90
