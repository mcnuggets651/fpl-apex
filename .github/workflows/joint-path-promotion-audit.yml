name: Apex Adaptive Strategy Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/apex.yaml"
      - "src/apex_fpl/config.py"
      - "src/apex_fpl/data/http.py"
      - "src/apex_fpl/models/ensemble.py"
      - "src/apex_fpl/optimisation/transfers.py"
      - "src/apex_fpl/optimisation/transfer_views.py"
      - "src/apex_fpl/services/data_quality.py"
      - "src/apex_fpl/services/enrichment.py"
      - "src/apex_fpl/services/joint_initial_path.py"
      - "src/apex_fpl/services/strategy.py"
      - "src/apex_fpl/services/player_truth.py"
      - "src/apex_fpl/services/player_evidence.py"
      - "src/apex_fpl/services/answer_context.py"
      - "src/apex_fpl/services/integrity.py"
      - "src/apex_fpl/models/projection.py"
      - "scripts/apply_joint_path_promotion.py"
      - "scripts/build_canonical_recommendation.py"
      - "scripts/audit_player_truth.py"
      - "scripts/run_apex.py"
      - "tests/test_http_cache.py"
      - "tests/test_transfers.py"
      - "tests/test_transfer_candidate_pool.py"
      - "tests/test_joint_path_promotion.py"
      - "tests/test_joint_initial_path.py"
      - "tests/test_strategy.py"
      - "tests/test_player_truth.py"
      - "tests/test_answer_context.py"
      - "tests/test_canonical_recommendation.py"
      - "tests/test_data_quality.py"
      - "tests/test_ensemble.py"
      - "tests/test_low_sample_attack_reliability.py"
      - "tests/test_weight_contract.py"
      - ".github/workflows/joint-path-promotion-audit.yml"

permissions:
  contents: read

concurrency:
  group: adaptive-strategy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"

      - name: Install frozen Apex + isolated AIrsenal worker
        run: |
          bash scripts/install_frozen_apex.sh
          bash scripts/install_pinned_airsenal.sh

      - name: Strategy and truth unit tests
        run: |
          "$APEX_CORE_PYTHON" -m pytest -q \
            tests/test_http_cache.py \
            tests/test_transfers.py \
            tests/test_transfer_candidate_pool.py \
            tests/test_joint_path_promotion.py \
            tests/test_joint_initial_path.py \
            tests/test_strategy.py \
            tests/test_player_truth.py \
            tests/test_answer_context.py \
            tests/test_canonical_recommendation.py \
            tests/test_data_quality.py \
            tests/test_ensemble.py \
            tests/test_low_sample_attack_reliability.py \
            tests/test_weight_contract.py

      - name: Cache AIrsenal database
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v4-py3147

      - name: Cache official FPL HTTP payloads
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: data/cache
          key: official-fpl-2627-${{ runner.os }}-v1-${{ github.sha }}
          restore-keys: |
            official-fpl-2627-${{ runner.os }}-v1-

      - name: Refresh genuine AIrsenal forecasts
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            "$AIRSENAL_WORKER_BIN/airsenal_setup_initial_db" --fpl_team_id 1
          fi
          "$AIRSENAL_WORKER_PYTHON" scripts/update_airsenal_worker.py
          "$AIRSENAL_WORKER_PYTHON" scripts/run_airsenal_worker.py \
            --db "$AIRSENAL_DB_FILE" \
            --horizon 8 \
            --output data/generated/airsenal.csv

      - name: Warm official FPL cache
        run: |
          "$APEX_CORE_PYTHON" - <<'PY'
          from pathlib import Path

          from apex_fpl.data.http import CachedHttp
          from apex_fpl.data.official import OfficialFPLClient

          snapshot = OfficialFPLClient(CachedHttp(Path("data/cache"))).snapshot(force=True)
          print("official_bootstrap_sha256", snapshot.bootstrap_sha256)
          print("official_fixtures_sha256", snapshot.fixtures_sha256)
          PY

      - name: Build sealed GW1-GW8 decision bundle
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: "$APEX_CORE_PYTHON" scripts/build_decision_bundle.py --horizon 8 --force

      - name: Generate Pinnacle surface for independent parity
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        shell: bash
        run: |
          set +e
          "$APEX_CORE_PYTHON" scripts/run_pinnacle.py \
            --horizon 8 \
            --stochastic-scenarios 256 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --bundle-dir data/generated/decision_bundle
          status=$?
          set -e
          test -s data/generated/pinnacle_latest.json
          if [ "$status" -ne 0 ]; then
            "$APEX_CORE_PYTHON" - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/generated/pinnacle_latest.json").read_text())
          blockers = (payload.get("pinnacle_gate") or {}).get("blockers") or []
          assert blockers == ["required independent solver parity snapshot is not embedded"], blockers
          PY
          fi
          "$APEX_CORE_PYTHON" scripts/export_open_solver.py \
            reports/players.csv reports/projections.csv /tmp/apex.csv \
            --projection-col xp

      - name: Read pinned independent solver revision
        id: parity-pin
        shell: bash
        run: |
          "$APEX_CORE_PYTHON" - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          source = json.load(open("upstreams.lock.json", encoding="utf-8"))["sources"]["open_fpl_solver"]
          print(f"repository={source['repository']}")
          print(f"sha={source['commit']}")
          PY

      - name: Run and embed same-surface independent parity in isolated worker
        shell: bash
        run: |
          set -euo pipefail
          solver="$RUNNER_TEMP/open-fpl-solver"
          uv_bootstrap="$RUNNER_TEMP/reference-solver-uv-bootstrap"
          rm -rf "$solver" "$uv_bootstrap"
          "$APEX_CORE_PYTHON" -m venv "$uv_bootstrap"
          "$uv_bootstrap/bin/python" -m pip install --no-deps uv==0.12.3
          "$uv_bootstrap/bin/uv" python install 3.14.7
          git clone --filter=blob:none \
            "https://github.com/${{ steps.parity-pin.outputs.repository }}.git" \
            "$solver"
          git -C "$solver" checkout --detach "${{ steps.parity-pin.outputs.sha }}"
          cp /tmp/apex.csv "$solver/data/apex.csv"
          "$uv_bootstrap/bin/uv" sync \
            --frozen \
            --project "$solver" \
            --python 3.14.7 \
            --no-dev
          "$solver/.venv/bin/python" "$solver/run/solve.py" \
            --config "$GITHUB_WORKSPACE/config/open_solver_parity.json" \
            --datasource apex \
            --horizon 8
          RESULT="$(ls -t "$solver"/data/results/apex_*.csv | head -1)"
          "$APEX_CORE_PYTHON" scripts/compare_solver_parity.py \
            data/generated/pinnacle_latest.json "$RESULT"
          "$APEX_CORE_PYTHON" scripts/embed_solver_parity.py \
            data/generated/pinnacle_latest.json \
            data/generated/solver_parity.json

      - name: Run canonical Apex with final strategy policy
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: |
          "$APEX_CORE_PYTHON" scripts/run_apex.py \
            --horizon 8 \
            --reuse-pinnacle \
            --output-dir data/generated \
            --bundle-dir data/generated/decision_bundle

      - name: Verify final canonical contract
        run: |
          "$APEX_CORE_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('data/generated/apex_recommendation_latest.json').read_text())
          context = json.loads(Path('data/generated/apex_answer_context.json').read_text())
          truth = json.loads(Path('reports/player_truth_audit.json').read_text())

          assert payload['strategy_stage'] == 'final_validated'
          assert payload['strategy_base_ready'] is True
          assert payload['ready_to_act'] is True
          assert context['safe_to_act'] is True
          assert truth['ready'] is True
          assert truth['hard_fact_coverage'] == 1.0
          assert truth['canonical_projection_pair_coverage'] == 1.0

          expected_pairs = int(truth['player_count']) * len(truth['gameweeks'])
          present_pairs = round(
              float(truth['airsenal_projection_pair_coverage']) * expected_pairs
          )
          absent_pairs = int(truth['airsenal_source_absent_pair_count'])
          assert present_pairs + absent_pairs == expected_pairs
          assert not truth['blockers']
          assert truth['player_count'] == payload['official_snapshot']['players']

          rec = payload['recommendation']
          assert rec['selector'] in {
              'adaptive_gw1_launch_with_transfer_option_value',
              'receding_horizon_current_team_maximum_ev',
          }
          assert rec['selector'] != 'exact_horizon_maximum_ev'
          assert len(rec['squad']) == 15
          assert len(rec['xi']) == 11
          assert rec['captain_id'] != rec['vice_captain_id']

          final_evidence = payload['final_selected_player_evidence']
          assert final_evidence['contract'] == 'apex-player-evidence-v2'
          assert final_evidence['coverage']['ready'] is True
          squad_ids = {int(row['player_id']) for row in rec['squad']}
          dossier_ids = {int(row['player_id']) for row in final_evidence['dossiers']}
          assert len(squad_ids) == 15
          assert dossier_ids == squad_ids

          if rec['selector'] == 'adaptive_gw1_launch_with_transfer_option_value':
              diag = payload['internal_diagnostics']['joint_initial_path']
              gate = diag['promotion_gate']
              assert diag['status'] == 'optimal'
              assert diag['candidate_pool_stable'] is True
              assert gate['gw1_first_optimal'] is True
              assert gate['gw1_floor_respected'] is True
              assert gate['promotion_candidate'] is True
              assert rec['gw1_regret_vs_max'] <= rec['gw1_regret_tolerance'] + 1e-9
              assert rec['future_moves_are_contingent'] is True
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: adaptive-strategy-${{ github.run_id }}
          path: |
            data/generated/apex_recommendation_latest.json
            data/generated/apex_recommendation_latest.md
            data/generated/apex_answer_context.json
            data/generated/pinnacle_latest.json
            data/generated/solver_parity.json
            reports/player_truth_audit.json
            reports/player_truth_audit.csv
            reports/players.csv
            reports/projections.csv
          retention-days: 90
