name: AIrsenal forecast worker

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: apex-airsenal-validation
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"

      - name: Install frozen Apex validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "APEX_CORE_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Read pinned AIrsenal revision
        id: pin
        shell: bash
        run: |
          "$APEX_CORE_PYTHON" - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("upstreams.lock.json", encoding="utf-8"))
          source = lock["sources"]["airsenal"]
          print(f"repository={source['repository']}")
          print(f"sha={source['commit']}")
          PY

      - name: Cache AIrsenal database
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .airsenal
          key: ${{ runner.os }}-airsenal-${{ steps.pin.outputs.sha }}-py3147-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-airsenal-${{ steps.pin.outputs.sha }}-py3147-

      - name: Install frozen isolated AIrsenal worker
        shell: bash
        run: bash scripts/install_pinned_airsenal.sh

      - name: Build/update AIrsenal database and forecasts
        env:
          AIRSENAL_HOME: ${{ github.workspace }}/.airsenal
          AIRSENAL_DB_FILE: ${{ github.workspace }}/.airsenal/data.db
          FPL_TEAM_ID: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AIRSENAL_HOME"
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            "$AIRSENAL_WORKER_BIN/airsenal_setup_initial_db" --fpl_team_id 1
          fi
          "$AIRSENAL_WORKER_PYTHON" "$GITHUB_WORKSPACE/scripts/update_airsenal_worker.py"
          "$APEX_CORE_PYTHON" scripts/patch_airsenal_positions.py \
            "$AIRSENAL_DB_FILE" \
            "$AIRSENAL_WORKER_CHECKOUT"
          "$AIRSENAL_WORKER_PYTHON" "$GITHUB_WORKSPACE/scripts/run_airsenal_worker.py" \
            --db "$AIRSENAL_DB_FILE" \
            --horizon 8 \
            --output "$GITHUB_WORKSPACE/data/generated/airsenal.csv"

      - name: Validate Apex integration
        shell: bash
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/apex-fpl" run --scenario both --horizon 8 --force
          "$APEX_CORE_PYTHON" - <<'PY'
          import json
          report = json.load(open("reports/latest.json", encoding="utf-8"))
          sources = {row["name"]: row for row in report["sources"]}
          air = sources.get("airsenal", {})
          print("AIrsenal source:", air)
          if not air.get("ok") or not air.get("configured"):
              raise SystemExit("Apex rejected the generated AIrsenal forecast")
          PY

      - name: Assert validated forecast remains outside source control
        shell: bash
        run: |
          set -euo pipefail
          test -s data/generated/airsenal.csv
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "Validated forecast is a runtime artifact; no source commit is permitted."

      - name: Upload worker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airsenal-validation-${{ github.run_id }}
          path: |
            data/generated/airsenal.csv
            reports/
            data/snapshots/latest.json
          retention-days: 30
