name: Apex Canonical Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/adaptive-canonical-diagnostic.yml"
      - "scripts/run_apex.py"
      - "scripts/run_pinnacle.py"
      - "scripts/export_open_solver.py"
      - "scripts/build_open_solver_parity_input.py"
      - "scripts/run_open_solver_parity.py"
      - "scripts/compare_solver_parity.py"
      - "scripts/embed_solver_parity.py"
      - "scripts/apply_joint_path_promotion.py"
      - "scripts/apply_joint_path_promotion_rebased.py"
      - "src/apex_fpl/services/finalized_stability.py"
      - "src/apex_fpl/services/cached_launch.py"
      - "src/apex_fpl/services/selection_reality.py"
      - "data/manual/specialist_predictions.csv"
      - "data/manual/squad_hierarchy.csv"
      - "data/manual/transfer_checks.csv"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_DIR: data/generated/runs/${{ github.run_id }}
      BUNDLE_DIR: data/generated/runs/${{ github.run_id }}/decision_bundle
      PARITY_DIR: data/generated/runs/${{ github.run_id }}/open_solver_parity_input
      AIRSENAL_CSV: data/generated/runs/${{ github.run_id }}/airsenal.csv
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create empty generation namespace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUN_DIR"
          mkdir -p "$RUN_DIR"
          test ! -e "$RUN_DIR/pinnacle_latest.json"
          test ! -e "$RUN_DIR/solver_parity.json"
          test ! -e "$RUN_DIR/apex_recommendation_latest.json"

      - name: Install Apex + pinned AIrsenal worker
        run: bash scripts/install_pinned_airsenal.sh

      - name: Cache AIrsenal database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v3

      - name: Cache official FPL HTTP payloads
        uses: actions/cache@v4
        with:
          path: data/cache
          key: official-fpl-2627-${{ runner.os }}-v1-${{ github.sha }}
          restore-keys: |
            official-fpl-2627-${{ runner.os }}-v1-

      - name: Refresh genuine AIrsenal forecasts
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then airsenal_setup_initial_db --fpl_team_id 1; fi
          python scripts/update_airsenal_worker.py
          python scripts/run_airsenal_worker.py --db "$AIRSENAL_DB_FILE" --horizon 8 --output "$AIRSENAL_CSV"

      - name: Warm official FPL cache
        run: |
          python - <<'PY'
          from pathlib import Path
          from apex_fpl.data.http import CachedHttp
          from apex_fpl.data.official import OfficialFPLClient
          snapshot = OfficialFPLClient(CachedHttp(Path("data/cache"))).snapshot(force=True)
          print("official_bootstrap_sha256", snapshot.bootstrap_sha256)
          print("official_fixtures_sha256", snapshot.fixtures_sha256)
          PY

      - name: Build sealed actionable-horizon decision bundle
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: ${{ env.AIRSENAL_CSV }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: python scripts/build_decision_bundle.py --horizon 8 --force --bundle-dir "$BUNDLE_DIR"

      - name: Generate Pinnacle surface for independent parity
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: ${{ env.AIRSENAL_CSV }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        shell: bash
        run: |
          set +e
          python scripts/run_pinnacle.py \
            --horizon 8 \
            --stochastic-scenarios 256 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --bundle-dir "$BUNDLE_DIR" \
            --output-dir "$RUN_DIR"
          status=$?
          set -e
          test -s "$RUN_DIR/pinnacle_latest.json"
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUN_DIR"]) / "pinnacle_latest.json"
          payload = json.loads(path.read_text())
          blockers = (payload.get("pinnacle_gate") or {}).get("blockers") or []
          assert blockers == ["required independent solver parity snapshot is not embedded"], blockers
          PY
          fi
          python scripts/export_open_solver.py "$BUNDLE_DIR" /tmp/apex.csv --projection-col xp

      - name: Read pinned independent solver revision
        id: parity-pin
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          source = json.load(open("upstreams.lock.json", encoding="utf-8"))["sources"]["open_fpl_solver"]
          print(f"repository={source['repository']}")
          print(f"sha={source['commit']}")
          PY

      - name: Build sealed independent parity input
        run: |
          python scripts/build_open_solver_parity_input.py \
            --bundle-dir "$BUNDLE_DIR" \
            --apex-csv /tmp/apex.csv \
            --base-config config/open_solver_parity.json \
            --output-dir "$PARITY_DIR" \
            --external-repository "${{ steps.parity-pin.outputs.repository }}" \
            --external-sha "${{ steps.parity-pin.outputs.sha }}"

      - name: Run and embed same-surface independent parity
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv
          git clone --filter=blob:none \
            "https://github.com/${{ steps.parity-pin.outputs.repository }}.git" \
            "$RUNNER_TEMP/open-fpl-solver"
          git -C "$RUNNER_TEMP/open-fpl-solver" checkout --detach \
            "${{ steps.parity-pin.outputs.sha }}"
          cd "$RUNNER_TEMP/open-fpl-solver"
          uv sync
          cd "$GITHUB_WORKSPACE"
          uv run --project "$RUNNER_TEMP/open-fpl-solver" python scripts/run_open_solver_parity.py \
            --solver-root "$RUNNER_TEMP/open-fpl-solver" \
            --input-dir "$PARITY_DIR" \
            --result "$RUN_DIR/open_solver_result.csv" \
            --execution-manifest "$RUN_DIR/open_solver_execution.json"
          python scripts/compare_solver_parity.py \
            "$RUN_DIR/pinnacle_latest.json" "$RUN_DIR/open_solver_result.csv"
          python scripts/embed_solver_parity.py \
            "$RUN_DIR/pinnacle_latest.json" "$RUN_DIR/solver_parity.json"

      - name: Run canonical Apex and retain failure state
        id: canonical
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: ${{ env.AIRSENAL_CSV }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        shell: bash
        run: |
          set +e
          python scripts/run_apex.py \
            --horizon 8 \
            --reuse-pinnacle \
            --output-dir "$RUN_DIR" \
            --bundle-dir "$BUNDLE_DIR"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize canonical diagnostics
        if: always()
        env:
          CANONICAL_EXIT_CODE: ${{ steps.canonical.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_dir = Path(os.environ["RUN_DIR"])
          path = run_dir / "apex_recommendation_latest.json"
          print("canonical_exit_code", os.environ.get("CANONICAL_EXIT_CODE"))
          if not path.exists():
              print("canonical_output_missing=true")
              raise SystemExit(0)
          payload = json.loads(path.read_text(encoding="utf-8"))
          diag = (payload.get("internal_diagnostics") or {}).get("joint_initial_path") or {}
          selected = diag.get("selected") or {}
          reality = (payload.get("internal_diagnostics") or {}).get("selection_reality") or {}
          summary = {
              "decision_bundle_id": payload.get("decision_bundle_id"),
              "gameweeks": payload.get("gameweeks") or [],
              "ready_to_act": payload.get("ready_to_act"),
              "safe_to_act": payload.get("safe_to_act"),
              "blockers": payload.get("blockers") or [],
              "warnings": payload.get("warnings") or [],
              "strategy_stage": payload.get("strategy_stage"),
              "joint_status": diag.get("status"),
              "candidate_pool_stable": diag.get("candidate_pool_stable"),
              "promotion_gate": diag.get("promotion_gate"),
              "joint_note": diag.get("note"),
              "selected_squad_ids": selected.get("squad_ids") or [],
              "selected_squad_names": selected.get("squad_names") or [],
              "first_gw_expected_points": selected.get("gw1_expected_points"),
              "future_objective": selected.get("future_objective"),
              "starting_bank": selected.get("starting_bank"),
              "reality_ready": reality.get("ready"),
              "reality_blockers": reality.get("blockers") or [],
              "reality_warnings": reality.get("warnings") or [],
          }
          print(json.dumps(summary, indent=2))
          (run_dir / "canonical_diagnostic_summary.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload canonical diagnostic generation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-diagnostic-${{ github.run_id }}
          path: ${{ env.RUN_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Fail diagnostic if canonical was nonzero
        if: always()
        env:
          CANONICAL_EXIT_CODE: ${{ steps.canonical.outputs.exit_code }}
        run: |
          test "${CANONICAL_EXIT_CODE:-1}" -eq 0
