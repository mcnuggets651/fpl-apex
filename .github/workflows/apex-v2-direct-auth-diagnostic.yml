# INCIDENT-ONLY, NON-SERVING DIAGNOSTIC.
# This workflow proves whether the repository's direct FPL bearer/cookie can
# authenticate the configured manager through the frozen owner preflight.
# It deliberately disables refresh auth and has no schedule, push trigger,
# write permission, provider acquisition, intent, solve or publication path.
# It is not a fallback keepalive and cannot rebuild a rotating refresh-token chain.
name: Apex V2 Direct Auth Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  verify-direct-owner-auth:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FROZEN_APEX_SHA }}
          fetch-depth: 0

      - name: Verify frozen diagnostic identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          echo "Apex V2 direct-auth diagnostic pinned to $FROZEN_APEX_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen Apex V2 tooling
        run: pip install -e '.[dev]'

      - name: Verify direct owner credential only
        env:
          FPL_X_API_AUTHORIZATION: ${{ secrets.FPL_X_API_AUTHORIZATION }}
          FPL_SESSION_COOKIE: ${{ secrets.FPL_SESSION_COOKIE }}
          FPL_REFRESH_TOKEN: ""
          FPL_REFRESH_WRAP_KEY: ""
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight_fpl_auth.py --config config/apex_v2.yaml

      - name: Prove non-serving frozen worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
