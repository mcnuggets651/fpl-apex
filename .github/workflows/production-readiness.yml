name: Apex Unified Readiness Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-unified-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"

      - name: Install frozen Apex + isolated AIrsenal worker
        run: |
          bash scripts/install_frozen_apex.sh
          bash scripts/install_pinned_airsenal.sh

      - name: Run deterministic repository tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$APEX_CORE_PYTHON" -m pytest -q
          ruff check src tests scripts
          "$APEX_CORE_PYTHON" scripts/check_upstreams.py
          "$APEX_CORE_PYTHON" scripts/check_governance_consistency.py

      - name: Restore Apex runtime cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: data/cache
          key: apex-unified-readiness-${{ github.run_id }}
          restore-keys: |
            apex-unified-runtime-2627-
            apex-pinnacle-runtime-2627-
            apex-runtime-2627-

      - name: Cache AIrsenal database
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v4-py3147

      - name: Refresh genuine AIrsenal worker
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            "$AIRSENAL_WORKER_BIN/airsenal_setup_initial_db" --fpl_team_id 1
          fi
          "$AIRSENAL_WORKER_PYTHON" scripts/update_airsenal_worker.py
          "$AIRSENAL_WORKER_PYTHON" scripts/run_airsenal_worker.py \
            --db "$AIRSENAL_DB_FILE" \
            --horizon 8 \
            --output data/generated/airsenal.csv

      - name: Generate Pinnacle surface for same-surface parity
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        shell: bash
        run: |
          set -euo pipefail
          "$APEX_CORE_PYTHON" scripts/build_decision_bundle.py \
            --horizon 8 \
            --bundle-dir data/generated/decision_bundle \
            --force

          set +e
          "$APEX_CORE_PYTHON" scripts/run_pinnacle.py \
            --horizon 8 \
            --stochastic-scenarios 256 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --bundle-dir data/generated/decision_bundle
          status=$?
          set -e

          test -s data/generated/pinnacle_latest.json
          if [ "$status" -ne 0 ]; then
            "$APEX_CORE_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/generated/pinnacle_latest.json").read_text())
          blockers = (payload.get("pinnacle_gate") or {}).get("blockers") or []
          parity_bootstrap = [
              "required independent solver parity snapshot is not embedded"
          ]
          if payload.get("pinnacle_ready") is not False or blockers != parity_bootstrap:
              raise SystemExit(
                  "Pinnacle readiness failed before same-surface parity bootstrap: "
                  + "; ".join(blockers)
              )
          print("Pinnacle surface complete; advancing to same-surface parity.")
          PY
          fi

          "$APEX_CORE_PYTHON" scripts/export_open_solver.py \
            reports/players.csv reports/projections.csv /tmp/apex.csv \
            --projection-col xp

      - name: Read pinned independent solver revision
        id: parity-pin
        shell: bash
        run: |
          "$APEX_CORE_PYTHON" - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          source = json.load(open("upstreams.lock.json", encoding="utf-8"))["sources"]["open_fpl_solver"]
          print(f"repository={source['repository']}")
          print(f"sha={source['commit']}")
          PY

      - name: Run and embed same-surface independent parity in isolated worker
        shell: bash
        run: |
          set -euo pipefail
          solver="$RUNNER_TEMP/open-fpl-solver"
          uv_bootstrap="$RUNNER_TEMP/reference-solver-uv-bootstrap"
          rm -rf "$solver" "$uv_bootstrap"
          "$APEX_CORE_PYTHON" -m venv "$uv_bootstrap"
          "$uv_bootstrap/bin/python" -m pip install --no-deps uv==0.12.3
          "$uv_bootstrap/bin/uv" python install 3.14.7
          git clone --filter=blob:none \
            "https://github.com/${{ steps.parity-pin.outputs.repository }}.git" \
            "$solver"
          git -C "$solver" checkout --detach "${{ steps.parity-pin.outputs.sha }}"
          cp /tmp/apex.csv "$solver/data/apex.csv"
          "$uv_bootstrap/bin/uv" sync \
            --frozen \
            --project "$solver" \
            --python 3.14.7 \
            --no-dev
          "$solver/.venv/bin/python" "$solver/run/solve.py" \
            --config "$GITHUB_WORKSPACE/config/open_solver_parity.json" \
            --datasource apex \
            --horizon 8
          RESULT="$(ls -t "$solver"/data/results/apex_*.csv | head -1)"
          "$APEX_CORE_PYTHON" scripts/compare_solver_parity.py \
            data/generated/pinnacle_latest.json "$RESULT"
          "$APEX_CORE_PYTHON" scripts/embed_solver_parity.py \
            data/generated/pinnacle_latest.json \
            data/generated/solver_parity.json

      - name: Run canonical Apex readiness audit
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: |
          "$APEX_CORE_PYTHON" scripts/run_apex.py \
            --horizon 8 \
            --stochastic-scenarios 256 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --reuse-pinnacle \
            --force

      - name: Upload unified readiness artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apex-unified-readiness-${{ github.run_id }}
          path: |
            data/generated/apex_recommendation_latest.json
            data/generated/apex_recommendation_latest.md
            data/generated/pinnacle_latest.json
            data/generated/solver_parity.json
            data/generated/elite_latest.json
            data/generated/decision_bundle/
            reports/
            data/generated/airsenal.csv
          retention-days: 30
