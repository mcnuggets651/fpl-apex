name: Apex V2 Core Readiness Audit

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional exact 40-character Apex V2 core SHA. Empty uses the authority-declared production core.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apex-v2-core-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve exact core SHA
        id: core
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_SHA="$(python - <<'PY'
          import json
          print(json.load(open("docs/APEX_V2_AUTHORITY.json", encoding="utf-8"))["frozen_engine_sha"])
          PY
          )"
          CORE_SHA="${REQUESTED_SHA:-$DEFAULT_SHA}"
          [[ "$CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$CORE_SHA"
          git cat-file -e "$CORE_SHA^{commit}"
          echo "sha=$CORE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$CORE_SHA" = "$DEFAULT_SHA" ]; then
            echo "mode=production-core" >> "$GITHUB_OUTPUT"
          else
            echo "mode=non-serving-candidate" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize exact core in detached worktree
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          CORE="$RUNNER_TEMP/apex-v2-readiness-core"
          rm -rf "$CORE"
          git worktree add --detach "$CORE" '${{ steps.core.outputs.sha }}'
          test "$(git -C "$CORE" rev-parse HEAD)" = '${{ steps.core.outputs.sha }}'
          test -f "$CORE/src/apex/runtime/solve.py"
          test -f "$CORE/scripts/check_v2_architecture.py"
          echo "path=$CORE" >> "$GITHUB_OUTPUT"

      - name: Install selected immutable core
        shell: bash
        run: |
          set -euo pipefail
          CORE='${{ steps.materialize.outputs.path }}'
          if [ -f "$CORE/requirements-v2.lock" ]; then
            python -m pip install -c "$CORE/requirements-v2.lock" -e "$CORE[dev]"
          else
            python -m pip install -e "$CORE[dev]"
          fi
          python -m pip check

      - name: Verify architecture and CLI
        shell: bash
        run: |
          set -euo pipefail
          CORE='${{ steps.materialize.outputs.path }}'
          python "$CORE/scripts/check_v2_architecture.py"
          apex-v2 --help >/dev/null

      - name: Run complete V2 contract
        shell: bash
        run: |
          set -euo pipefail
          CORE='${{ steps.materialize.outputs.path }}'
          mkdir -p artifacts/v2-readiness
          if [ -f "$CORE/scripts/check_v2_critical_coverage.py" ]; then
            pytest -q "$CORE"/tests/test_apex_v2_*.py "$CORE"/tests/test_v2_*.py \
              --cov=apex --cov-branch \
              --cov-report=term-missing \
              --cov-report=json:artifacts/v2-readiness/coverage.json
            python "$CORE/scripts/check_v2_critical_coverage.py" artifacts/v2-readiness/coverage.json
          else
            pytest -q "$CORE"/tests/test_apex_v2_*.py "$CORE"/tests/test_v2_*.py
          fi

      - name: Run mutation sentinels when supported
        shell: bash
        run: |
          set -euo pipefail
          CORE='${{ steps.materialize.outputs.path }}'
          if [ -f "$CORE/scripts/run_v2_mutation_sentinels.py" ]; then
            (cd "$CORE" && python scripts/run_v2_mutation_sentinels.py)
          else
            echo "Selected core predates mutation sentinel gate."
          fi

      - name: Lint selected core assurance surface
        shell: bash
        run: |
          set -euo pipefail
          CORE='${{ steps.materialize.outputs.path }}'
          ruff check "$CORE/src/apex" "$CORE"/tests/test_apex_v2_*.py "$CORE"/tests/test_v2_*.py "$CORE/scripts/check_v2_architecture.py"
          if [ -f "$CORE/scripts/check_v2_critical_coverage.py" ]; then
            ruff check "$CORE/scripts/check_v2_critical_coverage.py"
          fi
          if [ -f "$CORE/scripts/run_v2_mutation_sentinels.py" ]; then
            ruff check "$CORE/scripts/run_v2_mutation_sentinels.py"
          fi

      - name: Report read-only readiness result
        shell: bash
        run: |
          printf 'Apex V2 readiness passed\ncore_sha=%s\nmode=%s\n' \
            '${{ steps.core.outputs.sha }}' '${{ steps.core.outputs.mode }}'

# This workflow is diagnostic only: no secrets, no network-backed model acquisition,
# no release creation, no recommendation publication and no repository write permission.
