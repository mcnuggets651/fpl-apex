name: Apex V2 Core Readiness Audit

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional exact 40-character Apex V2 core SHA. Empty uses the authority-declared production core.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apex-v2-core-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip

      - name: Resolve exact core SHA
        id: core
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_SHA="$(python - <<'PY'
          import json
          print(json.load(open("docs/APEX_V2_AUTHORITY.json", encoding="utf-8"))["frozen_engine_sha"])
          PY
          )"
          CORE_SHA="${REQUESTED_SHA:-$DEFAULT_SHA}"
          [[ "$CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$CORE_SHA"
          git cat-file -e "$CORE_SHA^{commit}"
          echo "sha=$CORE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$CORE_SHA" = "$DEFAULT_SHA" ]; then
            echo "mode=production-core" >> "$GITHUB_OUTPUT"
          else
            echo "mode=non-serving-candidate" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize exact core in detached worktree
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          CORE="$RUNNER_TEMP/apex-v2-readiness-core"
          rm -rf "$CORE"
          git worktree add --detach "$CORE" '${{ steps.core.outputs.sha }}'
          test "$(git -C "$CORE" rev-parse HEAD)" = '${{ steps.core.outputs.sha }}'
          test -f "$CORE/src/apex/runtime/solve.py"
          test -f "$CORE/scripts/check_v2_architecture.py"
          echo "path=$CORE" >> "$GITHUB_OUTPUT"

      - name: Install selected immutable core
        shell: bash
        run: |
          set -euo pipefail
          CORE='${{ steps.materialize.outputs.path }}'
          if [ -f "$CORE/requirements-v2.lock" ]; then
            PIP_PIN="$(grep -E '^pip==' "$CORE/requirements-v2.lock")"
            SETUPTOOLS_PIN="$(grep -E '^setuptools==' "$CORE/requirements-v2.lock")"
            WHEEL_PIN="$(grep -E '^wheel==' "$CORE/requirements-v2.lock")"
            test -n "$PIP_PIN"
            test -n "$SETUPTOOLS_PIN"
            test -n "$WHEEL_PIN"
            python -m pip install "$PIP_PIN" "$SETUPTOOLS_PIN" "$WHEEL_PIN"
            python -m pip install --no-build-isolation \
              -c "$CORE/requirements-v2.lock" -e "$CORE[dev]"
            (cd "$CORE" && python scripts/check_v2_dependency_lock.py requirements-v2.lock)
          else
            python -m pip install -e "$CORE[dev]"
          fi
          python -m pip check

      - name: Build candidate provenance and SBOM when supported
        shell: bash
        run: |
          set -euo pipefail
          CORE='${{ steps.materialize.outputs.path }}'
          EVIDENCE="$GITHUB_WORKSPACE/artifacts/v2-readiness"
          mkdir -p "$EVIDENCE"
          if [ -f "$CORE/scripts/build_v2_provenance.py" ]; then
            cd "$CORE"
            python scripts/build_v2_provenance.py \
              --engine-sha '${{ steps.core.outputs.sha }}' \
              --output-dir "$EVIDENCE"
            test -s "$EVIDENCE/provenance.json"
            test -s "$EVIDENCE/sbom.cdx.json"
            python -m json.tool "$EVIDENCE/provenance.json" >/dev/null
            python -m json.tool "$EVIDENCE/sbom.cdx.json" >/dev/null
          else
            echo "Selected production core predates provenance/SBOM support."
          fi

      - name: Verify architecture and CLI
        shell: bash
        run: |
          set -euo pipefail
          CORE='${{ steps.materialize.outputs.path }}'
          cd "$CORE"
          python scripts/check_v2_architecture.py
          apex-v2 --help >/dev/null

      - name: Run complete V2 contract
        shell: bash
        run: |
          set -euo pipefail
          CORE='${{ steps.materialize.outputs.path }}'
          COVERAGE="$GITHUB_WORKSPACE/artifacts/v2-readiness/coverage.json"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/v2-readiness"
          cd "$CORE"
          if [ -f "scripts/check_v2_critical_coverage.py" ]; then
            pytest -q tests/test_apex_v2_*.py tests/test_v2_*.py \
              --cov=apex --cov-branch \
              --cov-report=term-missing \
              --cov-report=json:"$COVERAGE"
            python scripts/check_v2_critical_coverage.py "$COVERAGE"
          else
            pytest -q tests/test_apex_v2_*.py tests/test_v2_*.py
          fi

      - name: Run mutation sentinels when supported
        shell: bash
        run: |
          set -euo pipefail
          CORE='${{ steps.materialize.outputs.path }}'
          if [ -f "$CORE/scripts/run_v2_mutation_sentinels.py" ]; then
            (cd "$CORE" && python scripts/run_v2_mutation_sentinels.py)
          else
            echo "Selected core predates mutation sentinel gate."
          fi

      - name: Lint selected core assurance surface
        shell: bash
        run: |
          set -euo pipefail
          CORE='${{ steps.materialize.outputs.path }}'
          cd "$CORE"
          ruff check src/apex tests/test_apex_v2_*.py tests/test_v2_*.py scripts/check_v2_architecture.py
          if [ -f "scripts/check_v2_critical_coverage.py" ]; then
            ruff check scripts/check_v2_critical_coverage.py
          fi
          if [ -f "scripts/check_v2_dependency_lock.py" ]; then
            ruff check scripts/check_v2_dependency_lock.py scripts/build_v2_provenance.py
          fi
          if [ -f "scripts/run_v2_mutation_sentinels.py" ]; then
            ruff check scripts/run_v2_mutation_sentinels.py
          fi

      - name: Report read-only readiness result
        shell: bash
        run: |
          printf 'Apex V2 readiness passed\ncore_sha=%s\nmode=%s\n' \
            '${{ steps.core.outputs.sha }}' '${{ steps.core.outputs.mode }}'

      - name: Retain read-only readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apex-v2-readiness-${{ steps.core.outputs.sha }}
          path: artifacts/v2-readiness/
          if-no-files-found: warn
          retention-days: 30

# This workflow is diagnostic only: no secrets, no network-backed model acquisition,
# no release creation, no recommendation publication and no repository write permission.
