name: Apex V2 Prospective Tournament

on:
  workflow_run:
    workflows: ["Apex V2 Daily Production"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing production run key to seal; blank resolves latest valid predeadline final"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apex-v2-prospective-tournament.yml"
      - "scripts/apex_v2_tournament_common.py"
      - "scripts/apex_v2_tournament_contract.py"
      - "scripts/apex_v2_tournament_ops.py"
      - "scripts/apex_v2_tournament_scoring.py"
      - "scripts/apex_v2_shadow_provider_ops.py"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: apex-v2-prospective-tournament
  cancel-in-progress: false

env:
  FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"
  APEX_SEASON: "2026-2027"

jobs:
  seal:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_APEX_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen Apex V2 tooling
        run: pip install -e '.[dev]'

      - name: Materialize exact operations controllers and frozen provenance
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          git fetch --no-tags origin "$CONTROL_PLANE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$CONTROL_PLANE_SHA"
          for name in apex_v2_tournament_common.py apex_v2_tournament_contract.py apex_v2_tournament_scoring.py apex_v2_tournament_ops.py; do
            git show "$CONTROL_PLANE_SHA:scripts/$name" > "$RUNNER_TEMP/$name"
            test -s "$RUNNER_TEMP/$name"
          done
          git show "$CONTROL_PLANE_SHA:scripts/apex_v2_shadow_provider_ops.py" > "$RUNNER_TEMP/apex_v2_shadow_provider_ops.py"
          git show "$FROZEN_APEX_SHA:config/openfpl_training_policy.yaml" > "$RUNNER_TEMP/openfpl_training_policy.yaml"
          git show "$FROZEN_APEX_SHA:upstreams.lock.json" > "$RUNNER_TEMP/apex-v2-upstreams.lock.json"
          test -s "$RUNNER_TEMP/apex_v2_shadow_provider_ops.py"
          test -s "$RUNNER_TEMP/openfpl_training_policy.yaml"
          test -s "$RUNNER_TEMP/apex-v2-upstreams.lock.json"
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"

      - name: Resolve source production run identity
        id: source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          MANUAL_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          RUN_KEY=""
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_KEY="${WORKFLOW_RUN_ID}-${WORKFLOW_RUN_ATTEMPT}"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_SOURCE_RUN_ID" ]; then
            RUN_KEY="$MANUAL_SOURCE_RUN_ID"
          else
            python - <<'PY' > "$RUNNER_TEMP/latest_tournament_source.json"
          import json
          import os
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          from apex.runtime.releases import GitHubReleaseStore, download_release_asset

          def parse_utc(value):
              text = str(value or "").strip()
              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"
              parsed = datetime.fromisoformat(text)
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc)

          repo = os.environ["GITHUB_REPOSITORY"]
          season = os.environ["APEX_SEASON"]
          token = os.environ["GITHUB_TOKEN"]
          now = datetime.now(timezone.utc)
          prefix = f"apex-v2/final/{season}/"
          store = GitHubReleaseStore(repo, token)
          candidates = []

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              for release in store.list_releases():
                  tag = str(release.get("tag_name") or "")
                  if not tag.startswith(prefix):
                      continue
                  if release.get("draft") or release.get("immutable") is not True:
                      continue
                  run_key = tag[len(prefix):]
                  attempt_path = download_release_asset(
                      store,
                      release,
                      "public_attempt.json",
                      root / f"{release['id']}-public_attempt.json",
                  )
                  payload = json.loads(attempt_path.read_text(encoding="utf-8"))
                  if str(payload.get("run_id") or "") != run_key:
                      raise SystemExit(f"final release run identity mismatch: {tag}")
                  if str(payload.get("season") or "") != season:
                      raise SystemExit(f"final release season mismatch: {tag}")
                  try:
                      target_gameweek = int(payload.get("target_gameweek") or 0)
                      frozen_at = parse_utc(payload.get("frozen_at"))
                      deadline = parse_utc((payload.get("certification") or {}).get("valid_until"))
                  except Exception as exc:
                      raise SystemExit(f"invalid final authority fields for {tag}: {exc}") from exc
                  if target_gameweek < 3:
                      continue
                  if frozen_at >= deadline or now >= deadline:
                      continue
                  if (payload.get("certification") or {}).get("actionable") is not True:
                      continue
                  if (payload.get("manager_actionability") or {}).get("personalized_actionable") is not True:
                      continue
                  serving = payload.get("serving_provider_by_horizon") or {}
                  if any(str(serving.get(str(h), serving.get(h, ""))) != "airsenal" for h in range(1, 9)):
                      raise SystemExit(f"serving authority drift in immutable final: {tag}")
                  candidates.append(
                      {
                          "run_id": run_key,
                          "target_gameweek": target_gameweek,
                          "frozen_at": frozen_at,
                          "deadline": deadline,
                          "tag": tag,
                      }
                  )

          if not candidates:
              print(json.dumps({"status": "NO_ELIGIBLE_SOURCE", "run_id": None}, sort_keys=True))
          else:
              current_deadline = min(row["deadline"] for row in candidates)
              current = [row for row in candidates if row["deadline"] == current_deadline]
              selected = max(current, key=lambda row: row["frozen_at"])
              print(
                  json.dumps(
                      {
                          "status": "FOUND",
                          "run_id": selected["run_id"],
                          "target_gameweek": selected["target_gameweek"],
                          "frozen_at": selected["frozen_at"].isoformat(),
                          "deadline": selected["deadline"].isoformat(),
                          "source_release_tag": selected["tag"],
                          "selection_policy": "EARLIEST_FUTURE_DEADLINE_THEN_LATEST_VALID_FROZEN_AT",
                      },
                      sort_keys=True,
                  )
              )
          PY
            cat "$RUNNER_TEMP/latest_tournament_source.json"
            RUN_KEY="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("run_id") or "")' "$RUNNER_TEMP/latest_tournament_source.json")"
          fi

          if [ -z "$RUN_KEY" ]; then
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "run_key=" >> "$GITHUB_OUTPUT"
            echo "No immutable actionable still-predeadline production final is eligible for bootstrap sealing."
            exit 0
          fi
          case "$RUN_KEY" in
            *-*) ;;
            *) echo "source_run_id must be a production run key like 33469824474-1" >&2; exit 1 ;;
          esac
          echo "has_source=true" >> "$GITHUB_OUTPUT"
          echo "run_key=$RUN_KEY" >> "$GITHUB_OUTPUT"

      - name: Resolve governed OpenFPL readiness
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v2/tournament
          python "$RUNNER_TEMP/apex_v2_shadow_provider_ops.py" openfpl-readiness \
            --policy "$RUNNER_TEMP/openfpl_training_policy.yaml" \
            --lock "$RUNNER_TEMP/apex-v2-upstreams.lock.json" \
            --history-ref master \
            --report artifacts/v2/tournament/openfpl_readiness.json
          test -s artifacts/v2/tournament/openfpl_readiness.json

      - name: Seal exact common-snapshot tournament candidate
        if: steps.source.outputs.has_source == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APEX_PRIVATE_GITHUB_REPOSITORY"
          test -n "$APEX_PRIVATE_GITHUB_TOKEN"
          python "$RUNNER_TEMP/apex_v2_tournament_ops.py" seal-run \
            --repo "$GITHUB_REPOSITORY" \
            --private-repo "$APEX_PRIVATE_GITHUB_REPOSITORY" \
            --season "$APEX_SEASON" \
            --run-id '${{ steps.source.outputs.run_key }}' \
            --control-plane-sha "$CONTROL_PLANE_SHA" \
            --openfpl-readiness artifacts/v2/tournament/openfpl_readiness.json \
            --output artifacts/v2/tournament/readiness.json
          test -s artifacts/v2/tournament/readiness.json

      - name: Upload candidate readiness proof
        if: steps.source.outputs.has_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apex-v2-tournament-candidate-${{ steps.source.outputs.run_key }}
          path: artifacts/v2/tournament/
          retention-days: 90
          if-no-files-found: error

  maintenance:
    needs: seal
    if: >-
      always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_APEX_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen Apex V2 tooling
        run: pip install -e '.[dev]'

      - name: Materialize exact tournament operations controllers
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          git fetch --no-tags origin "$CONTROL_PLANE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$CONTROL_PLANE_SHA"
          for name in apex_v2_tournament_common.py apex_v2_tournament_contract.py apex_v2_tournament_scoring.py apex_v2_tournament_ops.py; do
            git show "$CONTROL_PLANE_SHA:scripts/$name" > "$RUNNER_TEMP/$name"
            test -s "$RUNNER_TEMP/$name"
          done
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"

      - name: Retain GW2 diagnostic evidence without canonicalising it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: >-
          python "$RUNNER_TEMP/apex_v2_tournament_ops.py" retain-gw2
          --repo "$GITHUB_REPOSITORY"
          --season "$APEX_SEASON"
          --control-plane-sha "$CONTROL_PLANE_SHA"

      - name: Select last valid common predeadline seal after each deadline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: >-
          python "$RUNNER_TEMP/apex_v2_tournament_ops.py" canonicalize
          --repo "$GITHUB_REPOSITORY"
          --season "$APEX_SEASON"
          --control-plane-sha "$CONTROL_PLANE_SHA"

      - name: Score only completed prospectively sealed horizons
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APEX_PRIVATE_GITHUB_REPOSITORY"
          test -n "$APEX_PRIVATE_GITHUB_TOKEN"
          python "$RUNNER_TEMP/apex_v2_tournament_ops.py" evaluate \
            --repo "$GITHUB_REPOSITORY" \
            --private-repo "$APEX_PRIVATE_GITHUB_REPOSITORY" \
            --season "$APEX_SEASON" \
            --control-plane-sha "$CONTROL_PLANE_SHA"

      - name: Materialize public tournament status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python "$RUNNER_TEMP/apex_v2_tournament_ops.py" status
          --repo "$GITHUB_REPOSITORY"
          --season "$APEX_SEASON"
          --output artifacts/v2/tournament/status.json

      - name: Upload tournament status
        uses: actions/upload-artifact@v4
        with:
          name: apex-v2-tournament-status-${{ github.run_id }}
          path: artifacts/v2/tournament/status.json
          retention-days: 90
          if-no-files-found: error
