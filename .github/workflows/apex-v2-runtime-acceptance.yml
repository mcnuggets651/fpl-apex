name: Apex V2 Runtime Acceptance

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apex-v2-runtime-acceptance.yml"
      - ".github/workflows/apex-v2-auth-keepalive.yml"
      - ".github/workflows/apex-v2-daily-production.yml"
      - ".github/workflows/apex-v2-daily-evaluation.yml"
      - ".github/workflows/apex-v2-ops-contract.yml"
      - "scripts/apex_v2_auth_ops.py"
      - "scripts/apex_v2_attempt_audit_ops.py"
      - "scripts/check_governance_consistency.py"
      - "docs/APEX_V2_DAILY_OPERATIONS.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  auth-runtime:
    name: auth-runtime
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: apex-v2-fpl-auth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_APEX_SHA }}
          fetch-depth: 0

      - name: Verify frozen auth acceptance identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          echo "Runtime auth acceptance pinned to $FROZEN_APEX_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen Apex V2 tooling
        run: pip install -e '.[dev]'

      - name: Preflight private auth store
        env:
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APEX_PRIVATE_GITHUB_REPOSITORY"
          test -n "$APEX_PRIVATE_GITHUB_TOKEN"
          test "$APEX_PRIVATE_GITHUB_REPOSITORY" != "$GITHUB_REPOSITORY"
          apex-v2 private-store-preflight

      - name: Materialize exact operations auth controller
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONTROL_PLANE_SHA"
          git fetch --no-tags origin "$CONTROL_PLANE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$CONTROL_PLANE_SHA"
          git show "$CONTROL_PLANE_SHA:scripts/apex_v2_auth_ops.py" > "$RUNNER_TEMP/apex_v2_auth_ops.py"
          test -s "$RUNNER_TEMP/apex_v2_auth_ops.py"
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"

      - name: Exercise live rotating owner authentication non-servingly
        env:
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_REFRESH_WRAP_KEY: ${{ secrets.FPL_REFRESH_WRAP_KEY }}
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/apex_v2_auth_ops.py" \
            --mode keepalive \
            --preflight-script scripts/preflight_fpl_auth.py \
            --config config/apex_v2.yaml

      - name: Prove frozen worktree stayed untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

  evaluation-runtime:
    name: evaluation-runtime
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: apex-v2-evaluation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_APEX_SHA }}
          fetch-depth: 0

      - name: Verify frozen evaluation acceptance identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          echo "Runtime evaluation acceptance pinned to $FROZEN_APEX_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen Apex V2 tooling
        run: pip install -e '.[dev]'

      - name: Materialize exact operations attempt-audit controller
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONTROL_PLANE_SHA"
          git fetch --no-tags origin "$CONTROL_PLANE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$CONTROL_PLANE_SHA"
          git show "$CONTROL_PLANE_SHA:scripts/apex_v2_attempt_audit_ops.py" > "$RUNNER_TEMP/apex_v2_attempt_audit_ops.py"
          test -s "$RUNNER_TEMP/apex_v2_attempt_audit_ops.py"
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"

      - name: Exercise live immutable attempt audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/apex_v2_attempt_audit_ops.py" --prefix apex-v2

      - name: Preflight private provider evaluation store
        env:
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        run: apex-v2 private-store-preflight

      - name: Exercise prospective completed-Gameweek evaluation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        run: apex-v2 evaluate-completed --season 2026-2027 --code-sha "$FROZEN_APEX_SHA"

      - name: Exercise champion challenger standings build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          apex-v2 tournament-standings
          --season 2026-2027
          --output artifacts/v2/tournament/standings.json

      - name: Verify standings artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/v2/tournament/standings.json
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"
