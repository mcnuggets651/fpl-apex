name: Apex V2 Daily Production

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: apex-v2-fpl-auth
  cancel-in-progress: false

env:
  FROZEN_APEX_BASE_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APEX_PRIVATE_MANAGER_ENABLED: ${{ vars.APEX_V2_PRIVATE_MANAGER_ENABLED == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve authority-declared production core
        id: core
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          readarray -t AUTHORITY < <(python - <<'PY'
          import json
          authority = json.load(open("docs/APEX_V2_AUTHORITY.json", encoding="utf-8"))
          print(authority["production_core_sha"])
          print(authority["frozen_engine_sha"])
          PY
          )
          PRODUCTION_CORE_SHA="${AUTHORITY[0]}"
          FROZEN_ENGINE_SHA="${AUTHORITY[1]}"
          [[ "$PRODUCTION_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FROZEN_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$FROZEN_ENGINE_SHA" = "$FROZEN_APEX_BASE_SHA"
          git fetch --no-tags origin "$FROZEN_ENGINE_SHA" "$PRODUCTION_CORE_SHA"
          git merge-base --is-ancestor "$FROZEN_ENGINE_SHA" "$PRODUCTION_CORE_SHA"
          CORE="$RUNNER_TEMP/apex-v2-production-core"
          rm -rf "$CORE"
          git worktree add --detach "$CORE" "$PRODUCTION_CORE_SHA"
          test "$(git -C "$CORE" rev-parse HEAD)" = "$PRODUCTION_CORE_SHA"
          test -f "$CORE/src/apex/runtime/solve.py"
          test -f "$CORE/config/apex_v2.yaml"
          test -f "$CORE/upstreams.lock.json"
          echo "sha=$PRODUCTION_CORE_SHA" >> "$GITHUB_OUTPUT"
          echo "path=$CORE" >> "$GITHUB_OUTPUT"
          echo "frozen_sha=$FROZEN_ENGINE_SHA" >> "$GITHUB_OUTPUT"
          echo "APEX_CODE_SHA=$PRODUCTION_CORE_SHA" >> "$GITHUB_ENV"
          echo "APEX_CORE_PATH=$CORE" >> "$GITHUB_ENV"
          echo "Apex V2 production core: $PRODUCTION_CORE_SHA (immutable base $FROZEN_ENGINE_SHA)"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact Apex V2 production core
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$APEX_CORE_PATH/requirements-v2.lock" ]; then
            PIP_PIN="$(grep -E '^pip==' "$APEX_CORE_PATH/requirements-v2.lock")"
            SETUPTOOLS_PIN="$(grep -E '^setuptools==' "$APEX_CORE_PATH/requirements-v2.lock")"
            WHEEL_PIN="$(grep -E '^wheel==' "$APEX_CORE_PATH/requirements-v2.lock")"
            test -n "$PIP_PIN"
            test -n "$SETUPTOOLS_PIN"
            test -n "$WHEEL_PIN"
            python -m pip install "$PIP_PIN" "$SETUPTOOLS_PIN" "$WHEEL_PIN"
            python -m pip install --no-build-isolation \
              -c "$APEX_CORE_PATH/requirements-v2.lock" -e "$APEX_CORE_PATH[dev]"
            (cd "$APEX_CORE_PATH" && python scripts/check_v2_dependency_lock.py requirements-v2.lock)
          else
            python -m pip install -e "$APEX_CORE_PATH[dev]"
          fi
          python -m pip check

      - name: Verify control-plane/core separation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$APEX_CORE_PATH" rev-parse HEAD)" = "$APEX_CODE_SHA"
          test "$APEX_CODE_SHA" = '${{ steps.core.outputs.sha }}'
          test '${{ steps.core.outputs.frozen_sha }}' = "$FROZEN_APEX_BASE_SHA"

      - name: Private-manager storage preflight
        if: env.APEX_PRIVATE_MANAGER_ENABLED == '1'
        env:
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APEX_PRIVATE_GITHUB_REPOSITORY" || {
            echo "Private-manager mode requires APEX_V2_PRIVATE_REPOSITORY." >&2
            exit 1
          }
          test -n "$APEX_PRIVATE_GITHUB_TOKEN" || {
            echo "Private-manager mode requires APEX_V2_PRIVATE_REPO_TOKEN." >&2
            exit 1
          }
          test "$APEX_PRIVATE_GITHUB_REPOSITORY" != "$GITHUB_REPOSITORY" || {
            echo "Private-manager repository must be separate from the public Apex repository." >&2
            exit 1
          }
          apex-v2 private-store-preflight

      - name: Materialize exact operations auth controller
        if: env.APEX_PRIVATE_MANAGER_ENABLED == '1'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp scripts/apex_v2_auth_ops.py "$RUNNER_TEMP/apex_v2_auth_ops.py"
          test -s "$RUNNER_TEMP/apex_v2_auth_ops.py"

      - name: Materialize exact external-shadow operations controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp scripts/apex_v2_shadow_provider_ops.py "$RUNNER_TEMP/apex_v2_shadow_provider_ops.py"
          cp "$APEX_CORE_PATH/upstreams.lock.json" "$RUNNER_TEMP/apex-v2-upstreams.lock.json"
          test -s "$RUNNER_TEMP/apex_v2_shadow_provider_ops.py"
          test -s "$RUNNER_TEMP/apex-v2-upstreams.lock.json"

      - name: Derive production config with external diagnostics isolated
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v2/diagnostics/external-shadow
          python "$RUNNER_TEMP/apex_v2_shadow_provider_ops.py" derive-runtime-config \
            --source "$APEX_CORE_PATH/config/apex_v2.yaml" \
            --output "$RUNNER_TEMP/apex_v2_runtime.yaml" \
            --report artifacts/v2/diagnostics/external-shadow/boundary.json
          test -s "$RUNNER_TEMP/apex_v2_runtime.yaml"
          test "$(git -C "$APEX_CORE_PATH" rev-parse HEAD)" = "$APEX_CODE_SHA"

      - name: Verify and recover FPL owner credential before provider work
        if: env.APEX_PRIVATE_MANAGER_ENABLED == '1'
        id: fpl_auth
        env:
          FPL_SESSION_COOKIE: ${{ secrets.FPL_SESSION_COOKIE }}
          FPL_X_API_AUTHORIZATION: ${{ secrets.FPL_X_API_AUTHORIZATION }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_REFRESH_WRAP_KEY: ${{ secrets.FPL_REFRESH_WRAP_KEY }}
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/apex_v2_auth_ops.py" \
            --mode production \
            --preflight-script "$APEX_CORE_PATH/scripts/preflight_fpl_auth.py" \
            --config "$APEX_CORE_PATH/config/apex_v2.yaml" \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Open immutable attempt intent
        id: intent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STARTED="$(apex-v2 intent --run-id "$RUN_KEY" --season 2026-2027 --gameweek 0 --code-sha "$APEX_CODE_SHA")"
          echo "run_key=$RUN_KEY" >> "$GITHUB_OUTPUT"
          echo "started=$STARTED" >> "$GITHUB_OUTPUT"

      - name: Capture Official FPL pre-provider seal
        id: official_seal
        shell: bash
        run: |
          set -euo pipefail
          OFFICIAL_HASH="$(apex-v2 official-hash --season 2026-2027)"
          test -n "$OFFICIAL_HASH"
          echo "hash=$OFFICIAL_HASH" >> "$GITHUB_OUTPUT"
          echo "Official FPL pre-provider hash: $OFFICIAL_HASH"

      - name: Capture external diagnostic health without production influence
        continue-on-error: true
        shell: bash
        run: |
          set -u
          python "$RUNNER_TEMP/apex_v2_shadow_provider_ops.py" pitchside-health \
            --report artifacts/v2/diagnostics/external-shadow/pitchside.json || true
          python "$RUNNER_TEMP/apex_v2_shadow_provider_ops.py" openfpl-readiness \
            --policy "$APEX_CORE_PATH/config/openfpl_training_policy.yaml" \
            --lock "$RUNNER_TEMP/apex-v2-upstreams.lock.json" \
            --history-ref master \
            --report artifacts/v2/diagnostics/external-shadow/openfpl.json || true

      - name: Resolve pinned AIrsenal
        id: airsenal
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          source = json.load(open(os.path.join(os.environ["APEX_CORE_PATH"], "upstreams.lock.json"), encoding="utf-8"))["sources"]["airsenal"]
          print(f"repository={source['repository']}")
          print(f"sha={source['commit']}")
          PY

      - name: Cache AIrsenal database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .airsenal
          key: ${{ runner.os }}-apex-v2-airsenal-${{ steps.airsenal.outputs.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-apex-v2-airsenal-${{ steps.airsenal.outputs.sha }}-

      - name: Generate fresh AIrsenal candidate
        env:
          AIRSENAL_HOME: ${{ github.workspace }}/.airsenal
          AIRSENAL_DB_FILE: ${{ github.workspace }}/.airsenal/data.db
          FPL_TEAM_ID: "1"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          mkdir -p workers acquisition/providers "$AIRSENAL_HOME"
          git clone --filter=blob:none "https://github.com/${{ steps.airsenal.outputs.repository }}.git" workers/airsenal
          git -C workers/airsenal checkout --detach "${{ steps.airsenal.outputs.sha }}"
          (cd workers/airsenal && uv sync)
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            (cd workers/airsenal && uv run airsenal_setup_initial_db --fpl_team_id 1)
          fi
          (cd workers/airsenal && uv run python "$APEX_CORE_PATH/scripts/update_airsenal_worker.py")
          python "$APEX_CORE_PATH/scripts/patch_airsenal_positions.py" "$AIRSENAL_DB_FILE" workers/airsenal
          (cd workers/airsenal && uv run python "$APEX_CORE_PATH/scripts/run_airsenal_worker.py" \
            --db "$AIRSENAL_DB_FILE" --horizon 8 \
            --output "$GITHUB_WORKSPACE/acquisition/providers/airsenal.csv")

      - name: Acquire Dastan H1 shadow with bounded transient retry
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/apex_v2_shadow_provider_ops.py" dastan-run \
            --runner "$APEX_CORE_PATH/scripts/acquire_dastan_shadow.py" \
            --expected-official-hash '${{ steps.official_seal.outputs.hash }}' \
            --lock "$RUNNER_TEMP/apex-v2-upstreams.lock.json" \
            --report artifacts/v2/diagnostics/external-shadow/dastan.json \
            --max-attempts 2 \
            --wall-clock-seconds 900

      - name: Combine shadow-provider health diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          if [ -s artifacts/v2/diagnostics/external-shadow/boundary.json ] \
             && [ -s artifacts/v2/diagnostics/external-shadow/dastan.json ] \
             && [ -s artifacts/v2/diagnostics/external-shadow/pitchside.json ] \
             && [ -s artifacts/v2/diagnostics/external-shadow/openfpl.json ]; then
            python "$RUNNER_TEMP/apex_v2_shadow_provider_ops.py" combine \
              --config-report artifacts/v2/diagnostics/external-shadow/boundary.json \
              --dastan-report artifacts/v2/diagnostics/external-shadow/dastan.json \
              --pitchside-report artifacts/v2/diagnostics/external-shadow/pitchside.json \
              --openfpl-report artifacts/v2/diagnostics/external-shadow/openfpl.json \
              --output artifacts/v2/diagnostics/external-shadow/health.json || true
          fi

      - name: Re-anchor Official truth and freeze all inputs once
        id: freeze
        env:
          APEX_ENABLE_PRIVATE_MANAGER_STATE: ${{ vars.APEX_V2_PRIVATE_MANAGER_ENABLED == 'true' && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APEX_PRIVATE_MANAGER_ENABLED" = "1" ]; then
            test "$APEX_ENABLE_PRIVATE_MANAGER_STATE" = "1"
            test -n "${FPL_SESSION_COOKIE:-}${FPL_X_API_AUTHORIZATION:-}"
          else
            test "$APEX_ENABLE_PRIVATE_MANAGER_STATE" = "0"
            test -z "${FPL_SESSION_COOKIE:-}${FPL_X_API_AUTHORIZATION:-}"
          fi
          SNAPSHOT_FILE="$RUNNER_TEMP/apex-v2-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          rm -f "$SNAPSHOT_FILE"
          apex-v2 acquire \
            --config "$RUNNER_TEMP/apex_v2_runtime.yaml" \
            --run-id '${{ steps.intent.outputs.run_key }}' \
            --code-sha "$APEX_CODE_SHA" \
            --run-started-at '${{ steps.intent.outputs.started }}' \
            --expected-official-hash '${{ steps.official_seal.outputs.hash }}' \
            --snapshot-output "$SNAPSHOT_FILE"
          test -s "$SNAPSHOT_FILE"
          test "$(wc -l < "$SNAPSHOT_FILE" | tr -d '[:space:]')" = "1"
          SNAPSHOT="$(cat "$SNAPSHOT_FILE")"
          test -n "$SNAPSHOT"
          test -d "$SNAPSHOT"
          test -s "$SNAPSHOT/manifest.json"
          printf 'snapshot=%s\n' "$SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Solve frozen snapshot with network-independent decision code
        env:
          APEX_ALLOW_NETWORK_DURING_SOLVE: "0"
        run: |
          python "$APEX_CORE_PATH/scripts/check_v2_architecture.py"
          apex-v2 solve "${{ steps.freeze.outputs.snapshot }}" --output artifacts/v2/decision_bundle.json

      - name: Publish immutable completed attempt
        if: always() && steps.freeze.outputs.snapshot != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f artifacts/v2/decision_bundle.json ]; then
            echo "Solve did not produce a final decision bundle; intent remains orphaned for evaluator escalation."
            exit 1
          fi
          GW="$(python - <<'PY'
          import json
          print(json.load(open('artifacts/v2/decision_bundle.json'))['manifest']['target_gameweek'])
          PY
          )"
          apex-v2 publish \
            "${{ steps.freeze.outputs.snapshot }}" \
            artifacts/v2/decision_bundle.json \
            --season 2026-2027 \
            --gameweek "$GW" \
            --run-id '${{ steps.intent.outputs.run_key }}' \
            --code-sha "$APEX_CODE_SHA"

      - name: Upload sanitized diagnostics only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apex-v2-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/v2/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
