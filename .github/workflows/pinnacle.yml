name: Apex Pinnacle

on:
  workflow_dispatch:
  schedule:
    # Run after the core pin refresh / normal live pipeline cadence.
    - cron: "47 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apex-pinnacle
  cancel-in-progress: true

jobs:
  pinnacle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Apex + genuine AIrsenal worker
        run: pip install -e '.[dev,airsenal]'

      - name: Run deterministic and adversarial stress tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pytest -q
          ruff check src tests scripts
          python scripts/check_upstreams.py

      - name: Restore runtime cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: apex-pinnacle-runtime-2627-${{ github.run_id }}
          restore-keys: |
            apex-pinnacle-runtime-2627-
            apex-runtime-2627-

      - name: Cache AIrsenal database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v3

      - name: Refresh genuine AIrsenal forecasts
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            # AIrsenal requires a positive ID only to initialise its schema.
            # Apex never uses this manager's transactions for forecasts.
            airsenal_setup_initial_db --fpl_team_id 1
          fi
          python scripts/update_airsenal_worker.py
          python scripts/run_airsenal_worker.py \
            --db "$AIRSENAL_DB_FILE" \
            --horizon 8 \
            --output data/generated/airsenal.csv

      - name: Generate Apex Elite 10.0 candidate
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: python scripts/run_elite.py --horizon 8 --force

      - name: Publish latest Elite candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/generated/elite_latest.json data/generated/elite_latest.md
          if git diff --cached --quiet; then
            echo "Elite candidate unchanged"
          else
            git commit -m "data: publish Apex Elite candidate [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Generate Pinnacle decision candidate
        id: generate_candidate
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        shell: bash
        run: |
          set +e
          python scripts/run_pinnacle.py \
            --horizon 8 \
            --stochastic-scenarios 256 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --force
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "candidate_generated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # run_pinnacle intentionally writes a complete candidate before exiting
          # non-zero when the strict football/data readiness gate is blocked.
          # Accept only that exact state. Any genuine crash, missing output or
          # malformed payload must still fail the workflow.
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path("data/generated/pinnacle_latest.json")
          if not path.exists():
              print("Pinnacle runner failed before producing a candidate snapshot", file=sys.stderr)
              raise SystemExit(1)

          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"Pinnacle candidate is unreadable: {exc}", file=sys.stderr)
              raise SystemExit(1)

          gate = payload.get("pinnacle_gate")
          blockers = gate.get("blockers") if isinstance(gate, dict) else None
          if payload.get("pinnacle_ready") is False and blockers:
              print("Pinnacle runner completed but strict decision readiness is blocked:")
              for blocker in blockers:
                  print(f"- {blocker}")
              raise SystemExit(0)

          print("Pinnacle runner exited non-zero for a reason other than an explicit readiness block", file=sys.stderr)
          raise SystemExit(1)
          PY
          echo "candidate_generated=true" >> "$GITHUB_OUTPUT"

      # Decision readiness is deliberately distinct from software/system health.
      - name: Evaluate strict Pinnacle decision readiness
        id: readiness
        continue-on-error: true
        run: python scripts/assert_pinnacle.py data/generated/pinnacle_latest.json

      - name: Report blocked decision without failing system health
        if: steps.readiness.outcome == 'failure'
        run: |
          echo "::warning title=Apex Pinnacle not decision-ready::The production pipeline completed successfully, but the strict Pinnacle readiness gate blocked publication. Inspect the generated artifact for current football/data uncertainty blockers."

      - name: Update no-hindsight learning archive
        env:
          APEX_SEASON: "2026-2027"
          FPL_ENTRY_ID: "63984"
        run: python scripts/update_learning_archive.py

      - name: Commit latest green Pinnacle snapshot and learning state
        if: steps.readiness.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/generated/pinnacle_latest.json \
            data/generated/pinnacle_latest.md \
            data/generated/calibration_report.json
          if [ -d data/history/deadlines ]; then
            git add -f data/history/deadlines
          fi
          if git diff --cached --quiet; then
            echo "Pinnacle decision and learning state unchanged"
            exit 0
          fi
          git commit -m "data: publish Apex Pinnacle decision [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirm publication withheld when readiness is blocked
        if: steps.readiness.outcome == 'failure'
        run: echo "Pinnacle candidate retained as an artifact only; no blocked decision was published to main."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-pinnacle-${{ github.run_id }}
          path: |
            reports/
            data/generated/pinnacle_latest.json
            data/generated/pinnacle_latest.md
            data/generated/elite_latest.json
            data/generated/elite_latest.md
            data/generated/calibration_report.json
            data/history/deadlines/
            data/generated/airsenal.csv
          retention-days: 30

