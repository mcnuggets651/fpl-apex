# RETIRED: manual-only legacy workflow. Apex V2 is the sole scheduled publisher.
name: Apex Unified

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-production-write
  cancel-in-progress: false

jobs:
  apex:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Apex + pinned AIrsenal worker
        run: bash scripts/install_pinned_airsenal.sh

      - name: Run deterministic and adversarial stress tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pytest -q
          ruff check src tests scripts
          python scripts/check_upstreams.py
          python scripts/check_governance_consistency.py

      - name: Restore runtime cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: apex-unified-runtime-2627-${{ github.run_id }}
          restore-keys: |
            apex-unified-runtime-2627-
            apex-pinnacle-runtime-2627-
            apex-runtime-2627-

      - name: Cache AIrsenal database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v3

      - name: Refresh genuine AIrsenal forecasts
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            airsenal_setup_initial_db --fpl_team_id 1
          fi
          python scripts/update_airsenal_worker.py
          python scripts/run_airsenal_worker.py \
            --db "$AIRSENAL_DB_FILE" \
            --horizon 8 \
            --output data/generated/airsenal.csv

      - name: Generate Pinnacle surface for independent parity
        id: pinnacle
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        shell: bash
        run: |
          python scripts/build_decision_bundle.py \
            --horizon 8 \
            --bundle-dir data/generated/decision_bundle \
            --force
          set +e
          python scripts/run_pinnacle.py \
            --horizon 8 \
            --stochastic-scenarios 256 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --bundle-dir data/generated/decision_bundle
          status=$?
          set -e
          test -s data/generated/pinnacle_latest.json
          if [ "$status" -ne 0 ]; then
            set +e
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/generated/pinnacle_latest.json").read_text())
          blockers = (payload.get("pinnacle_gate") or {}).get("blockers") or []
          if payload.get("pinnacle_ready") is not False or not blockers:
              raise SystemExit("Pinnacle exited non-zero without an explicit readiness block")
          parity_bootstrap = [
              "required independent solver parity snapshot is not embedded"
          ]
          if blockers == parity_bootstrap:
              print(
                  "Pinnacle surface is complete and requires the next workflow "
                  "stage to compute independent parity."
              )
              raise SystemExit(2)
          print("Pinnacle explicitly withheld the production decision:")
          for blocker in blockers:
              print(f"- {blocker}")
          PY
            classification=$?
            set -e
            if [ "$classification" -eq 2 ]; then
              echo "ready_for_parity=true" >> "$GITHUB_OUTPUT"
              python scripts/export_open_solver.py \
                reports/players.csv reports/projections.csv /tmp/apex.csv \
                --projection-col xp
              exit 0
            fi
            echo "ready_for_parity=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready_for_parity=true" >> "$GITHUB_OUTPUT"
          python scripts/export_open_solver.py \
            reports/players.csv reports/projections.csv /tmp/apex.csv \
            --projection-col xp

      - name: Read pinned independent solver revision
        id: parity-pin
        if: steps.pinnacle.outputs.ready_for_parity == 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          source = json.load(open("upstreams.lock.json", encoding="utf-8"))["sources"]["open_fpl_solver"]
          print(f"repository={source['repository']}")
          print(f"sha={source['commit']}")
          PY

      - name: Run and embed same-surface independent parity
        if: steps.pinnacle.outputs.ready_for_parity == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv
          git clone --filter=blob:none \
            "https://github.com/${{ steps.parity-pin.outputs.repository }}.git" \
            "$RUNNER_TEMP/open-fpl-solver"
          git -C "$RUNNER_TEMP/open-fpl-solver" checkout --detach \
            "${{ steps.parity-pin.outputs.sha }}"
          cp /tmp/apex.csv "$RUNNER_TEMP/open-fpl-solver/data/apex.csv"
          cd "$RUNNER_TEMP/open-fpl-solver"
          uv sync
          uv run python run/solve.py \
            --config "$GITHUB_WORKSPACE/config/open_solver_parity.json" \
            --datasource apex \
            --horizon 8
          cd "$GITHUB_WORKSPACE"
          RESULT="$(ls -t "$RUNNER_TEMP"/open-fpl-solver/data/results/apex_*.csv | head -1)"
          python scripts/compare_solver_parity.py \
            data/generated/pinnacle_latest.json "$RESULT"
          python scripts/embed_solver_parity.py \
            data/generated/pinnacle_latest.json \
            data/generated/solver_parity.json

      - name: Generate single canonical Apex recommendation
        id: canonical
        if: steps.pinnacle.outputs.ready_for_parity == 'true'
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        shell: bash
        run: |
          set +e
          python scripts/run_apex.py \
            --horizon 8 \
            --stochastic-scenarios 256 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --reuse-pinnacle \
            --force
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path("data/generated/apex_recommendation_latest.json")
          if not path.exists():
              print("Unified Apex runner failed before producing the canonical contract", file=sys.stderr)
              raise SystemExit(1)
          payload = json.loads(path.read_text(encoding="utf-8"))
          blockers = payload.get("blockers") or []
          if payload.get("ready_to_act") is False and blockers:
              print("Unified Apex completed but withheld a recommendation:")
              for blocker in blockers:
                  print(f"- {blocker}")
              raise SystemExit(0)
          print("Unified Apex exited non-zero without an explicit canonical readiness block", file=sys.stderr)
          raise SystemExit(1)
          PY
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Finalize fail-closed production status
        if: always()
        shell: bash
        run: |
          python scripts/finalize_production_status.py \
            --run-id "${{ github.run_id }}" \
            --reason "Apex Unified production run did not complete canonical assembly" \
            ${{ steps.canonical.outcome == 'success' && '--canonical-step-succeeded' || '' }}

      - name: Report withheld canonical decision
        if: steps.canonical.outputs.ready != 'true'
        run: echo "::warning title=Apex Unified not decision-ready::The system is healthy, but the canonical decision contract withheld a team. Inspect the artifact blockers."

      - name: Update no-hindsight learning archive
        if: steps.pinnacle.outputs.ready_for_parity == 'true'
        env:
          APEX_SEASON: "2026-2027"
          FPL_ENTRY_ID: "63984"
        run: python scripts/update_learning_archive.py

      - name: Seal atomic workflow artifact before publication cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/apex-unified-packet"
          mkdir -p "$packet"
          for path in \
            reports \
            data/generated/apex_recommendation_latest.json \
            data/generated/apex_recommendation_latest.md \
            data/generated/apex_answer_context.json \
            data/generated/pinnacle_latest.json \
            data/generated/pinnacle_latest.md \
            data/generated/solver_parity.json \
            data/generated/elite_latest.json \
            data/generated/elite_latest.md \
            data/generated/decision_bundle \
            data/generated/calibration_report.json \
            data/generated/airsenal.csv \
            data/history/deadlines \
            data/history/production_runs
          do
            if [ -e "$path" ]; then
              mkdir -p "$packet/$(dirname "$path")"
              cp -a "$path" "$packet/$path"
            fi
          done

      - name: Publish latest canonical status and durable forecast archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo "Material repository state changed during solve; aborting publication so Apex can rerun on the new head."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/generated/apex_recommendation_latest.json \
            data/generated/apex_recommendation_latest.md \
            data/generated/apex_answer_context.json
          for path in \
            data/generated/solver_parity.json \
            data/generated/calibration_report.json
          do
            if [ -e "$path" ]; then
              git add -f "$path"
            fi
          done
          if [ -d data/history/production_runs ]; then
            git add -f data/history/production_runs
          fi
          if [ -d data/history/deadlines ]; then
            git add -f data/history/deadlines
          fi
          if git diff --cached --quiet; then
            echo "Canonical Apex recommendation unchanged"
            exit 0
          fi
          git commit -m "data: publish canonical Apex recommendation [skip ci]"

          # The live model also refreshes internal diagnostic files. Revert only
          # uncommitted tracked diagnostics after the canonical files are safely
          # recorded in HEAD.
          echo "Discarding uncommitted runtime diagnostics:"
          git status --short
          git restore --worktree .

          git push origin HEAD:main

      - name: Confirm team was withheld while current NOT READY status was published
        if: steps.canonical.outputs.ready != 'true'
        run: echo "The current teamless NOT READY contract and healthy forecast archive were published; blocked candidates remain artifact-only."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-unified-${{ github.run_id }}
          path: ${{ runner.temp }}/apex-unified-packet/
          retention-days: 30