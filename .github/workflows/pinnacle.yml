name: Apex Pinnacle

on:
  workflow_dispatch:
  schedule:
    # Run after the core pin refresh / normal live pipeline cadence.
    - cron: "47 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pinnacle.yml"
      - "scripts/run_pinnacle.py"
      - "scripts/assert_pinnacle.py"
      - "scripts/update_learning_archive.py"
      - "src/apex_fpl/models/ensemble.py"
      - "src/apex_fpl/models/scenarios.py"
      - "src/apex_fpl/optimisation/cvar.py"
      - "src/apex_fpl/optimisation/initial_horizon.py"
      - "src/apex_fpl/optimisation/mechanics.py"
      - "src/apex_fpl/optimisation/stability.py"
      - "src/apex_fpl/optimisation/transfer_views.py"
      - "src/apex_fpl/services/chips.py"
      - "src/apex_fpl/services/learning.py"
      - "src/apex_fpl/services/pinnacle_readiness.py"
      - "src/apex_fpl/services/strategy.py"
      - "src/apex_fpl/services/team_state.py"
      - "src/apex_fpl/data/entry.py"
      - "tests/test_chips.py"
      - "tests/test_dgw_expert_allocation.py"
      - "tests/test_expected_value_surface.py"
      - "tests/test_learning_archive.py"
      - "tests/test_mechanics.py"
      - "tests/test_pinnacle_readiness.py"
      - "tests/test_pinnacle_stress.py"
      - "tests/test_pre_gw1_price_capture.py"
      - "tests/test_scenario_persistence.py"
      - "tests/test_selection_regret.py"
      - "tests/test_stochastic_pinnacle.py"
      - "tests/test_strategy.py"
      - "tests/test_transfer_candidate_pool.py"

permissions:
  contents: write

concurrency:
  group: apex-pinnacle
  cancel-in-progress: true

jobs:
  pinnacle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Apex + genuine AIrsenal worker
        run: pip install -e '.[dev,airsenal]'

      - name: Run deterministic and adversarial stress tests
        run: |
          pytest -q
          ruff check src tests scripts
          python scripts/check_upstreams.py

      - name: Restore runtime cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: apex-pinnacle-runtime-2627-${{ github.run_id }}
          restore-keys: |
            apex-pinnacle-runtime-2627-
            apex-runtime-2627-

      - name: Cache AIrsenal database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v3

      - name: Refresh genuine AIrsenal forecasts
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            airsenal_setup_initial_db
          else
            airsenal_update_db
          fi
          python scripts/run_airsenal_worker.py \
            --db "$AIRSENAL_DB_FILE" \
            --horizon 8 \
            --output data/generated/airsenal.csv

      - name: Generate final Pinnacle decision
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: |
          python scripts/run_pinnacle.py \
            --horizon 8 \
            --stochastic-scenarios 256 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --force
          python scripts/assert_pinnacle.py data/generated/pinnacle_latest.json

      - name: Update no-hindsight learning archive
        env:
          APEX_SEASON: "2026-2027"
          FPL_ENTRY_ID: "63984"
        run: python scripts/update_learning_archive.py

      - name: Commit latest green Pinnacle snapshot and learning state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/generated/pinnacle_latest.json \
            data/generated/pinnacle_latest.md \
            data/generated/calibration_report.json
          if [ -d data/history/deadlines ]; then
            git add -f data/history/deadlines
          fi
          if git diff --cached --quiet; then
            echo "Pinnacle decision and learning state unchanged"
            exit 0
          fi
          git commit -m "data: publish Apex Pinnacle decision [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-pinnacle-${{ github.run_id }}
          path: |
            reports/
            data/generated/pinnacle_latest.json
            data/generated/pinnacle_latest.md
            data/generated/calibration_report.json
            data/history/deadlines/
            data/generated/airsenal.csv
          retention-days: 30
