name: Apex Unified

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apex-production
  cancel-in-progress: false

jobs:
  apex:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"

      - name: Install frozen Apex core and isolated AIrsenal worker
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "APEX_CORE_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
          bash scripts/install_pinned_airsenal.sh

      - name: Run deterministic and adversarial stress tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$APEX_CORE_PYTHON" -m pytest -q
          "$GITHUB_WORKSPACE/.venv/bin/ruff" check src tests scripts
          "$APEX_CORE_PYTHON" scripts/check_upstreams.py
          "$APEX_CORE_PYTHON" scripts/check_governance_consistency.py

      - name: Restore runtime cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: data/cache
          key: apex-unified-runtime-2627-${{ github.run_id }}
          restore-keys: |
            apex-unified-runtime-2627-
            apex-pinnacle-runtime-2627-
            apex-runtime-2627-

      - name: Cache AIrsenal database
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v4-py3147

      - name: Refresh genuine AIrsenal forecasts in isolated worker
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          set -euo pipefail
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            "$AIRSENAL_WORKER_BIN/airsenal_setup_initial_db" --fpl_team_id 1
          fi
          "$AIRSENAL_WORKER_PYTHON" scripts/update_airsenal_worker.py
          "$AIRSENAL_WORKER_PYTHON" scripts/run_airsenal_worker.py \
            --db "$AIRSENAL_DB_FILE" \
            --horizon 8 \
            --output data/generated/airsenal.csv

      - name: Generate Pinnacle surface for independent parity
        id: pinnacle
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        shell: bash
        run: |
          "$APEX_CORE_PYTHON" scripts/build_decision_bundle.py \
            --horizon 8 \
            --bundle-dir data/generated/decision_bundle \
            --force
          set +e
          "$APEX_CORE_PYTHON" scripts/run_pinnacle.py \
            --horizon 8 \
            --stochastic-scenarios 256 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --bundle-dir data/generated/decision_bundle
          status=$?
          set -e
          test -s data/generated/pinnacle_latest.json
          if [ "$status" -ne 0 ]; then
            set +e
            "$APEX_CORE_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/generated/pinnacle_latest.json").read_text())
          blockers = (payload.get("pinnacle_gate") or {}).get("blockers") or []
          if payload.get("pinnacle_ready") is not False or not blockers:
              raise SystemExit("Pinnacle exited non-zero without an explicit readiness block")
          parity_bootstrap = [
              "required independent solver parity snapshot is not embedded"
          ]
          if blockers == parity_bootstrap:
              print(
                  "Pinnacle surface is complete and requires the next workflow "
                  "stage to compute independent parity."
              )
              raise SystemExit(2)
          print("Pinnacle explicitly withheld the production decision:")
          for blocker in blockers:
              print(f"- {blocker}")
          PY
            classification=$?
            set -e
            if [ "$classification" -eq 2 ]; then
              echo "ready_for_parity=true" >> "$GITHUB_OUTPUT"
              "$APEX_CORE_PYTHON" scripts/export_open_solver.py \
                reports/players.csv reports/projections.csv /tmp/apex.csv \
                --projection-col xp
              exit 0
            fi
            echo "ready_for_parity=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready_for_parity=true" >> "$GITHUB_OUTPUT"
          "$APEX_CORE_PYTHON" scripts/export_open_solver.py \
            reports/players.csv reports/projections.csv /tmp/apex.csv \
            --projection-col xp

      - name: Read pinned independent solver revision
        id: parity-pin
        if: steps.pinnacle.outputs.ready_for_parity == 'true'
        shell: bash
        run: |
          "$APEX_CORE_PYTHON" - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          source = json.load(open("upstreams.lock.json", encoding="utf-8"))["sources"]["open_fpl_solver"]
          print(f"repository={source['repository']}")
          print(f"sha={source['commit']}")
          PY

      - name: Run same-surface independent parity in isolated worker
        if: steps.pinnacle.outputs.ready_for_parity == 'true'
        shell: bash
        run: |
          set -euo pipefail
          solver="$RUNNER_TEMP/open-fpl-solver"
          uv_bootstrap="$RUNNER_TEMP/reference-solver-uv-bootstrap"
          rm -rf "$solver" "$uv_bootstrap"
          "$APEX_CORE_PYTHON" -m venv "$uv_bootstrap"
          "$uv_bootstrap/bin/python" -m pip install --no-deps uv==0.12.3
          "$uv_bootstrap/bin/uv" python install 3.14.7
          git clone --filter=blob:none \
            "https://github.com/${{ steps.parity-pin.outputs.repository }}.git" \
            "$solver"
          git -C "$solver" checkout --detach "${{ steps.parity-pin.outputs.sha }}"
          cp /tmp/apex.csv "$solver/data/apex.csv"
          "$uv_bootstrap/bin/uv" sync \
            --frozen \
            --project "$solver" \
            --python 3.14.7 \
            --no-dev
          "$solver/.venv/bin/python" "$solver/run/solve.py" \
            --config "$GITHUB_WORKSPACE/config/open_solver_parity.json" \
            --datasource apex \
            --horizon 8
          RESULT="$(ls -t "$solver"/data/results/apex_*.csv | head -1)"
          "$APEX_CORE_PYTHON" scripts/compare_solver_parity.py \
            data/generated/pinnacle_latest.json "$RESULT"
          "$APEX_CORE_PYTHON" scripts/embed_solver_parity.py \
            data/generated/pinnacle_latest.json \
            data/generated/solver_parity.json

      - name: Generate single canonical Apex recommendation
        id: canonical
        if: steps.pinnacle.outputs.ready_for_parity == 'true'
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        shell: bash
        run: |
          set +e
          "$APEX_CORE_PYTHON" scripts/run_apex.py \
            --horizon 8 \
            --stochastic-scenarios 256 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --reuse-pinnacle \
            --force
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          "$APEX_CORE_PYTHON" - <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path("data/generated/apex_recommendation_latest.json")
          if not path.exists():
              print("Unified Apex runner failed before producing the canonical contract", file=sys.stderr)
              raise SystemExit(1)
          payload = json.loads(path.read_text(encoding="utf-8"))
          blockers = payload.get("blockers") or []
          if payload.get("ready_to_act") is False and blockers:
              print("Unified Apex completed but withheld a recommendation:")
              for blocker in blockers:
                  print(f"- {blocker}")
              raise SystemExit(0)
          print("Unified Apex exited non-zero without an explicit canonical readiness block", file=sys.stderr)
          raise SystemExit(1)
          PY
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Finalize fail-closed production status
        if: always()
        shell: bash
        run: |
          "$APEX_CORE_PYTHON" scripts/finalize_production_status.py \
            --run-id "${{ github.run_id }}" \
            --reason "Apex Unified production run did not complete canonical assembly" \
            ${{ steps.canonical.outcome == 'success' && '--canonical-step-succeeded' || '' }}

      - name: Report withheld canonical decision
        if: steps.canonical.outputs.ready != 'true'
        run: echo "::warning title=Apex Unified not decision-ready::The canonical decision contract withheld a team. Inspect the immutable runtime artifact."

      - name: Update no-hindsight learning archive
        if: steps.pinnacle.outputs.ready_for_parity == 'true'
        env:
          APEX_SEASON: "2026-2027"
          FPL_ENTRY_ID: "63984"
        run: "$APEX_CORE_PYTHON" scripts/update_learning_archive.py

      - name: Seal atomic workflow packet
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/apex-unified-packet"
          rm -rf "$packet"
          mkdir -p "$packet"
          for path in \
            reports \
            data/generated/apex_recommendation_latest.json \
            data/generated/apex_recommendation_latest.md \
            data/generated/apex_answer_context.json \
            data/generated/pinnacle_latest.json \
            data/generated/pinnacle_latest.md \
            data/generated/solver_parity.json \
            data/generated/elite_latest.json \
            data/generated/elite_latest.md \
            data/generated/decision_bundle \
            data/generated/calibration_report.json \
            data/generated/airsenal.csv \
            data/history/deadlines \
            data/history/production_runs
          do
            if [ -e "$path" ]; then
              mkdir -p "$packet/$(dirname "$path")"
              cp -a "$path" "$packet/$path"
            fi
          done

      - name: Stage immutable runtime release outside source control
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/apex-unified-packet"
          "$APEX_CORE_PYTHON" scripts/stage_runtime_release.py \
            --packet-root "$packet" \
            --artifact-root "$RUNNER_TEMP/apex-artifact-store" \
            --registry-root "$RUNNER_TEMP/apex-release-registry" \
            --season "2026-2027" \
            --entry "63984" \
            --run-id "${{ github.run_id }}" \
            --runtime-digest "git:${{ github.sha }}"
          mkdir -p "$packet/runtime/backend"
          cp -a "$RUNNER_TEMP/apex-artifact-store" "$packet/runtime/backend/artifact-store"
          cp -a "$RUNNER_TEMP/apex-release-registry" "$packet/runtime/backend/release-registry"

      - name: Assert source tree was not used as runtime publication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "No runtime commit or push is permitted by this workflow."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apex-unified-${{ github.run_id }}
          path: ${{ runner.temp }}/apex-unified-packet/
          retention-days: 30
