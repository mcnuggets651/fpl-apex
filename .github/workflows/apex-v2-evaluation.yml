name: Apex V2 Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"

permissions:
  contents: write

concurrency:
  group: apex-v2-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Detect orphaned production attempts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: apex-v2 audit-attempts --prefix apex-v2
      - name: Score newly completed Gameweeks prospectively
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: apex-v2 evaluate-completed --season 2026-2027 --code-sha "$GITHUB_SHA"
