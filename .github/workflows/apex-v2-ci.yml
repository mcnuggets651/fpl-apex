name: Apex V2 CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/apex/**'
      - 'tests/test_apex_v2_*.py'
      - 'tests/test_v2_*.py'
      - 'scripts/check_v2_architecture.py'
      - 'config/apex_v2.yaml'
      - '.github/workflows/apex-v2-*.yml'
      - 'pyproject.toml'

concurrency:
  group: apex-v2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_apex_v2_*.py tests/test_v2_*.py
      - run: python scripts/check_v2_architecture.py
      - run: ruff check src/apex tests/test_apex_v2_*.py tests/test_v2_*.py scripts/check_v2_architecture.py
