name: Apex Shrinkage Decision Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/apex_fpl/models/shrinkage.py"
      - "src/apex_fpl/services/pipeline.py"
      - "scripts/validate_shrinkage_continuous.py"
      - "scripts/run_shrinkage_decision_audit.py"
      - "scripts/run_pinnacle.py"
      - "src/apex_fpl/optimisation/frequencies.py"
      - "src/apex_fpl/services/pinnacle_readiness.py"
      - "tests/test_shrinkage.py"
      - "tests/test_pinnacle_readiness.py"
      - ".github/workflows/shrinkage-decision-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Apex and genuine AIrsenal worker
        run: pip install -e '.[dev,airsenal]'
      - name: Static checks
        run: |
          ruff check \
            src/apex_fpl/models/shrinkage.py \
            src/apex_fpl/services/pipeline.py \
            scripts/run_shrinkage_decision_audit.py
      - name: Cache AIrsenal database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v3
      - name: Refresh genuine AIrsenal forecasts
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            airsenal_setup_initial_db --fpl_team_id 1
          fi
          python scripts/update_airsenal_worker.py
          python scripts/run_airsenal_worker.py \
            --db "$AIRSENAL_DB_FILE" \
            --horizon 8 \
            --output data/generated/airsenal.csv
      - name: Run raw versus validated shrinkage decision audit
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: |
          python scripts/run_shrinkage_decision_audit.py \
            --horizon 8 \
            --force \
            --output reports/shrinkage_decision_audit.json
      - name: Run post-shrinkage epsilon frontier
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: python scripts/run_elite.py --horizon 8 --force
      - name: Run unified post-shrinkage readiness path
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: |
          python scripts/run_apex.py \
            --horizon 8 \
            --stochastic-scenarios 256 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --force

      - name: Enforce decision stability contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(
              Path('reports/shrinkage_decision_audit.json').read_text()
          )
          elite = json.loads(
              Path('data/generated/elite_latest.json').read_text()
          )
          canonical = json.loads(
              Path('data/generated/apex_recommendation_latest.json').read_text()
          )
          assert audit['production_changed'] is False
          assert audit['canonical_publish_attempted'] is False
          assert audit['promotion_scope'] == ['xg90', 'xa90']
          assert audit['defcon_promoted'] is False
          assert audit['decision_delta']['squad_overlap'] >= 13
          assert audit['decision_delta']['raw_xp_regret_pct'] <= 0.01
          assert (
              audit['captain_stability_ab']['raw_control']['completed_solves']
              >= 16
          )
          assert (
              audit['captain_stability_ab']['validated_shrinkage']
              ['completed_solves'] >= 16
          )
          assert len(elite['epsilon_sensitivity']) == 4
          max_ev_captain = elite['epsilon_convergence']['max_ev_captain']
          assert all(
              row['captain'] == max_ev_captain
              for row in elite['epsilon_sensitivity']
          )
          assert canonical['ready_to_act'] is True
          assert canonical['recommendation']['selector'] == 'maximum_ev'
          assert canonical['recommendation']['captain'] == max_ev_captain
          print('Shrinkage decision audit passed without publishing a team.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shrinkage-decision-audit-${{ github.run_id }}
          path: |
            reports/shrinkage_decision_audit.json
            reports/pinnacle_fixed_xi_captain_frequencies.csv
            data/generated/elite_latest.json
            data/generated/elite_latest.md
            data/generated/pinnacle_latest.json
            data/generated/apex_recommendation_latest.json
            data/generated/apex_recommendation_latest.md
            data/generated/airsenal.csv
          retention-days: 30
