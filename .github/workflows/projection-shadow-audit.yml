name: Apex Projection Shadow Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/apex_fpl/data/http.py"
      - "src/apex_fpl/models/ensemble.py"
      - "src/apex_fpl/models/minute_states.py"
      - "src/apex_fpl/models/minutes.py"
      - "src/apex_fpl/models/projection.py"
      - "src/apex_fpl/services/decision_eligibility.py"
      - "src/apex_fpl/services/projection_audit.py"
      - "scripts/run_projection_audit.py"
      - "scripts/audit_projection_truth.py"
      - "scripts/audit_max_ev_policy.py"
      - "tests/test_http_cache.py"
      - "tests/test_projection_audit.py"
      - "tests/test_projection_truth_audit.py"
      - "tests/test_minute_states.py"
      - ".github/workflows/projection-shadow-audit.yml"

permissions:
  contents: read

concurrency:
  group: projection-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex + isolated AIrsenal worker
        run: |
          bash scripts/install_frozen_apex.sh
          bash scripts/install_pinned_airsenal.sh
      - name: Unit tests
        run: |
          "$APEX_CORE_PYTHON" -m pytest -q \
            tests/test_http_cache.py \
            tests/test_projection_audit.py \
            tests/test_projection_truth_audit.py \
            tests/test_minute_states.py \
            tests/test_evidence_eligibility.py \
            tests/test_player_evidence.py \
            tests/test_pinnacle_readiness.py
      - name: Cache AIrsenal database
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v4-py3147
      - name: Cache official FPL HTTP payloads
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: data/cache
          key: official-fpl-2627-${{ runner.os }}-v1-${{ github.sha }}
          restore-keys: |
            official-fpl-2627-${{ runner.os }}-v1-
      - name: Refresh genuine AIrsenal forecasts
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            "$AIRSENAL_WORKER_BIN/airsenal_setup_initial_db" --fpl_team_id 1
          fi
          "$AIRSENAL_WORKER_PYTHON" scripts/update_airsenal_worker.py
          "$AIRSENAL_WORKER_PYTHON" scripts/run_airsenal_worker.py \
            --db "$AIRSENAL_DB_FILE" \
            --horizon 8 \
            --output data/generated/airsenal.csv
      - name: Warm official FPL cache
        run: |
          "$APEX_CORE_PYTHON" - <<'PY'
          from pathlib import Path

          from apex_fpl.data.http import CachedHttp
          from apex_fpl.data.official import OfficialFPLClient

          snapshot = OfficialFPLClient(CachedHttp(Path("data/cache"))).snapshot(force=True)
          print("official_bootstrap_sha256", snapshot.bootstrap_sha256)
          print("official_fixtures_sha256", snapshot.fixtures_sha256)
          PY
      - name: Run production-vs-Understat shadow audit
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: |
          "$APEX_CORE_PYTHON" scripts/run_projection_audit.py \
            --horizon 8 \
            --force \
            --output-dir reports/projection_audit
      - name: Run projection truth audit
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: |
          "$APEX_CORE_PYTHON" scripts/audit_projection_truth.py \
            --horizon 8 \
            --force \
            --output-dir reports/projection_truth
      - name: Run same-surface max-EV policy audit
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: |
          "$APEX_CORE_PYTHON" scripts/audit_max_ev_policy.py \
            --horizon 8 \
            --force \
            --output reports/max_ev_policy_audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: projection-shadow-audit-${{ github.run_id }}
          path: |
            reports/projection_audit/
            reports/projection_truth/
            reports/max_ev_policy_audit.json
            reports/team_goal_ratings.csv
            reports/team_goal_surface.csv
            data/generated/airsenal.csv
          retention-days: 30
