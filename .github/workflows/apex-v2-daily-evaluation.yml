name: Apex V2 Daily Evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apex-v2-daily-evaluation.yml"
      - "scripts/apex_v2_attempt_audit_ops.py"
  schedule:
    - cron: "41 6 * * *"

permissions:
  contents: write

concurrency:
  group: apex-v2-evaluation
  cancel-in-progress: false

env:
  FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FROZEN_APEX_SHA }}
          fetch-depth: 0

      - name: Verify frozen evaluation identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          echo "Apex V2 daily evaluation pinned to $FROZEN_APEX_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e '.[dev]'

      - name: Materialize exact operations attempt-audit controller
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CONTROL_PLANE_SHA"
          git fetch --no-tags origin "$CONTROL_PLANE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$CONTROL_PLANE_SHA"
          git show "$CONTROL_PLANE_SHA:scripts/apex_v2_attempt_audit_ops.py" > "$RUNNER_TEMP/apex_v2_attempt_audit_ops.py"
          test -s "$RUNNER_TEMP/apex_v2_attempt_audit_ops.py"
          test "$(git rev-parse HEAD)" = "$FROZEN_APEX_SHA"

      - name: Detect unacknowledged orphaned production attempts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/apex_v2_attempt_audit_ops.py" --prefix apex-v2

      - name: Preflight private provider evaluation store
        env:
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        run: apex-v2 private-store-preflight

      - name: Score newly completed Gameweeks prospectively
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        run: apex-v2 evaluate-completed --season 2026-2027 --code-sha "$FROZEN_APEX_SHA"

      - name: Build champion challenger season standings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          apex-v2 tournament-standings
          --season 2026-2027
          --output artifacts/v2/tournament/standings.json

      - name: Upload derived tournament standings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apex-v2-tournament-standings-${{ github.run_id }}
          path: artifacts/v2/tournament/standings.json
          retention-days: 90
          if-no-files-found: error
