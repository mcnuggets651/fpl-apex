name: Champion Authority Regression Fixture Fix

on:
  push:
    branches: [v2/champion-authority-chain]

permissions:
  contents: write

concurrency:
  group: champion-authority-fixture-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix champion authority regression fixtures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Apply exact regression fixture fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}\n{old}")
              p.write_text(text.replace(old, new, 1))

          # The prior negative test accidentally regenerated the exact same deterministic
          # certificate. Change only validity so the second certificate is genuinely distinct
          # while qualifying the same substantive policy subject.
          replace_once(
              "tests/test_v2_champion_authority.py",
              '        season=fixture.bundle.season,\n    )\n    review = store.put_bytes(b"decision policy review evidence").artifact_id\n',
              '        season=fixture.bundle.season,\n        valid_until="2026-10-31T00:00:00Z",\n    )\n    review = store.put_bytes(b"decision policy review evidence").artifact_id\n',
          )

          # These two tests are about backend qualification and stale CAS respectively. Route
          # through the common cutover helper so the forthcoming integration supplies the same
          # replay-valid champion authority as every publish-capable test.
          replace_once(
              "tests/test_v2_production_cutover.py",
              '''    fixture = _fixture(store)\n    manifest = _artifact(store, "manifest")\n    claim = _artifact(store, "claim")\n    backend = _backend(store, registry, qualified=False)\n    assert backend.qualified is False\n    outcome = execute_production_cutover(\n        season=SEASON,\n        entry=ENTRY,\n        gameweek=GAMEWEEK,\n        bundle_id=fixture.bundle.bundle_id,\n        world_id=fixture.bundle.world_id,\n        runtime_digest="sha256:v2-runtime",\n        created_at=CREATED_AT,\n        valid_until=VALID_UNTIL,\n        artifact_manifest_id=manifest,\n        assurance_case=_case(store, claim),\n        obligations=_obligations(),\n        backend_qualification=backend,\n        artifact_store=store,\n        production_registry=registry,\n    )\n''',
              '''    backend = _backend(store, registry, qualified=False)\n    assert backend.qualified is False\n    _, _, outcome = _execute(\n        tmp_path,\n        backend=backend,\n        store=store,\n        registry=registry,\n    )\n''',
          )
          replace_once(
              "tests/test_v2_production_cutover.py",
              '''    fixture = _fixture(store)\n    manifest = _artifact(store, "manifest")\n    claim = _artifact(store, "claim")\n    with pytest.raises(CompareAndSwapConflict, match="stale production"):\n        execute_production_cutover(\n            season=SEASON,\n            entry=ENTRY,\n            gameweek=GAMEWEEK,\n            bundle_id=fixture.bundle.bundle_id,\n            world_id=fixture.bundle.world_id,\n            runtime_digest="sha256:v2-runtime",\n            created_at=CREATED_AT,\n            valid_until=VALID_UNTIL,\n            artifact_manifest_id=manifest,\n            assurance_case=_case(store, claim),\n            obligations=_obligations(),\n            backend_qualification=backend,\n            artifact_store=store,\n            production_registry=registry,\n        )\n''',
              '''    with pytest.raises(CompareAndSwapConflict, match="stale production"):\n        _execute(\n            tmp_path,\n            backend=backend,\n            store=store,\n            registry=registry,\n        )\n''',
          )

          # Development loop only: exercise exact failures plus positive publish/answer replay.
          replace_once(
              ".github/workflows/champion-authority-integrate.yml",
              ".venv/bin/python -m pytest -q tests/test_v2_champion_authority.py tests/test_v2_production_cutover.py tests/test_v2_production_authority.py",
              ".venv/bin/python -m pytest -q tests/test_v2_champion_authority.py::test_champion_authority_replays_all_four_bundle_champions tests/test_v2_champion_authority.py::test_decision_policy_admission_binds_exact_qualification_artifact tests/test_v2_production_cutover.py::test_production_cutover_publishes_only_after_complete_pass_and_exact_cas tests/test_v2_production_cutover.py::test_missing_champion_authority_is_withheld_without_pointer_write tests/test_v2_production_cutover.py::test_unqualified_backend_withholds_even_when_release_certificate_passes tests/test_v2_production_cutover.py::test_stale_writer_fails_closed_and_cannot_become_current tests/test_v2_production_authority.py::test_exact_current_proof_authorized_release_is_only_actionable_authority",
          )
          PY
      - name: Validate changed fixture syntax
        run: |
          python -m py_compile tests/test_v2_champion_authority.py tests/test_v2_production_cutover.py
          git diff --check
      - name: Commit fixture fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v2_champion_authority.py tests/test_v2_production_cutover.py .github/workflows/champion-authority-integrate.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix champion authority regression fixtures"
          git push origin HEAD:v2/champion-authority-chain
