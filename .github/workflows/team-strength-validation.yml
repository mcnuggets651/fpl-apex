name: Apex Team Strength Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/apex_fpl/models/team_goals.py"
      - "src/apex_fpl/data/understat.py"
      - "scripts/validate_team_strength.py"
      - ".github/workflows/team-strength-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Apex test environment
        run: pip install -e '.[dev]'
      - name: Static checks
        run: ruff check scripts/validate_team_strength.py src/apex_fpl/models/team_goals.py src/apex_fpl/data/understat.py
      - name: No-hindsight team-strength validation
        id: validation
        continue-on-error: true
        run: python scripts/validate_team_strength.py --output reports/team_strength_validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-strength-validation-${{ github.run_id }}
          path: reports/team_strength_validation.json
          retention-days: 30
      - name: Enforce challenger evidence gate
        if: steps.validation.outcome != 'success'
        run: |
          echo "Understat team-strength challenger did not beat the neutral fallback on both untouched holdouts."
          echo "Do not promote or blend it into production."
          exit 1
