name: Apex Team Strength Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/apex_fpl/models/team_goals.py"
      - "src/apex_fpl/data/understat.py"
      - "src/apex_fpl/data/core_insights.py"
      - "scripts/validate_team_strength.py"
      - "scripts/validate_team_strength_blend.py"
      - "scripts/validate_fixture_fallback_selection.py"
      - "tests/test_fixture_elo.py"
      - ".github/workflows/team-strength-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Apex test environment
        run: pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check \
            scripts/validate_team_strength.py \
            scripts/validate_team_strength_blend.py \
            scripts/validate_fixture_fallback_selection.py \
            src/apex_fpl/models/team_goals.py \
            src/apex_fpl/data/understat.py \
            src/apex_fpl/data/core_insights.py \
            tests/test_fixture_elo.py
      - name: Elo reconciliation regression
        run: pytest -q tests/test_fixture_elo.py
      - name: Clean fallback selection evidence
        run: python scripts/validate_fixture_fallback_selection.py --output reports/fixture_fallback_selection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-strength-validation-${{ github.run_id }}
          path: reports/fixture_fallback_selection.json
          retention-days: 30
      - name: Enforce evidence integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('reports/fixture_fallback_selection.json').read_text())
          assert report['production_changed'] is False
          assert report['core_scope'] == 'Premier League only; cup rows explicitly excluded'
          assert report['understat_vs_neutral_replacement']['n_matches'] >= 700
          assert report['epl_elo_understat_overlap_2025_26'] >= 300
          assert report['untouched_holdout']['n_matches'] >= 150
          print('Clean no-hindsight fallback evidence generated; production promotion remains gated by the report result.')
          PY
