name: Apex V2 Primary Lock Replay Probe

on:
  pull_request:
    branches:
      - candidate/apex-v2-deterministic-primary-lock-20260903

permissions:
  contents: read

jobs:
  replay-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install exact Apex V2 environment
        shell: bash
        run: |
          set -euo pipefail
          PIP_PIN="$(grep -E '^pip==' requirements-v2.lock)"
          SETUPTOOLS_PIN="$(grep -E '^setuptools==' requirements-v2.lock)"
          WHEEL_PIN="$(grep -E '^wheel==' requirements-v2.lock)"
          python -m pip install "$PIP_PIN" "$SETUPTOOLS_PIN" "$WHEEL_PIN"
          python -m pip install --no-build-isolation -c requirements-v2.lock -e '.[dev]'
          python scripts/check_v2_dependency_lock.py requirements-v2.lock
          python -m pip check
      - name: Emit corrected initial-squad semantic replay probe
        run: pytest -q -s tests/test_v2_primary_lock_replay_probe.py
