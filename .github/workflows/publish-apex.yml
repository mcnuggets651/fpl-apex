name: Publish green Apex snapshot

on:
  workflow_dispatch:
  schedule:
    # Core pin refreshes at minute 03. The standard live check runs at minute 17.
    # Publish shortly afterwards so GitHub always exposes the newest green result.
    - cron: "33 */6 * * *"

permissions:
  contents: write

concurrency:
  group: publish-green-apex
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Apex
        run: pip install -e .

      - name: Run full live Apex gate
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: apex-fpl run --scenario both --horizon 8 --force

      - name: Publish only a green decision state
        run: python scripts/publish_snapshot.py reports data/generated

      - name: Commit compact latest recommendation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/generated/apex_latest.json data/generated/apex_latest.md
          if git diff --cached --quiet; then
            echo "Published Apex decision has not changed"
            exit 0
          fi
          git commit -m "data: publish green Apex snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-apex-${{ github.run_id }}
          path: |
            reports/
            data/generated/apex_latest.json
            data/generated/apex_latest.md
          retention-days: 30
