name: V2 Shadow Production

on:
  pull_request:
    paths:
      - "src/apex_fpl/core/proofs.py"
      - "src/apex_fpl/core/shadow.py"
      - "src/apex_fpl/core/backend_qualification.py"
      - "src/apex_fpl/control/shadow_production.py"
      - "src/apex_fpl/control/backend_operational_qualification.py"
      - "src/apex_fpl/control/production_backend_qualification.py"
      - "src/apex_fpl/control/production_backend_runtime.py"
      - "src/apex_fpl/control/production_cutover.py"
      - "src/apex_fpl/control/production_authority.py"
      - "src/apex_fpl/control/candidate_operations.py"
      - "src/apex_fpl/control/prospective_experiment_operations.py"
      - "src/apex_fpl/v2_operations_cli.py"
      - "tests/test_v2_shadow_*.py"
      - "tests/test_v2_backend_*.py"
      - "tests/test_v2_postgres_backend.py"
      - "tests/test_v2_production_backend_runtime.py"
      - "tests/test_v2_prospective_empirical_operations.py"
      - "tests/test_v2_production_cutover.py"
      - "tests/test_v2_production_authority.py"
      - "docs/APEX_SHADOW_PRODUCTION_V2.md"
      - "docs/APEX_BACKEND_OPERATIONAL_QUALIFICATION_V2.md"
      - "docs/APEX_PROSPECTIVE_EMPIRICAL_OPERATIONS_V2.md"
      - "docs/APEX_INVARIANTS.md"
      - "config/proof_obligations.yaml"
      - "config/requirements.yaml"
      - ".github/workflows/v2-shadow-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-production-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install frozen Apex CI environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run shadow production contract tests
        run: .venv/bin/python -m pytest -q tests/test_v2_shadow_*.py
      - name: Run Ruff on shadow production surface
        run: .venv/bin/ruff check src/apex_fpl/core/proofs.py src/apex_fpl/core/shadow.py src/apex_fpl/control/shadow_production.py tests/test_v2_shadow_*.py
