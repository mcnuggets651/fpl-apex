name: Final production authority cutover

on:
  push:
    branches:
      - agent/final-airsenal-authority-cutover

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/final-airsenal-authority-cutover

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic cutover
        run: python scripts/apply_final_production_cutover.py

      - name: Install Apex exactly as production workflows should
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Verify repaired FPL Core import path
        run: python -c "from apex_fpl.services.publication import invalidate_published_decision; print('publication import ok')"

      - name: Run authority and dependency regression suite
        run: |
          pytest -q \
            tests/test_final_projection_authority.py \
            tests/test_weight_contract.py \
            tests/test_ensemble.py \
            tests/test_dgw_expert_allocation.py \
            tests/test_airsenal.py \
            tests/test_airsenal_source_absence_policy.py \
            tests/test_airsenal_workflow_contract.py \
            tests/test_data_quality.py \
            tests/test_understat.py \
            tests/test_understat_page_fallback.py \
            tests/test_understat_players.py \
            tests/test_answer_context.py \
            tests/test_calibration.py \
            tests/test_learning_archive.py \
            tests/test_core_candidate_publication.py \
            tests/test_core_freshness.py \
            tests/test_core_identity.py \
            tests/test_publication_invalidation.py \
            tests/test_production_publication_contract.py \
            tests/test_decision_bundle.py \
            tests/test_optimiser.py \
            tests/test_mechanics.py \
            tests/test_exact_decision.py \
            tests/test_minutes.py \
            tests/test_evidence_eligibility.py \
            tests/test_solver_parity_contract.py

      - name: Remove one-shot workflow before final governance/full-suite test
        run: rm .github/workflows/final-production-cutover.yml

      - name: Run full repository test suite
        run: pytest -q

      - name: Audit obsolete production authority assumptions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from apex_fpl.config import load_settings
          s = load_settings()
          assert s.weights == {"official_ep": 0.0, "apex_model": 0.0, "airsenal": 1.0, "market": 0.0}
          assert "fpl_core_playerstats" not in s.required_sources
          assert "fixture_model" not in s.required_sources
          assert s.understat_team_model_mode == "shadow"
          print("authority contract ok")
          PY
          ! grep -R "0.5111111111\|0.2666666667\|0.2222222222" config src tests --exclude-dir=__pycache__

      - name: Commit validated cutover and remove executor
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_final_production_cutover.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "architecture: cut production xP authority to AIrsenal"
          git push origin HEAD:agent/final-airsenal-authority-cutover
