name: Apex V2 provider provenance patch

on:
  push:
    branches: [agent/apex-v2-cleanroom]
    paths: [.github/workflows/apex-v2-provider-provenance-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'mcnuggets651/fpl-apex' && github.ref_name == 'agent/apex-v2-cleanroom'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apex-v2-cleanroom
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply provenance-only provider publication contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          publication = Path('src/apex/runtime/publication.py')
          text = publication.read_text(encoding='utf-8')
          start = text.index('def _provider_forecast_archive(\n')
          end = text.index('\ndef _canonical_forecast(', start)
          replacement = '''def _provider_forecast_archive(
              snapshot,
              output: Path,
          ) -> tuple[Path, dict[str, str]]:
              """Publish provider provenance without redistributing forecast rows.

              The frozen provider surfaces remain part of the sealed local snapshot and
              are identified here by SHA-256. The public canonical forecast may expose
              Apex's selected serving projection, but this compatibility archive must
              never become a second copy of raw provider row exports.
              """
              output = Path(output)
              output.parent.mkdir(parents=True, exist_ok=True)
              entries: dict[str, str] = {}
              provider_names = sorted(
                  name
                  for name in snapshot.manifest.get("files", {})
                  if name.startswith("providers/") and name.endswith(".json")
              )
              if not provider_names:
                  raise RuntimeError("public provider provenance archive would be empty")
              staging = output.parent / ".provider-publication"
              if staging.exists():
                  for path in sorted(staging.rglob("*"), reverse=True):
                      if path.is_file():
                          path.unlink()
                      elif path.is_dir():
                          path.rmdir()
              staging.mkdir(parents=True, exist_ok=True)
              try:
                  with tarfile.open(output, "w:gz") as archive:
                      for name in provider_names:
                          raw = snapshot.read_json(name)
                          frozen = (snapshot.manifest.get("files") or {}).get(name) or {}
                          frozen_sha = str(frozen.get("sha256") or "").lower()
                          if len(frozen_sha) != 64 or any(
                              char not in "0123456789abcdef" for char in frozen_sha
                          ):
                              raise RuntimeError(
                                  f"frozen provider surface lacks valid SHA-256 identity: {name}"
                              )
                          provenance = {
                              "schema_version": 1,
                              "publication_contract": "PROVENANCE_ONLY_V1",
                              "forecast_rows_published": False,
                              "provider_id": raw.get("provider_id"),
                              "provider_version": raw.get("provider_version"),
                              "generated_at": raw.get("generated_at"),
                              "season": raw.get("season"),
                              "source_snapshot": raw.get("source_snapshot"),
                              "scoring_rules_version": raw.get("scoring_rules_version"),
                              "supported_horizons": raw.get("supported_horizons") or [],
                              "runtime_dependencies": raw.get("runtime_dependencies") or [],
                              "frozen_provider_sha256": frozen_sha,
                              "frozen_provider_bytes": int(frozen.get("bytes") or 0),
                          }
                          staged = staging / name
                          write_json(staged, provenance)
                          archive.add(staged, arcname=name)
                          entries[name] = sha256_file(staged)
              finally:
                  if staging.exists():
                      for path in sorted(staging.rglob("*"), reverse=True):
                          if path.is_file():
                              path.unlink()
                          elif path.is_dir():
                              path.rmdir()
                      staging.rmdir()
              return output, entries
          '''
          publication.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          tests = Path('tests/test_v2_publication_privacy.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'import copy\nfrom pathlib import Path\n',
              'import copy\nimport json\nimport tarfile\nfrom pathlib import Path\n',
              1,
          )
          text = text.replace(
              '    PUBLIC_RELEASE_ASSETS_V1,\n',
              '    PUBLIC_RELEASE_ASSETS_V1,\n    _provider_forecast_archive,\n',
              1,
          )
          anchor = '\ndef _commitment_fixture():\n'
          test_block = '''\n\ndef test_public_provider_archive_contains_provenance_not_forecast_rows(tmp_path: Path):
              from apex.runtime.snapshot import SnapshotBuilder

              builder = SnapshotBuilder()
              builder.add_json(
                  "providers/airsenal.json",
                  {
                      "schema_version": 1,
                      "provider_id": "airsenal",
                      "provider_version": "upstream-sha",
                      "generated_at": "2026-08-29T12:00:00Z",
                      "season": "2026-2027",
                      "source_snapshot": "official-sha",
                      "scoring_rules_version": "fpl-2026-27-v1",
                      "supported_horizons": [1, 2],
                      "runtime_dependencies": ["python=3.12"],
                      "rows": [
                          {
                              "element_id": 1,
                              "horizon": 1,
                              "expected_points": 9.9,
                              "metadata": {"must_not_publish": "sentinel"},
                          }
                      ],
                  },
              )
              snapshot = builder.freeze(tmp_path / "snapshots")
              archive_path, entries = _provider_forecast_archive(
                  snapshot,
                  tmp_path / "provider_forecasts.tar.gz",
              )
              with tarfile.open(archive_path, "r:gz") as archive:
                  assert archive.getnames() == ["providers/airsenal.json"]
                  member = archive.extractfile("providers/airsenal.json")
                  assert member is not None
                  published = json.loads(member.read())

              assert published["publication_contract"] == "PROVENANCE_ONLY_V1"
              assert published["forecast_rows_published"] is False
              assert published["provider_id"] == "airsenal"
              assert published["frozen_provider_sha256"] == snapshot.manifest["files"][
                  "providers/airsenal.json"
              ]["sha256"]
              assert "rows" not in published
              assert "expected_points" not in published
              assert "sentinel" not in json.dumps(published)
              assert len(entries["providers/airsenal.json"]) == 64
          '''
          if anchor not in text:
              raise SystemExit('test insertion anchor missing')
          tests.write_text(text.replace(anchor, test_block + anchor, 1), encoding='utf-8')

          doc = Path('docs/architecture/APEX_V2.md')
          text = doc.read_text(encoding='utf-8')
          old = 'The public Apex repository may publish only the explicit public allowlist produced by `runtime/publication.py`: public attempt metadata, sanitized canonical/provider forecasts where permitted, public governance, public evidence and attestations.'
          new = 'The public Apex repository may publish only the explicit public allowlist produced by `runtime/publication.py`: public attempt metadata, the canonical Apex serving forecast, provider provenance/hashes, public governance, public evidence and attestations. The compatibility `provider_forecasts.tar.gz` asset is provenance-only and must never contain provider forecast rows or expected-points exports.'
          if old not in text:
              raise SystemExit('architecture wording anchor missing')
          doc.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/apex-v2-provider-provenance-patch.yml
      - name: Validate patch before commit
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]'
          pytest -q tests/test_v2_publication_privacy.py
          python scripts/check_v2_architecture.py
          ruff check src/apex/runtime/publication.py tests/test_v2_publication_privacy.py
      - name: Commit permanent patch and self-delete bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/apex/runtime/publication.py tests/test_v2_publication_privacy.py docs/architecture/APEX_V2.md .github/workflows/apex-v2-provider-provenance-patch.yml
          git commit -m 'Publish provider provenance without raw forecast exports'
          git push origin HEAD:agent/apex-v2-cleanroom
