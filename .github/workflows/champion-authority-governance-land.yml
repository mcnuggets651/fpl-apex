name: Champion Authority Governance Land

on:
  push:
    branches: [v2/champion-authority-chain]

permissions:
  contents: write

concurrency:
  group: champion-authority-governance-land-${{ github.ref }}
  cancel-in-progress: true

jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Apply governance patch
        run: python scripts/land_champion_authority_governance.py
      - name: Validate patch
        run: git diff --check
      - name: Commit governance and retire temporary landing files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/land_champion_authority_governance.py
          rm .github/workflows/champion-authority-governance-land.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Constitutionally bind champion authority"
          git push origin HEAD:v2/champion-authority-chain
