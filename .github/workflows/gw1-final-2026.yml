name: Apex Final GW1 2026 — Unified

on:
  workflow_dispatch:
  schedule:
    # 07:15 UTC = 08:15 UK (BST) on 21 August 2026.
    - cron: "15 7 21 8 *"

permissions:
  contents: read

concurrency:
  group: apex-final-gw1-2026-unified
  cancel-in-progress: true

jobs:
  final-gw1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: One-off date guard
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%Y-%m-%d)" = "2026-08-21" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12.14"

      - name: Install frozen Apex + isolated AIrsenal worker
        if: steps.guard.outputs.run == 'true'
        run: |
          bash scripts/install_frozen_apex.sh
          bash scripts/install_pinned_airsenal.sh

      - name: Restore Apex runtime cache
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: data/cache
          key: apex-unified-gw1-final-${{ github.run_id }}
          restore-keys: |
            apex-unified-runtime-2627-
            apex-pinnacle-runtime-2627-
            apex-runtime-2627-

      - name: Cache AIrsenal database
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v4-py3147

      - name: Run repository checks
        if: steps.guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$APEX_CORE_PYTHON" -m pytest -q
          ruff check src tests scripts
          "$APEX_CORE_PYTHON" scripts/check_upstreams.py

      - name: Refresh genuine AIrsenal forecasts
        if: steps.guard.outputs.run == 'true'
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then
            "$AIRSENAL_WORKER_BIN/airsenal_setup_initial_db" --fpl_team_id 1
          fi
          "$AIRSENAL_WORKER_PYTHON" scripts/update_airsenal_worker.py
          "$AIRSENAL_WORKER_PYTHON" scripts/run_airsenal_worker.py \
            --db "$AIRSENAL_DB_FILE" \
            --horizon 8 \
            --output data/generated/airsenal.csv

      - name: Generate final canonical pre-GW1 recommendation
        if: steps.guard.outputs.run == 'true'
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          APEX_MAX_CORE_AGE_HOURS: "12"
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: |
          "$APEX_CORE_PYTHON" scripts/run_apex.py \
            --horizon 8 \
            --stochastic-scenarios 512 \
            --cvar-alpha 0.10 \
            --cvar-weight 0.20 \
            --force

      - name: Upload final GW1 unified recommendation
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apex-final-gw1-2026-unified-${{ github.run_id }}
          path: |
            data/generated/apex_recommendation_latest.json
            data/generated/apex_recommendation_latest.md
            data/generated/pinnacle_latest.json
            data/generated/elite_latest.json
            data/generated/decision_bundle/
            reports/
            data/generated/airsenal.csv
          retention-days: 60
