name: One-shot Understat empty-match fix

on:
  push:
    branches:
      - agent/projection-contract-corrections
    paths:
      - scripts/_one_shot_understat_empty_fix.py
      - .github/workflows/one-shot-understat-empty-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/projection-contract-corrections
          fetch-depth: 0
      - name: Apply asserted source patch
        run: python scripts/_one_shot_understat_empty_fix.py
      - name: Remove one-shot machinery
        run: |
          rm scripts/_one_shot_understat_empty_fix.py
          rm .github/workflows/one-shot-understat-empty-fix.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: handle empty Understat exact-match stage"
          git push origin HEAD:agent/projection-contract-corrections
