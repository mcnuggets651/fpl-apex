name: Apex Shrinkage Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/apex_fpl/models/shrinkage.py"
      - "scripts/validate_shrinkage_continuous.py"
      - "scripts/shrinkage_shadow_surface.py"
      - "scripts/audit_shrinkage_promotion.py"
      - "tests/test_shrinkage.py"
      - "tests/test_shrinkage_promotion_audit.py"
      - "docs/evidence/shrinkage_validation_v2_summary.json"
      - ".github/workflows/shrinkage-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Apex and pinned AIrsenal
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]'
          git clone --filter=blob:none https://github.com/alan-turing-institute/AIrsenal.git /tmp/airsenal
          git -C /tmp/airsenal checkout --detach 8c7e18eba1488dd5a7d4bdb00d4da0a75e895717
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/airsenal/pyproject.toml')
          old = 'bpl @ git+https://github.com/anguswilliams91/bpl-next'
          new = old + '@e238f742d1ea1f72a6ce8b8466f9989d6b53a819'
          text = path.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit('Pinned AIrsenal bpl dependency declaration not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          pip install /tmp/airsenal
      - name: Unit tests
        run: pytest -q tests/test_shrinkage.py tests/test_shrinkage_promotion_audit.py
      - name: Historical chronological validation
        id: calibration
        continue-on-error: true
        run: |
          python scripts/validate_shrinkage_continuous.py --window-gws 4 --force --output reports/shrinkage_validation.json
      - name: Cache AIrsenal database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/airsenal.db
          key: airsenal-2627-${{ runner.os }}-v3
      - name: Refresh AIrsenal forecasts
        env:
          AIRSENAL_DB_FILE: ${{ runner.temp }}/airsenal.db
        run: |
          if [ ! -s "$AIRSENAL_DB_FILE" ]; then airsenal_setup_initial_db --fpl_team_id 1; fi
          python scripts/update_airsenal_worker.py
          python scripts/run_airsenal_worker.py --db "$AIRSENAL_DB_FILE" --horizon 8 --output data/generated/airsenal.csv
      - name: Live shrinkage shadow audit
        env:
          APEX_SEASON: "2026-2027"
          APEX_HORIZON: "8"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
        run: python scripts/audit_shrinkage_promotion.py --horizon 8 --force --output-dir reports/shrinkage_promotion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shrinkage-validation-${{ github.run_id }}
          path: |
            reports/shrinkage_validation.json
            reports/shrinkage_promotion/
          retention-days: 90
      - name: Enforce historical gate
        if: steps.calibration.outcome != 'success'
        run: exit 1
