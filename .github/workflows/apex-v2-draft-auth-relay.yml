name: Apex V2 Draft Auth Relay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apex-v2-draft-auth-relay.yml"
      - "scripts/apex_v2_draft_auth_relay_ops.py"
      - "scripts/apex_v2_auth_ops.py"
      - "docs/FPL_APEX_MASTER_STATE.md"
      - "docs/APEX_CAPABILITY_REGISTRY.yaml"
      - "docs/CHATGPT_APEX_QUERY_POLICY.md"
      - "docs/APEX_V2_DAILY_OPERATIONS.md"
      - "docs/APEX_DRAFT_QUERY.md"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: apex-v2-fpl-auth
  cancel-in-progress: false

env:
  FROZEN_APEX_BASE_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  relay:
    if: vars.APEX_V2_PRIVATE_MANAGER_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve authority-selected authentication core
        id: core
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          readarray -t AUTHORITY < <(python - <<'PY'
          import json
          authority = json.load(open("docs/APEX_V2_AUTHORITY.json", encoding="utf-8"))
          print(authority["production_core_sha"])
          print(authority["frozen_engine_sha"])
          PY
          )
          PRODUCTION_CORE_SHA="${AUTHORITY[0]}"
          FROZEN_ENGINE_SHA="${AUTHORITY[1]}"
          [[ "$PRODUCTION_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FROZEN_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$FROZEN_ENGINE_SHA" = "$FROZEN_APEX_BASE_SHA"
          git fetch --no-tags origin "$FROZEN_ENGINE_SHA" "$PRODUCTION_CORE_SHA"
          git merge-base --is-ancestor "$FROZEN_ENGINE_SHA" "$PRODUCTION_CORE_SHA"
          CORE="$RUNNER_TEMP/apex-v2-auth-core"
          rm -rf "$CORE"
          git worktree add --detach "$CORE" "$PRODUCTION_CORE_SHA"
          test "$(git -C "$CORE" rev-parse HEAD)" = "$PRODUCTION_CORE_SHA"
          test -f "$CORE/scripts/preflight_fpl_auth.py"
          test -f "$CORE/config/apex_v2.yaml"
          echo "sha=$PRODUCTION_CORE_SHA" >> "$GITHUB_OUTPUT"
          echo "path=$CORE" >> "$GITHUB_OUTPUT"
          echo "APEX_CODE_SHA=$PRODUCTION_CORE_SHA" >> "$GITHUB_ENV"
          echo "APEX_CORE_PATH=$CORE" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact authority-selected Apex V2 core
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$APEX_CORE_PATH/requirements-v2.lock" ]; then
            PIP_PIN="$(grep -E '^pip==' "$APEX_CORE_PATH/requirements-v2.lock")"
            SETUPTOOLS_PIN="$(grep -E '^setuptools==' "$APEX_CORE_PATH/requirements-v2.lock")"
            WHEEL_PIN="$(grep -E '^wheel==' "$APEX_CORE_PATH/requirements-v2.lock")"
            test -n "$PIP_PIN"
            test -n "$SETUPTOOLS_PIN"
            test -n "$WHEEL_PIN"
            python -m pip install "$PIP_PIN" "$SETUPTOOLS_PIN" "$WHEEL_PIN"
            python -m pip install --no-build-isolation \
              -c "$APEX_CORE_PATH/requirements-v2.lock" -e "$APEX_CORE_PATH[dev]"
          else
            python -m pip install -e "$APEX_CORE_PATH[dev]"
          fi
          python -m pip check

      - name: Preflight private auth store
        env:
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APEX_PRIVATE_GITHUB_REPOSITORY"
          test -n "$APEX_PRIVATE_GITHUB_TOKEN"
          test "$APEX_PRIVATE_GITHUB_REPOSITORY" != "$GITHUB_REPOSITORY"
          apex-v2 private-store-preflight

      - name: Materialize exact control-plane relay controllers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp scripts/apex_v2_auth_ops.py "$RUNNER_TEMP/apex_v2_auth_ops.py"
          cp scripts/apex_v2_draft_auth_relay_ops.py "$RUNNER_TEMP/apex_v2_draft_auth_relay_ops.py"
          test -s "$RUNNER_TEMP/apex_v2_auth_ops.py"
          test -s "$RUNNER_TEMP/apex_v2_draft_auth_relay_ops.py"
          test "$(git -C "$APEX_CORE_PATH" rev-parse HEAD)" = "$APEX_CODE_SHA"

      - name: Acquire certified owner credential
        id: owner_auth
        env:
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_REFRESH_WRAP_KEY: ${{ secrets.FPL_REFRESH_WRAP_KEY }}
          FPL_X_API_AUTHORIZATION: ${{ secrets.FPL_X_API_AUTHORIZATION }}
          FPL_SESSION_COOKIE: ${{ secrets.FPL_SESSION_COOKIE }}
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/apex_v2_auth_ops.py" \
            --mode production \
            --preflight-script "$APEX_CORE_PATH/scripts/preflight_fpl_auth.py" \
            --config "$APEX_CORE_PATH/config/apex_v2.yaml" \
            --github-env "$GITHUB_ENV"

      - name: Inspect Official Draft open-transaction semantics read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from typing import Any

          import requests

          root = "https://draft.premierleague.com/api"
          common = {
              "Accept": "application/json",
              "Referer": "https://draft.premierleague.com/",
              "User-Agent": "fpl-apex-draft-semantic-probe/1",
          }

          def bearer(raw: str) -> str:
              value = raw.strip()
              if not value:
                  return ""
              return value if value.casefold().startswith("bearer ") else f"Bearer {value}"

          token = bearer(os.environ.get("FPL_X_API_AUTHORIZATION", ""))
          cookie = os.environ.get("FPL_SESSION_COOKIE", "").strip()
          if token:
              auth = {**common, "X-API-Authorization": token}
              auth_mode = "token"
          elif cookie:
              auth = {**common, "Cookie": cookie}
              auth_mode = "cookie"
          else:
              raise SystemExit("certified owner credential missing from runtime environment")

          def fetch(path: str, headers: dict[str, str]) -> tuple[int, Any | None]:
              response = requests.get(f"{root}/{path}", headers=headers, timeout=20)
              try:
                  status = int(response.status_code)
                  if status != 200:
                      return status, None
                  return status, response.json()
              finally:
                  response.close()

          def schema_only(payload: Any) -> dict[str, Any]:
              fragments = ("transaction", "waiver", "request", "pending", "trade", "watch", "signing")
              result = {
                  "type": "object" if isinstance(payload, dict) else type(payload).__name__,
                  "top_level_keys": sorted(str(key) for key in payload) if isinstance(payload, dict) else [],
                  "interesting_paths": [],
              }

              def walk(value: Any, path: str, depth: int) -> None:
                  if depth > 5:
                      return
                  if isinstance(value, dict):
                      for key, child in value.items():
                          text = str(key)
                          child_path = f"{path}.{text}" if path else text
                          if any(fragment in text.casefold() for fragment in fragments):
                              item = {"path": child_path}
                              if isinstance(child, list):
                                  fields = set()
                                  for sample in child[:3]:
                                      if isinstance(sample, dict):
                                          fields.update(str(k) for k in sample)
                                  item.update({"type": "list", "count": len(child), "sample_fields": sorted(fields)})
                              elif isinstance(child, dict):
                                  item.update({"type": "object", "keys": sorted(str(k) for k in child)})
                              else:
                                  item["type"] = type(child).__name__
                              result["interesting_paths"].append(item)
                          walk(child, child_path, depth + 1)
                  elif isinstance(value, list):
                      for child in value[:3]:
                          walk(child, f"{path}[]" if path else "[]", depth + 1)

              walk(payload, "", 0)
              return result

          details_status, details = fetch("league/33160/details", common)
          if details_status != 200 or not isinstance(details, dict):
              raise SystemExit(f"league identity probe failed: HTTP {details_status}")
          matches = []
          for row in details.get("league_entries") or []:
              if not isinstance(row, dict):
                  continue
              if str(row.get("entry_name") or "").strip().casefold() != "mcnuggets":
                  continue
              raw = row.get("entry_id", row.get("id"))
              try:
                  value = int(raw)
              except (TypeError, ValueError):
                  continue
              if value > 0:
                  matches.append(value)
          if len(matches) != 1:
              raise SystemExit("configured Draft entry did not resolve uniquely")
          team_entry_id = matches[0]

          game_status, game = fetch("game", common)
          safe_game = {"http_status": game_status}
          if game_status == 200 and isinstance(game, dict):
              for key in (
                  "current_event",
                  "next_event",
                  "current_event_finished",
                  "waivers_processed",
                  "processing_status",
                  "trades_time_for_approval",
              ):
                  value = game.get(key)
                  if value is None or isinstance(value, (str, int, float, bool)):
                      safe_game[key] = value

          dynamic_status, dynamic = fetch("bootstrap-dynamic", auth)
          dynamic_schema = (
              schema_only(dynamic)
              if dynamic_status == 200
              else {"type": "unavailable", "top_level_keys": [], "interesting_paths": []}
          )

          tx_status, transactions = fetch(f"draft/entry/{team_entry_id}/transactions", auth)
          rows = []
          if tx_status == 200:
              candidate = transactions.get("transactions") if isinstance(transactions, dict) else transactions
              if isinstance(candidate, list):
                  rows = [row for row in candidate if isinstance(row, dict)]
          resolved = 0
          unresolved = 0
          fields = set()
          for row in rows:
              fields.update(str(key) for key in row)
              value = row.get("result")
              if value is None or not str(value).strip():
                  unresolved += 1
              else:
                  resolved += 1

          print(json.dumps({
              "probe": "official_fpl_draft_open_transaction_semantics",
              "body_values_emitted": False,
              "auth_mode": auth_mode,
              "team_entry_id": team_entry_id,
              "game": safe_game,
              "bootstrap_dynamic": {
                  "http_status": dynamic_status,
                  "schema": dynamic_schema,
              },
              "entry_transactions": {
                  "http_status": tx_status,
                  "row_count": len(rows),
                  "resolved_count": resolved,
                  "unresolved_count": unresolved,
                  "sample_fields": sorted(fields),
              },
          }, sort_keys=True))
          PY

      - name: Diagnose Official FPL owner endpoint status after auth failure
        if: ${{ failure() && steps.owner_auth.outcome == 'failure' }}
        env:
          FPL_X_API_AUTHORIZATION: ${{ secrets.FPL_X_API_AUTHORIZATION }}
          FPL_SESSION_COOKIE: ${{ secrets.FPL_SESSION_COOKIE }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          import requests

          url = "https://fantasy.premierleague.com/api/me/"
          common = {
              "Accept": "application/json",
              "Referer": "https://fantasy.premierleague.com/",
              "User-Agent": "fpl-apex-v2-owner-status-diagnostic/1",
          }

          def bearer(raw: str) -> str:
              value = raw.strip()
              if not value:
                  return ""
              return value if value.casefold().startswith("bearer ") else f"Bearer {value}"

          def classify(code: int) -> str:
              if code == 200:
                  return "ok"
              if code in {401, 403}:
                  return "rejected"
              if code == 429:
                  return "rate_limited"
              if 500 <= code < 600:
                  return "upstream_5xx"
              if 300 <= code < 400:
                  return "redirect"
              if 400 <= code < 500:
                  return "other_4xx"
              return "unexpected"

          probes = []
          token = bearer(os.environ.get("FPL_X_API_AUTHORIZATION", ""))
          cookie = os.environ.get("FPL_SESSION_COOKIE", "").strip()
          if token:
              probes.append(("token", {**common, "X-API-Authorization": token}))
          if cookie:
              probes.append(("cookie", {**common, "Cookie": cookie}))

          results = []
          for mode, headers in probes:
              try:
                  response = requests.get(url, headers=headers, timeout=20, stream=True)
                  try:
                      code = int(response.status_code)
                  finally:
                      response.close()
                  results.append(
                      {
                          "mode": mode,
                          "http_status": code,
                          "status_class": classify(code),
                      }
                  )
              except requests.RequestException as exc:
                  results.append(
                      {
                          "mode": mode,
                          "status_class": "network_error",
                          "error_type": type(exc).__name__,
                      }
                  )

          print(
              json.dumps(
                  {
                      "probe": "official_fpl_owner_me_direct_status",
                      "body_read": False,
                      "configured_transports": len(probes),
                      "results": results,
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Query authenticated Draft transactions and relay privately
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
          APEX_PRIVATE_GITHUB_REPOSITORY: ${{ vars.APEX_V2_PRIVATE_REPOSITORY }}
          APEX_PRIVATE_GITHUB_TOKEN: ${{ secrets.APEX_V2_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/apex_v2_draft_auth_relay_ops.py" \
            --league-id 33160 \
            --entry-name mcnuggets \
            --private-repository "$APEX_PRIVATE_GITHUB_REPOSITORY" \
            --producer-repository "$GITHUB_REPOSITORY" \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-sha "$CONTROL_PLANE_SHA" \
            --max-rows 100

      - name: Prove control-plane and authority core stayed untouched
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git -C "$APEX_CORE_PATH" rev-parse HEAD)" = "$APEX_CODE_SHA"
          test -z "$(git -C "$APEX_CORE_PATH" status --porcelain --untracked-files=no)"
