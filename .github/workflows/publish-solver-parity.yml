name: Publish independent solver parity

on:
  workflow_dispatch:
  schedule:
    - cron: "7 6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-solver-parity.yml"
      - "scripts/export_open_solver.py"
      - "scripts/compare_solver_parity.py"
      - "scripts/embed_solver_parity.py"

permissions:
  contents: write

concurrency:
  group: publish-solver-parity
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Produce current green Pinnacle maximum-EV projections
        env:
          FPL_ENTRY_ID: "63984"
          AIRSENAL_PROJECTIONS_CSV: data/generated/airsenal.csv
          APEX_NEWS_FEEDS: ${{ secrets.APEX_NEWS_FEEDS }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_URL: ${{ secrets.ODDS_API_URL }}
        shell: bash
        run: |
          pip install -e .
          python scripts/run_pinnacle.py --horizon 8 --stochastic-scenarios 256
          python scripts/export_open_solver.py \
            reports/players.csv reports/projections.csv /tmp/apex.csv \
            --projection-col xp

      - name: Read pinned independent solver revision
        id: pin
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("upstreams.lock.json", encoding="utf-8"))
          source = lock["sources"]["open_fpl_solver"]
          print(f"repository={source['repository']}")
          print(f"sha={source['commit']}")
          PY

      - name: Run pinned open-fpl-solver on identical ensemble-mean xP
        shell: bash
        run: |
          python -m pip install uv
          mkdir -p workers
          git clone --filter=blob:none \
            "https://github.com/${{ steps.pin.outputs.repository }}.git" \
            workers/open-fpl-solver
          git -C workers/open-fpl-solver checkout --detach "${{ steps.pin.outputs.sha }}"
          cp /tmp/apex.csv workers/open-fpl-solver/data/apex.csv
          cd workers/open-fpl-solver
          uv sync
          uv run python run/solve.py --datasource apex --horizon 8

      - name: Compare and embed same-surface parity
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(ls -t workers/open-fpl-solver/data/results/apex_*.csv | head -1)"
          python scripts/compare_solver_parity.py \
            data/generated/pinnacle_latest.json "$RESULT"
          python scripts/embed_solver_parity.py \
            data/generated/pinnacle_latest.json \
            data/generated/solver_parity.json
          python scripts/assert_pinnacle.py data/generated/pinnacle_latest.json

      - name: Commit repository-readable Pinnacle parity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/generated/solver_parity.json \
            data/generated/pinnacle_latest.json \
            data/generated/pinnacle_latest.md
          if git diff --cached --quiet; then
            echo "Pinnacle parity evidence unchanged"
            exit 0
          fi
          git commit -m "data: publish Pinnacle EV solver parity [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-pinnacle-parity-${{ github.run_id }}
          path: |
            data/generated/solver_parity.json
            data/generated/pinnacle_latest.json
            data/generated/pinnacle_latest.md
          retention-days: 30
