name: Apex V2 Ops Contract

on:
  pull_request:
    paths:
      - ".github/workflows/apex-v2-auth-keepalive.yml"
      - ".github/workflows/apex-v2-daily-production.yml"
      - ".github/workflows/apex-v2-daily-evaluation.yml"
      - ".github/workflows/apex-v2-direct-auth-diagnostic.yml"
      - ".github/workflows/apex-v2-deadline-watch.yml"
      - ".github/workflows/apex-v2-owner-brief.yml"
      - ".github/workflows/apex-v2-decision-quality.yml"
      - ".github/workflows/apex-v2-ops-contract.yml"
      - ".github/workflows/pinnacle.yml"
      - ".github/workflows/airsenal.yml"
      - ".github/workflows/refresh-core-pin.yml"
      - "scripts/apex_v2_auth_ops.py"
      - "scripts/apex_v2_attempt_audit_ops.py"
      - "scripts/apex_v2_deadline_ops.py"
      - "scripts/apex_v2_owner_brief_ops.py"
      - "scripts/apex_v2_decision_quality_ops.py"
      - "scripts/check_governance_consistency.py"
      - "ops_tests/**"
      - "docs/APEX_V2_DAILY_OPERATIONS.md"
      - "docs/APEX_V2_SAFE_EXTENSIONS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-v2-ops-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert operations-only change surface
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python - <<'PY'
          import subprocess

          allowed_exact = {
              ".github/workflows/apex-v2-auth-keepalive.yml",
              ".github/workflows/apex-v2-daily-production.yml",
              ".github/workflows/apex-v2-daily-evaluation.yml",
              ".github/workflows/apex-v2-direct-auth-diagnostic.yml",
              ".github/workflows/apex-v2-deadline-watch.yml",
              ".github/workflows/apex-v2-owner-brief.yml",
              ".github/workflows/apex-v2-decision-quality.yml",
              ".github/workflows/apex-v2-ops-contract.yml",
              ".github/workflows/pinnacle.yml",
              ".github/workflows/airsenal.yml",
              ".github/workflows/refresh-core-pin.yml",
              "scripts/apex_v2_auth_ops.py",
              "scripts/apex_v2_attempt_audit_ops.py",
              "scripts/apex_v2_deadline_ops.py",
              "scripts/apex_v2_owner_brief_ops.py",
              "scripts/apex_v2_decision_quality_ops.py",
              "scripts/check_governance_consistency.py",
              "docs/APEX_V2_DAILY_OPERATIONS.md",
              "docs/APEX_V2_SAFE_EXTENSIONS.md",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(
              path
              for path in changed
              if path not in allowed_exact and not path.startswith("ops_tests/")
          )
          if unexpected:
              raise SystemExit(f"ops PR touched non-operational paths: {unexpected}")
          if not changed:
              raise SystemExit("ops PR has no changes")
          forbidden = sorted(
              path for path in changed if path.startswith(("src/", "config/", "tests/"))
          )
          if forbidden:
              raise SystemExit(f"ops PR touched frozen-engine paths: {forbidden}")
          PY

      - name: Run operations regression tests
        run: python -m unittest discover -s ops_tests -p 'test_*.py' -v

      - name: Assert repository workflow governance is consistent
        run: python scripts/check_governance_consistency.py

      - name: Assert frozen production contract is unchanged and unique
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          frozen = "99cc7b51b0cff45462b567084cb1844cfe0a456f"
          text = Path(".github/workflows/apex-v2-daily-production.yml").read_text(encoding="utf-8")
          required = [
              frozen,
              'cron: "17 4 * * *"',
              "group: apex-v2-fpl-auth",
              "cancel-in-progress: false",
              "ref: $" + "{{ env.APEX_CODE_SHA }}",
              "CONTROL_PLANE_SHA: $" + "{{ github.sha }}",
              "apex_v2_auth_ops.py",
              "--mode production",
              "apex-v2 private-store-preflight",
              "apex-v2 official-hash",
              "scripts/acquire_dastan_shadow.py",
              "--snapshot-output \"$SNAPSHOT_FILE\"",
              'APEX_ALLOW_NETWORK_DURING_SOLVE: "0"',
              "scripts/check_v2_architecture.py",
              "apex-v2 solve",
              "apex-v2 publish",
              "artifacts/v2/diagnostics/",
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f"daily production contract missing: {missing}")
          forbidden = [
              "pull_request:",
              "\n  push:\n",
              "apex_v2_deadline_ops.py",
              "deadline-window",
              "ref: $" + "{{ github.sha }}",
              "cancel-in-progress: true",
          ]
          present = [needle for needle in forbidden if needle in text]
          if present:
              raise SystemExit(f"daily production contract drifted: {present}")
          PY

      - name: Assert authentication safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          frozen = "99cc7b51b0cff45462b567084cb1844cfe0a456f"
          keepalive = Path(".github/workflows/apex-v2-auth-keepalive.yml").read_text(encoding="utf-8")
          for needle in (
              frozen,
              'cron: "22 */6 * * *"',
              "permissions:\n  contents: read",
              "group: apex-v2-fpl-auth",
              "cancel-in-progress: false",
              "ref: $" + "{{ env.FROZEN_APEX_SHA }}",
              "apex-v2 private-store-preflight",
              "apex_v2_auth_ops.py",
              "--mode keepalive",
              'test -z "$(git status --porcelain --untracked-files=no)"',
          ):
              if needle not in keepalive:
                  raise SystemExit(f"auth keepalive contract missing: {needle}")
          for forbidden in (
              "FPL_X_API_AUTHORIZATION",
              "FPL_SESSION_COOKIE",
              "apex-v2 intent",
              "apex-v2 official-hash",
              "apex-v2 acquire",
              "apex-v2 solve",
              "apex-v2 publish",
              "contents: write",
          ):
              if forbidden in keepalive:
                  raise SystemExit(f"auth keepalive crossed safety boundary: {forbidden}")

          controller = Path("scripts/apex_v2_auth_ops.py").read_text(encoding="utf-8")
          for needle in (
              "Official FPL refresh credential was rejected or expired",
              "_bootstrap_recover",
              "_persist_private_refresh_token",
              'direct_env["FPL_REFRESH_TOKEN"] = ""',
              'direct_env["FPL_REFRESH_WRAP_KEY"] = ""',
              'if mode == "keepalive":',
              "verify_owner_credential",
          ):
              if needle not in controller:
                  raise SystemExit(f"auth recovery invariant missing: {needle}")
          PY

      - name: Assert direct-auth diagnostic remains non-serving and incident-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/apex-v2-direct-auth-diagnostic.yml").read_text(encoding="utf-8")
          for needle in (
              "99cc7b51b0cff45462b567084cb1844cfe0a456f",
              "permissions:\n  contents: read",
              "workflow_dispatch:",
              'FPL_REFRESH_TOKEN: ""',
              'FPL_REFRESH_WRAP_KEY: ""',
              "python scripts/preflight_fpl_auth.py --config config/apex_v2.yaml",
          ):
              if needle not in text:
                  raise SystemExit(f"direct-auth diagnostic contract missing: {needle}")
          for forbidden in (
              "schedule:",
              "cron:",
              "contents: write",
              "apex-v2 intent",
              "apex-v2 acquire",
              "apex-v2 solve",
              "apex-v2 publish",
          ):
              if forbidden in text:
                  raise SystemExit(f"direct-auth diagnostic crossed safety boundary: {forbidden}")
          PY

      - name: Assert evaluation orphan policy and frozen evaluator contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/apex-v2-daily-evaluation.yml").read_text(encoding="utf-8")
          for needle in (
              "99cc7b51b0cff45462b567084cb1844cfe0a456f",
              'cron: "41 6 * * *"',
              "ref: $" + "{{ env.FROZEN_APEX_SHA }}",
              "apex_v2_attempt_audit_ops.py",
              "apex-v2 evaluate-completed",
              "apex-v2 tournament-standings",
          ):
              if needle not in text:
                  raise SystemExit(f"daily evaluation contract missing: {needle}")
          audit = Path("scripts/apex_v2_attempt_audit_ops.py").read_text(encoding="utf-8")
          expected = {
              "33242604422-1",
              "33257608630-1",
              "33260512411-1",
              "33265747805-1",
              "33272866621-1",
              "33312221205-1",
          }
          missing = sorted(run for run in expected if run not in audit)
          if missing:
              raise SystemExit(f"historical acknowledgement set drifted: {missing}")
          for needle in ("unacknowledged_missing_finals", "returncode not in {0, 2}", "operationally_clear"):
              if needle not in audit:
                  raise SystemExit(f"attempt-audit fail-closed invariant missing: {needle}")
          PY

      - name: Assert deadline watcher can only request the existing publisher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apex-v2-deadline-watch.yml").read_text(encoding="utf-8")
          script = Path("scripts/apex_v2_deadline_ops.py").read_text(encoding="utf-8")
          for needle in (
              'cron: "11,41 * * * *"',
              "actions: write",
              "group: apex-v2-deadline-watch",
              "cancel-in-progress: false",
              "--min-minutes 90",
              "--max-minutes 150",
              "apex_v2_deadline_ops.py",
          ):
              if needle not in workflow:
                  raise SystemExit(f"deadline watcher contract missing: {needle}")
          for forbidden in (
              "FPL_REFRESH_TOKEN",
              "FPL_X_API_AUTHORIZATION",
              "FPL_SESSION_COOKIE",
              "APEX_PRIVATE_GITHUB_TOKEN",
              "contents: write",
              "apex-v2 intent",
              "apex-v2 official-hash",
              "apex-v2 acquire",
              "apex-v2 solve",
              "apex-v2 publish",
              "airsenal",
              "acquire_dastan",
          ):
              if forbidden in workflow:
                  raise SystemExit(f"deadline watcher crossed serving boundary: {forbidden}")
          for needle in (
              "bootstrap-static",
              "SKIPPED_ALREADY_RECORDED",
              "workflow_dispatch",
              'payload={"ref": "main"}',
          ):
              if needle not in script:
                  raise SystemExit(f"deadline controller invariant missing: {needle}")
          PY

      - name: Assert owner brief is private and read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apex-v2-owner-brief.yml").read_text(encoding="utf-8")
          script = Path("scripts/apex_v2_owner_brief_ops.py").read_text(encoding="utf-8")
          for needle in (
              '"Apex V2 Daily Production"',
              "permissions:\n  contents: read",
              "99cc7b51b0cff45462b567084cb1844cfe0a456f",
              "APEX_V2_PRIVATE_REPO_TOKEN",
              "apex_v2_owner_brief_ops.py",
              "apex-v2 private-store-preflight",
          ):
              if needle not in workflow:
                  raise SystemExit(f"owner brief workflow contract missing: {needle}")
          for forbidden in (
              "schedule:",
              "cron:",
              "contents: write",
              "apex-v2 intent",
              "apex-v2 acquire",
              "apex-v2 solve",
              "apex-v2 publish",
              "airsenal",
              "acquire_dastan",
          ):
              if forbidden in workflow:
                  raise SystemExit(f"owner brief crossed serving boundary: {forbidden}")
          for needle in (
              '"production_influence": "NONE"',
              '"serving_authorized": False',
              '"recomputed_xp": False',
              '"altered_transfer_decision": False',
              "private-presentation",
          ):
              if needle not in script:
                  raise SystemExit(f"owner brief controller invariant missing: {needle}")
          PY

      - name: Assert decision-quality diagnostics are retrospective and non-serving
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apex-v2-decision-quality.yml").read_text(encoding="utf-8")
          script = Path("scripts/apex_v2_decision_quality_ops.py").read_text(encoding="utf-8")
          for needle in (
              '"Apex V2 Daily Evaluation"',
              "permissions:\n  contents: read",
              "99cc7b51b0cff45462b567084cb1844cfe0a456f",
              "APEX_V2_PRIVATE_REPO_TOKEN",
              "apex_v2_decision_quality_ops.py",
              "apex-v2 private-store-preflight",
          ):
              if needle not in workflow:
                  raise SystemExit(f"decision-quality workflow contract missing: {needle}")
          for forbidden in (
              "schedule:",
              "cron:",
              "contents: write",
              "apex-v2 intent",
              "apex-v2 acquire",
              "apex-v2 solve",
              "apex-v2 publish",
              "airsenal",
              "acquire_dastan",
          ):
              if forbidden in workflow:
                  raise SystemExit(f"decision-quality crossed serving boundary: {forbidden}")
          for needle in (
              "PUBLIC_OUTCOME_PREFIX",
              '"production_influence": "NONE"',
              '"serving_authorized": False',
              '"promotion_authority": False',
              "private-decision-quality",
              "hit_cost_interpreted",
          ):
              if needle not in script:
                  raise SystemExit(f"decision-quality controller invariant missing: {needle}")
          PY

      - name: Assert legacy compatibility workflows remain manual-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for path in (
              Path(".github/workflows/pinnacle.yml"),
              Path(".github/workflows/airsenal.yml"),
              Path(".github/workflows/refresh-core-pin.yml"),
          ):
              body = path.read_text(encoding="utf-8")
              if "workflow_dispatch:" not in body:
                  raise SystemExit(f"legacy workflow is not manually invokable: {path}")
              if "schedule:" in body or "cron:" in body:
                  raise SystemExit(f"legacy workflow regained automatic schedule: {path}")
              if path.name == "pinnacle.yml" and "\n  push:" in body:
                  raise SystemExit("legacy Apex Unified regained automatic push trigger")
              first = body.splitlines()[0] if body.splitlines() else ""
              if "RETIRED: manual-only legacy workflow" not in first:
                  raise SystemExit(f"legacy retirement marker missing: {path}")
          PY

      - name: Assert governance inventory registers all V2 operations workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          governance = Path("scripts/check_governance_consistency.py").read_text(encoding="utf-8")
          for name in (
              "apex-v2-auth-keepalive.yml",
              "apex-v2-daily-production.yml",
              "apex-v2-daily-evaluation.yml",
              "apex-v2-direct-auth-diagnostic.yml",
              "apex-v2-deadline-watch.yml",
              "apex-v2-owner-brief.yml",
              "apex-v2-decision-quality.yml",
              "apex-v2-ops-contract.yml",
          ):
              if f'"{name}"' not in governance:
                  raise SystemExit(f"governance inventory does not register {name}")
          PY

  readiness:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pin resolves to certified V2 implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FROZEN_APEX_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FROZEN_APEX_SHA"
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- '--snapshot-output'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- 'APEX_ALLOW_NETWORK_DURING_SOLVE'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- 'apex-v2 publish'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-evaluation.yml" | grep -F -- 'apex-v2 evaluate-completed'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-evaluation.yml" | grep -F -- 'apex-v2 tournament-standings'

      - name: Prove frozen engine source is untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git diff --name-only origin/main...HEAD -- src config tests | grep -q .; then
            echo "Operations extension modified frozen-engine source/config/test paths." >&2
            git diff --name-only origin/main...HEAD -- src config tests >&2
            exit 1
          fi
          python - <<'PY'
          import subprocess

          allowed_scripts = {
              "scripts/apex_v2_auth_ops.py",
              "scripts/apex_v2_attempt_audit_ops.py",
              "scripts/apex_v2_deadline_ops.py",
              "scripts/apex_v2_owner_brief_ops.py",
              "scripts/apex_v2_decision_quality_ops.py",
              "scripts/check_governance_consistency.py",
          }
          scripts = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD", "--", "scripts"],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(scripts - allowed_scripts)
          if unexpected:
              raise SystemExit(f"Operations extension modified unexpected scripts: {unexpected}")
          PY
