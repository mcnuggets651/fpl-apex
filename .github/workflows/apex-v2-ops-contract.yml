name: Apex V2 Ops Contract

on:
  pull_request:
    paths:
      - ".github/workflows/apex-v2-daily-production.yml"
      - ".github/workflows/apex-v2-daily-evaluation.yml"
      - ".github/workflows/apex-v2-ops-contract.yml"
      - ".github/workflows/pinnacle.yml"
      - ".github/workflows/airsenal.yml"
      - ".github/workflows/refresh-core-pin.yml"
      - "docs/APEX_V2_DAILY_OPERATIONS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-v2-ops-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert operations-only change surface
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/apex-v2-daily-production.yml",
              ".github/workflows/apex-v2-daily-evaluation.yml",
              ".github/workflows/apex-v2-ops-contract.yml",
              ".github/workflows/pinnacle.yml",
              ".github/workflows/airsenal.yml",
              ".github/workflows/refresh-core-pin.yml",
              "docs/APEX_V2_DAILY_OPERATIONS.md",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"ops PR touched non-operational paths: {unexpected}")
          if not changed:
              raise SystemExit("ops PR has no changes")
          PY

      - name: Assert frozen production contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          frozen = "99cc7b51b0cff45462b567084cb1844cfe0a456f"
          path = Path(".github/workflows/apex-v2-daily-production.yml")
          text = path.read_text(encoding="utf-8")
          required = [
              frozen,
              'cron: "17 4 * * *"',
              "ref: $" + "{{ env.APEX_CODE_SHA }}",
              "apex-v2 private-store-preflight",
              "scripts/preflight_fpl_auth.py",
              "apex-v2 official-hash",
              "scripts/acquire_dastan_shadow.py",
              "--snapshot-output \"$SNAPSHOT_FILE\"",
              'APEX_ALLOW_NETWORK_DURING_SOLVE: "0"',
              "scripts/check_v2_architecture.py",
              "apex-v2 solve",
              "apex-v2 publish",
              "artifacts/v2/diagnostics/",
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f"daily production contract missing: {missing}")
          forbidden = ["pull_request:", "github.sha"]
          present = [needle for needle in forbidden if needle in text]
          if present:
              raise SystemExit(f"daily production must remain frozen-SHA operational only: {present}")
          PY

      - name: Assert evaluation and single-publisher contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          frozen = "99cc7b51b0cff45462b567084cb1844cfe0a456f"
          text = Path(".github/workflows/apex-v2-daily-evaluation.yml").read_text(encoding="utf-8")
          required = [
              frozen,
              'cron: "41 6 * * *"',
              "ref: $" + "{{ env.FROZEN_APEX_SHA }}",
              "apex-v2 audit-attempts --prefix apex-v2",
              "apex-v2 private-store-preflight",
              "apex-v2 evaluate-completed",
              "--code-sha \"$FROZEN_APEX_SHA\"",
              "apex-v2 tournament-standings",
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f"daily evaluation contract missing: {missing}")

          retired = [
              Path(".github/workflows/pinnacle.yml"),
              Path(".github/workflows/airsenal.yml"),
              Path(".github/workflows/refresh-core-pin.yml"),
          ]
          present = [str(path) for path in retired if path.exists()]
          if present:
              raise SystemExit(f"legacy scheduled production paths still present: {present}")
          PY

  readiness:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pin resolves to certified V2 implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FROZEN_APEX_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FROZEN_APEX_SHA"
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- '--snapshot-output'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- 'APEX_ALLOW_NETWORK_DURING_SOLVE'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- 'apex-v2 publish'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-evaluation.yml" | grep -F -- 'apex-v2 evaluate-completed'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-evaluation.yml" | grep -F -- 'apex-v2 tournament-standings'

      - name: Prove frozen core is untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git diff --name-only origin/main...HEAD -- src config scripts tests | grep -q .; then
            echo "Operations cutover modified frozen-engine source paths." >&2
            git diff --name-only origin/main...HEAD -- src config scripts tests >&2
            exit 1
          fi
