name: Apex V2 Ops Contract

on:
  pull_request:
    paths:
      - ".github/workflows/apex-v2-auth-keepalive.yml"
      - ".github/workflows/apex-v2-daily-production.yml"
      - ".github/workflows/apex-v2-daily-evaluation.yml"
      - ".github/workflows/apex-v2-ops-contract.yml"
      - ".github/workflows/pinnacle.yml"
      - ".github/workflows/airsenal.yml"
      - ".github/workflows/refresh-core-pin.yml"
      - "scripts/apex_v2_auth_ops.py"
      - "scripts/apex_v2_attempt_audit_ops.py"
      - "scripts/check_governance_consistency.py"
      - "ops_tests/**"
      - "docs/APEX_V2_DAILY_OPERATIONS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-v2-ops-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert operations-only change surface
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python - <<'PY'
          import subprocess

          allowed_exact = {
              ".github/workflows/apex-v2-auth-keepalive.yml",
              ".github/workflows/apex-v2-daily-production.yml",
              ".github/workflows/apex-v2-daily-evaluation.yml",
              ".github/workflows/apex-v2-ops-contract.yml",
              ".github/workflows/pinnacle.yml",
              ".github/workflows/airsenal.yml",
              ".github/workflows/refresh-core-pin.yml",
              "scripts/apex_v2_auth_ops.py",
              "scripts/apex_v2_attempt_audit_ops.py",
              "scripts/check_governance_consistency.py",
              "docs/APEX_V2_DAILY_OPERATIONS.md",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(
              path
              for path in changed
              if path not in allowed_exact and not path.startswith("ops_tests/")
          )
          if unexpected:
              raise SystemExit(f"ops PR touched non-operational paths: {unexpected}")
          if not changed:
              raise SystemExit("ops PR has no changes")
          forbidden_roots = ("src/", "config/", "tests/")
          forbidden = sorted(
              path for path in changed if path.startswith(forbidden_roots)
          )
          if forbidden:
              raise SystemExit(f"ops PR touched frozen-engine paths: {forbidden}")
          PY

      - name: Run operations regression tests
        run: python -m unittest discover -s ops_tests -p 'test_*.py' -v

      - name: Assert repository workflow governance is consistent
        run: python scripts/check_governance_consistency.py

      - name: Assert frozen production contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          frozen = "99cc7b51b0cff45462b567084cb1844cfe0a456f"
          path = Path(".github/workflows/apex-v2-daily-production.yml")
          text = path.read_text(encoding="utf-8")
          required = [
              frozen,
              'cron: "17 4 * * *"',
              "group: apex-v2-fpl-auth",
              "cancel-in-progress: false",
              "ref: $" + "{{ env.APEX_CODE_SHA }}",
              "CONTROL_PLANE_SHA: $" + "{{ github.sha }}",
              "apex_v2_auth_ops.py",
              "--mode production",
              "--preflight-script scripts/preflight_fpl_auth.py",
              "apex-v2 private-store-preflight",
              "apex-v2 official-hash",
              "scripts/acquire_dastan_shadow.py",
              "--snapshot-output \"$SNAPSHOT_FILE\"",
              'APEX_ALLOW_NETWORK_DURING_SOLVE: "0"',
              "scripts/check_v2_architecture.py",
              "apex-v2 solve",
              "apex-v2 publish",
              "artifacts/v2/diagnostics/",
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f"daily production contract missing: {missing}")
          forbidden = [
              "pull_request:",
              "ref: $" + "{{ github.sha }}",
              "cancel-in-progress: true",
          ]
          present = [needle for needle in forbidden if needle in text]
          if present:
              raise SystemExit(
                  f"daily production must remain frozen-SHA operational only: {present}"
              )

          controller = Path("scripts/apex_v2_auth_ops.py").read_text(encoding="utf-8")
          controller_required = [
              "Official FPL refresh credential was rejected or expired",
              "_bootstrap_recover",
              "_persist_private_refresh_token",
              'direct_env["FPL_REFRESH_TOKEN"] = ""',
              'direct_env["FPL_REFRESH_WRAP_KEY"] = ""',
              'if mode == "keepalive":',
              "verify_owner_credential",
          ]
          missing_controller = [
              needle for needle in controller_required if needle not in controller
          ]
          if missing_controller:
              raise SystemExit(
                  f"auth recovery controller lost fail-closed invariants: {missing_controller}"
              )
          PY

      - name: Assert auth keepalive is isolated and non-serving
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          frozen = "99cc7b51b0cff45462b567084cb1844cfe0a456f"
          text = Path(".github/workflows/apex-v2-auth-keepalive.yml").read_text(
              encoding="utf-8"
          )
          required = [
              frozen,
              'cron: "22 */6 * * *"',
              "permissions:\n  contents: read",
              "group: apex-v2-fpl-auth",
              "cancel-in-progress: false",
              "ref: $" + "{{ env.FROZEN_APEX_SHA }}",
              'test "$GITHUB_REF" = "refs/heads/main"',
              "CONTROL_PLANE_SHA: $" + "{{ github.sha }}",
              "apex-v2 private-store-preflight",
              "apex_v2_auth_ops.py",
              "--mode keepalive",
              "--preflight-script scripts/preflight_fpl_auth.py",
              'test -z "$(git status --porcelain --untracked-files=no)"',
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f"auth keepalive contract missing: {missing}")
          forbidden = [
              "FPL_X_API_AUTHORIZATION",
              "FPL_SESSION_COOKIE",
              "apex-v2 intent",
              "apex-v2 official-hash",
              "apex-v2 acquire",
              "apex-v2 solve",
              "apex-v2 publish",
              "airsenal",
              "acquire_dastan",
              "contents: write",
              "ref: $" + "{{ github.sha }}",
          ]
          present = [needle for needle in forbidden if needle in text]
          if present:
              raise SystemExit(
                  f"auth keepalive crossed into serving/decision behavior: {present}"
              )
          PY

      - name: Assert evaluation orphan policy and single-publisher contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          frozen = "99cc7b51b0cff45462b567084cb1844cfe0a456f"
          text = Path(".github/workflows/apex-v2-daily-evaluation.yml").read_text(
              encoding="utf-8"
          )
          required = [
              frozen,
              'cron: "41 6 * * *"',
              "ref: $" + "{{ env.FROZEN_APEX_SHA }}",
              'test "$GITHUB_REF" = "refs/heads/main"',
              "CONTROL_PLANE_SHA: $" + "{{ github.sha }}",
              "apex_v2_attempt_audit_ops.py",
              "--prefix apex-v2",
              "apex-v2 private-store-preflight",
              "apex-v2 evaluate-completed",
              "--code-sha \"$FROZEN_APEX_SHA\"",
              "apex-v2 tournament-standings",
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f"daily evaluation contract missing: {missing}")

          audit = Path("scripts/apex_v2_attempt_audit_ops.py").read_text(encoding="utf-8")
          expected_failed_runs = {
              "33242604422-1",
              "33257608630-1",
              "33260512411-1",
              "33265747805-1",
              "33272866621-1",
              "33312221205-1",
          }
          missing_ack = sorted(run for run in expected_failed_runs if run not in audit)
          if missing_ack:
              raise SystemExit(
                  f"historical failed-attempt acknowledgements are incomplete: {missing_ack}"
              )
          for invariant in (
              "unacknowledged_missing_finals",
              "returncode not in {0, 2}",
              "operationally_clear",
          ):
              if invariant not in audit:
                  raise SystemExit(f"attempt-audit fail-closed invariant missing: {invariant}")

          legacy = [
              Path(".github/workflows/pinnacle.yml"),
              Path(".github/workflows/airsenal.yml"),
              Path(".github/workflows/refresh-core-pin.yml"),
          ]
          for path in legacy:
              if not path.is_file():
                  raise SystemExit(f"legacy compatibility workflow missing: {path}")
              body = path.read_text(encoding="utf-8")
              if "workflow_dispatch:" not in body:
                  raise SystemExit(f"legacy workflow is not manually invokable: {path}")
              if "schedule:" in body or "cron:" in body:
                  raise SystemExit(f"legacy workflow still has an automatic schedule: {path}")
              if path.name == "pinnacle.yml" and "\n  push:" in body:
                  raise SystemExit("legacy Apex Unified still has an automatic push trigger")
              first = body.splitlines()[0] if body.splitlines() else ""
              if "RETIRED: manual-only legacy workflow" not in first:
                  raise SystemExit(f"legacy retirement marker missing: {path}")

          governance = Path("scripts/check_governance_consistency.py").read_text(
              encoding="utf-8"
          )
          for name in (
              "apex-v2-auth-keepalive.yml",
              "apex-v2-daily-production.yml",
              "apex-v2-daily-evaluation.yml",
              "apex-v2-ops-contract.yml",
          ):
              if f'"{name}"' not in governance:
                  raise SystemExit(f"governance inventory does not register {name}")
          PY

  readiness:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pin resolves to certified V2 implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FROZEN_APEX_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$FROZEN_APEX_SHA"
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- '--snapshot-output'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- 'APEX_ALLOW_NETWORK_DURING_SOLVE'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- 'apex-v2 publish'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-evaluation.yml" | grep -F -- 'apex-v2 evaluate-completed'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-evaluation.yml" | grep -F -- 'apex-v2 tournament-standings'

      - name: Prove frozen engine source is untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git diff --name-only origin/main...HEAD -- src config tests | grep -q .; then
            echo "Operations repair modified frozen-engine source/config/test paths." >&2
            git diff --name-only origin/main...HEAD -- src config tests >&2
            exit 1
          fi
          python - <<'PY'
          import subprocess

          allowed_scripts = {
              "scripts/apex_v2_auth_ops.py",
              "scripts/apex_v2_attempt_audit_ops.py",
              "scripts/check_governance_consistency.py",
          }
          scripts = set(
              subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      "origin/main...HEAD",
                      "--",
                      "scripts",
                  ],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(scripts - allowed_scripts)
          if unexpected:
              raise SystemExit(
                  f"Operations repair modified unexpected script paths: {unexpected}"
              )
          PY
