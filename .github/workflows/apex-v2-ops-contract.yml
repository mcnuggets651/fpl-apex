name: Apex V2 Ops Contract

on:
  pull_request:
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".github/dependabot.yml"
      - "scripts/apex_v2_*.py"
      - "scripts/check_governance_consistency.py"
      - "ops_tests/**"
      - "tests/test_airsenal_source_absence_policy.py"
      - "tests/test_airsenal_workflow_contract.py"
      - "tests/test_core_candidate_publication.py"
      - "tests/test_production_publication_contract.py"
      - "tests/test_solver_parity_contract.py"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "docs/APEX_V2_AUTHORITY.json"
      - "docs/CURRENT_STATE.md"
      - "docs/APEX_MASTER_CONTEXT.md"
      - "docs/APEX_OPERATING_MANUAL.md"
      - "docs/KNOWN_ISSUES.md"
      - "docs/SESSION_LOG.md"
      - "docs/CHATGPT_USAGE.md"
      - "docs/CHATGPT_APEX_QUERY_POLICY.md"
      - "docs/APEX_ROADMAP.md"
      - "docs/APEX_DECISIONS.md"
      - "docs/APEX_CHANGELOG.md"
      - "docs/APEX_V2_DAILY_OPERATIONS.md"
      - "docs/APEX_V2_SAFE_EXTENSIONS.md"
      - "docs/APEX_V2_PROSPECTIVE_TOURNAMENT.md"
      - "docs/operations/SHADOW_PROVIDER_RELIABILITY.md"
      - "docs/operations/PARALLEL_DECISION_LAB.md"
      - "archive/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-v2-ops-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Assert bounded operations and governance change surface
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python - <<'PY'
          import subprocess
          from pathlib import Path

          allowed_exact = {
              ".github/dependabot.yml",
              ".github/workflows/apex-v2-auth-keepalive.yml",
              ".github/workflows/apex-v2-daily-evaluation.yml",
              ".github/workflows/apex-v2-daily-production.yml",
              ".github/workflows/apex-v2-deadline-watch.yml",
              ".github/workflows/apex-v2-decision-quality.yml",
              ".github/workflows/apex-v2-direct-auth-diagnostic.yml",
              ".github/workflows/apex-v2-ops-contract.yml",
              ".github/workflows/apex-v2-owner-brief.yml",
              ".github/workflows/apex-v2-prospective-tournament.yml",
              ".github/workflows/apex-v2-shadow-health.yml",
              ".github/workflows/apex.yml",
              ".github/workflows/production-readiness.yml",
              ".github/workflows/projection-policy-audit.yml",
              ".github/workflows/team-strength-validation.yml",
              "scripts/apex_v2_auth_ops.py",
              "scripts/apex_v2_attempt_audit_ops.py",
              "scripts/apex_v2_deadline_ops.py",
              "scripts/apex_v2_owner_brief_ops.py",
              "scripts/apex_v2_decision_quality_ops.py",
              "scripts/apex_v2_decision_lab_parallel.py",
              "scripts/apex_v2_shadow_provider_ops.py",
              "scripts/apex_v2_tournament_common.py",
              "scripts/apex_v2_tournament_contract.py",
              "scripts/apex_v2_tournament_ops.py",
              "scripts/apex_v2_tournament_scoring.py",
              "scripts/check_governance_consistency.py",
              "tests/test_airsenal_source_absence_policy.py",
              "tests/test_airsenal_workflow_contract.py",
              "tests/test_core_candidate_publication.py",
              "tests/test_production_publication_contract.py",
              "tests/test_solver_parity_contract.py",
              "README.md",
              "PROJECT_STATUS.md",
              "docs/APEX_V2_AUTHORITY.json",
              "docs/CURRENT_STATE.md",
              "docs/APEX_MASTER_CONTEXT.md",
              "docs/APEX_OPERATING_MANUAL.md",
              "docs/KNOWN_ISSUES.md",
              "docs/SESSION_LOG.md",
              "docs/CHATGPT_USAGE.md",
              "docs/CHATGPT_APEX_QUERY_POLICY.md",
              "docs/APEX_ROADMAP.md",
              "docs/APEX_DECISIONS.md",
              "docs/APEX_CHANGELOG.md",
              "docs/APEX_V2_DAILY_OPERATIONS.md",
              "docs/APEX_V2_SAFE_EXTENSIONS.md",
              "docs/APEX_V2_PROSPECTIVE_TOURNAMENT.md",
              "docs/operations/SHADOW_PROVIDER_RELIABILITY.md",
              "docs/operations/PARALLEL_DECISION_LAB.md",
          }
          retirements = {
              ".github/workflows/joint-path-promotion-audit.yml": "archive/workflows/joint-path-promotion-audit.yml",
              ".github/workflows/projection-shadow-audit.yml": "archive/workflows/projection-shadow-audit.yml",
              ".github/workflows/understat-player-production-ab.yml": "archive/workflows/understat-player-production-ab.yml",
          }
          archive_manifest = "archive/workflows/README.md"
          retirement_paths = set(retirements) | set(retirements.values()) | {archive_manifest}

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "origin/main...HEAD"],
                  text=True,
              ).splitlines()
          )

          touched_retirements = {
              source
              for source, target in retirements.items()
              if source in changed or target in changed
          }
          if touched_retirements:
              if touched_retirements != set(retirements):
                  raise SystemExit(
                      "legacy diagnostic retirement must be atomic across all three workflows"
                  )
              if archive_manifest not in changed:
                  raise SystemExit(
                      "legacy diagnostic retirement must update archive/workflows/README.md"
                  )
              for source, target in retirements.items():
                  if source not in changed or target not in changed:
                      raise SystemExit(f"incomplete retirement pair: {source} -> {target}")
                  if Path(source).exists():
                      raise SystemExit(f"retired workflow remains executable: {source}")
                  if not Path(target).is_file():
                      raise SystemExit(f"retired forensic source missing: {target}")
                  existed = subprocess.run(
                      ["git", "cat-file", "-e", f"origin/main:{target}"],
                      capture_output=True,
                      check=False,
                  )
                  if existed.returncode == 0:
                      raise SystemExit(
                          f"one-time retirement target already exists on main; archive is immutable: {target}"
                      )
                  base = subprocess.check_output(["git", "show", f"origin/main:{source}"])
                  current = Path(target).read_bytes()
                  if current != base:
                      raise SystemExit(
                          f"retired workflow was rewritten instead of moved byte-for-byte: {source} -> {target}"
                      )
          else:
              archive_changes = sorted(
                  path for path in changed if path.startswith("archive/workflows/")
              )
              if archive_changes:
                  raise SystemExit(
                      "forensic workflow archive is immutable after V2 authority cutover: "
                      + ", ".join(archive_changes)
                  )

          unexpected = sorted(
              path
              for path in changed
              if path not in allowed_exact
              and path not in retirement_paths
              and not path.startswith("ops_tests/")
          )
          if unexpected:
              raise SystemExit(f"ops/governance PR touched unexpected paths: {unexpected}")
          forbidden = sorted(
              path for path in changed if path.startswith(("src/", "config/"))
          )
          if forbidden:
              raise SystemExit(f"ops/governance PR touched frozen engine source/config: {forbidden}")
          test_changes = sorted(path for path in changed if path.startswith("tests/"))
          allowed_tests = {
              "tests/test_airsenal_source_absence_policy.py",
              "tests/test_airsenal_workflow_contract.py",
              "tests/test_core_candidate_publication.py",
              "tests/test_production_publication_contract.py",
              "tests/test_solver_parity_contract.py",
          }
          unexpected_tests = sorted(set(test_changes) - allowed_tests)
          if unexpected_tests:
              raise SystemExit(f"ops/governance PR touched unrelated engine tests: {unexpected_tests}")
          if not changed:
              raise SystemExit("ops/governance PR has no changes")
          PY

      - name: Materialize and install exact frozen evaluator source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FROZEN_APEX_SHA"
          rm -rf "$RUNNER_TEMP/frozen-apex"
          git worktree add --detach "$RUNNER_TEMP/frozen-apex" "$FROZEN_APEX_SHA"
          test "$(git -C "$RUNNER_TEMP/frozen-apex" rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          test -f "$RUNNER_TEMP/frozen-apex/config/apex_v2.yaml"
          test -f "$RUNNER_TEMP/frozen-apex/src/apex/decision/transfers.py"
          test -f "$RUNNER_TEMP/frozen-apex/src/apex/governance/evaluation.py"
          test -f "$RUNNER_TEMP/frozen-apex/src/apex/governance/tournament.py"
          test -f "$RUNNER_TEMP/frozen-apex/src/apex/runtime/evaluation_archive.py"
          python -m pip install -e "$RUNNER_TEMP/frozen-apex[dev]"

      - name: Run operations regressions against frozen evaluator
        env:
          PYTHONPATH: ${{ runner.temp }}/frozen-apex/src:${{ github.workspace }}/scripts
        run: python -m unittest discover -s ops_tests -p 'test_*.py' -v

      - name: Assert repository V2 governance is consistent
        run: python scripts/check_governance_consistency.py

      - name: Assert serving, operations and research boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          frozen = "99cc7b51b0cff45462b567084cb1844cfe0a456f"
          production = Path(".github/workflows/apex-v2-daily-production.yml").read_text(encoding="utf-8")
          for needle in (
              "production_core_sha",
              "frozen_engine_sha",
              'cron: "17 4 * * *"',
              "group: apex-v2-fpl-auth",
              "cancel-in-progress: false",
              "git merge-base --is-ancestor",
              "apex-v2 private-store-preflight",
              "apex-v2 official-hash",
              "FPL_TEAM_ID: \"1\"",
              "run_airsenal_worker.py",
              "--horizon 8",
              'APEX_ALLOW_NETWORK_DURING_SOLVE: "0"',
              "apex-v2 solve",
              "apex-v2 publish",
          ):
              if needle not in production:
                  raise SystemExit(f"daily production contract missing: {needle}")
          for forbidden in (
              "pull_request:",
              "\n  push:\n",
              "git push",
              "scripts/run_apex.py",
              "run_pinnacle.py",
          ):
              if forbidden in production:
                  raise SystemExit(f"daily production crossed authority boundary: {forbidden}")

          keepalive = Path(".github/workflows/apex-v2-auth-keepalive.yml").read_text(encoding="utf-8")
          for needle in (
              'cron: "22 */6 * * *"',
              "contents: read",
              "group: apex-v2-fpl-auth",
              "--mode keepalive",
          ):
              if needle not in keepalive:
                  raise SystemExit(f"auth keepalive contract missing: {needle}")
          for forbidden in (
              "apex-v2 acquire",
              "apex-v2 solve",
              "apex-v2 publish",
              "contents: write",
          ):
              if forbidden in keepalive:
                  raise SystemExit(f"auth keepalive crossed safety boundary: {forbidden}")

          deadline = Path(".github/workflows/apex-v2-deadline-watch.yml").read_text(encoding="utf-8")
          for needle in (
              'cron: "11,41 * * * *"',
              "actions: write",
              "--min-minutes 90",
              "--max-minutes 150",
          ):
              if needle not in deadline:
                  raise SystemExit(f"deadline watcher contract missing: {needle}")
          for forbidden in (
              "FPL_REFRESH_TOKEN",
              "FPL_SESSION_COOKIE",
              "apex-v2 solve",
              "apex-v2 publish",
              "contents: write",
          ):
              if forbidden in deadline:
                  raise SystemExit(f"deadline watcher crossed safety boundary: {forbidden}")

          evaluation = Path(".github/workflows/apex-v2-daily-evaluation.yml").read_text(encoding="utf-8")
          for needle in (
              frozen,
              'cron: "41 6 * * *"',
              "apex-v2 evaluate-completed",
              "apex-v2 tournament-standings",
          ):
              if needle not in evaluation:
                  raise SystemExit(f"daily evaluation contract missing: {needle}")

          decision = Path(".github/workflows/apex-v2-decision-quality.yml").read_text(encoding="utf-8")
          for needle in (
              "max-parallel: 8",
              "timeout-minutes: 50",
              "--mode prepare",
              "--mode solve-task",
              "--mode assemble",
              "--mode postoutcome",
          ):
              if needle not in decision:
                  raise SystemExit(f"decision-quality contract missing: {needle}")
          for forbidden in ("contents: write", "apex-v2 acquire", "apex-v2 publish"):
              if forbidden in decision:
                  raise SystemExit(f"decision-quality crossed serving boundary: {forbidden}")

          tournament_contract = Path("scripts/apex_v2_tournament_contract.py").read_text(encoding="utf-8")
          for needle in (
              "LAST_VALID_COMMON_PREDEADLINE_SEAL",
              '"production_influence": "NONE"',
              '"serve_authorized": False',
          ):
              if needle not in tournament_contract:
                  raise SystemExit(f"tournament governance invariant missing: {needle}")

          manifest = json.loads(Path("docs/APEX_V2_AUTHORITY.json").read_text(encoding="utf-8"))
          if manifest["frozen_engine_sha"] != frozen:
              raise SystemExit("immutable PR #90 base changed")
          production_core = manifest["production_core_sha"]
          if len(production_core) != 40:
              raise SystemExit("production core SHA is malformed")
          if manifest["serving_provider"] != "airsenal":
              raise SystemExit("AIrsenal is no longer sole declared serving provider")
          if manifest["research"]["production_influence"] != "NONE":
              raise SystemExit("research acquired production influence")
          if manifest["research"]["serving_authorized"] is not False:
              raise SystemExit("research acquired serving authority")
          if manifest["research"]["automatic_promotion"] is not False:
              raise SystemExit("automatic challenger promotion was enabled")
          PY

      - name: Assert retired legacy workflows are archived and inert
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          retired = (
              "pinnacle.yml",
              "airsenal.yml",
              "refresh-core-pin.yml",
              "gw1-final-2026.yml",
              "joint-path-promotion-audit.yml",
              "projection-shadow-audit.yml",
              "understat-player-production-ab.yml",
          )
          for name in retired:
              active = Path(".github/workflows") / name
              archived = Path("archive/workflows") / name
              if active.exists():
                  raise SystemExit(f"legacy workflow remains executable: {active}")
              if not archived.is_file() or archived.stat().st_size == 0:
                  raise SystemExit(f"legacy forensic source missing: {archived}")
          archive_readme = Path("archive/workflows/README.md").read_text(encoding="utf-8")
          if "intentionally inert" not in archive_readme or "APEX_V2_AUTHORITY.json" not in archive_readme:
              raise SystemExit("workflow archive does not declare the V2 inert boundary")
          PY

      - name: Prove frozen evaluator worktree stayed untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$RUNNER_TEMP/frozen-apex" rev-parse HEAD)" = "$FROZEN_APEX_SHA"
          test -z "$(git -C "$RUNNER_TEMP/frozen-apex" status --porcelain --untracked-files=no)"

  readiness:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install explicit governance checker dependency
        run: python -m pip install 'PyYAML==6.0.3'

      - name: Verify immutable base, production pointer and reconciled authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$FROZEN_APEX_SHA"
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- '--snapshot-output'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- 'APEX_ALLOW_NETWORK_DURING_SOLVE'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- 'apex-v2 publish'
          if git diff --name-only origin/main...HEAD -- src config | grep -q .; then
            echo "Operations/governance extension modified frozen-engine source/config paths." >&2
            git diff --name-only origin/main...HEAD -- src config >&2
            exit 1
          fi
          python scripts/check_governance_consistency.py
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("docs/APEX_V2_AUTHORITY.json").read_text(encoding="utf-8"))
          assert manifest["frozen_engine_sha"] == "99cc7b51b0cff45462b567084cb1844cfe0a456f"
          assert manifest["frozen_engine_pr"] == 90
          assert manifest["frozen_engine_pr_policy"] == "NEVER_MERGE_OR_ADVANCE"
          production = manifest["production_core_sha"]
          assert len(production) == 40 and all(c in "0123456789abcdef" for c in production)
          assert manifest["canonical_production_workflow"] == ".github/workflows/apex-v2-daily-production.yml"
          assert manifest["serving_provider"] == "airsenal"
          assert manifest["research"]["production_influence"] == "NONE"
          PY
