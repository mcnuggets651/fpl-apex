name: Apex V2 Ops Contract

on:
  pull_request:
    paths:
      - ".github/workflows/apex-v2-auth-keepalive.yml"
      - ".github/workflows/apex-v2-daily-production.yml"
      - ".github/workflows/apex-v2-daily-evaluation.yml"
      - ".github/workflows/apex-v2-direct-auth-diagnostic.yml"
      - ".github/workflows/apex-v2-deadline-watch.yml"
      - ".github/workflows/apex-v2-owner-brief.yml"
      - ".github/workflows/apex-v2-decision-quality.yml"
      - ".github/workflows/apex-v2-shadow-health.yml"
      - ".github/workflows/apex-v2-prospective-tournament.yml"
      - ".github/workflows/apex-v2-ops-contract.yml"
      - ".github/workflows/pinnacle.yml"
      - ".github/workflows/airsenal.yml"
      - ".github/workflows/refresh-core-pin.yml"
      - "scripts/apex_v2_auth_ops.py"
      - "scripts/apex_v2_attempt_audit_ops.py"
      - "scripts/apex_v2_deadline_ops.py"
      - "scripts/apex_v2_owner_brief_ops.py"
      - "scripts/apex_v2_decision_quality_ops.py"
      - "scripts/apex_v2_shadow_provider_ops.py"
      - "scripts/apex_v2_tournament_common.py"
      - "scripts/apex_v2_tournament_contract.py"
      - "scripts/apex_v2_tournament_ops.py"
      - "scripts/apex_v2_tournament_scoring.py"
      - "scripts/check_governance_consistency.py"
      - "ops_tests/**"
      - "docs/APEX_V2_DAILY_OPERATIONS.md"
      - "docs/APEX_V2_SAFE_EXTENSIONS.md"
      - "docs/APEX_V2_PROSPECTIVE_TOURNAMENT.md"
      - "docs/operations/SHADOW_PROVIDER_RELIABILITY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-v2-ops-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert operations-only change surface
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python - <<'PY'
          import subprocess

          allowed_exact = {
              ".github/workflows/apex-v2-auth-keepalive.yml",
              ".github/workflows/apex-v2-daily-production.yml",
              ".github/workflows/apex-v2-daily-evaluation.yml",
              ".github/workflows/apex-v2-direct-auth-diagnostic.yml",
              ".github/workflows/apex-v2-deadline-watch.yml",
              ".github/workflows/apex-v2-owner-brief.yml",
              ".github/workflows/apex-v2-decision-quality.yml",
              ".github/workflows/apex-v2-shadow-health.yml",
              ".github/workflows/apex-v2-prospective-tournament.yml",
              ".github/workflows/apex-v2-ops-contract.yml",
              ".github/workflows/pinnacle.yml",
              ".github/workflows/airsenal.yml",
              ".github/workflows/refresh-core-pin.yml",
              "scripts/apex_v2_auth_ops.py",
              "scripts/apex_v2_attempt_audit_ops.py",
              "scripts/apex_v2_deadline_ops.py",
              "scripts/apex_v2_owner_brief_ops.py",
              "scripts/apex_v2_decision_quality_ops.py",
              "scripts/apex_v2_shadow_provider_ops.py",
              "scripts/apex_v2_tournament_common.py",
              "scripts/apex_v2_tournament_contract.py",
              "scripts/apex_v2_tournament_ops.py",
              "scripts/apex_v2_tournament_scoring.py",
              "scripts/check_governance_consistency.py",
              "docs/APEX_V2_DAILY_OPERATIONS.md",
              "docs/APEX_V2_SAFE_EXTENSIONS.md",
              "docs/APEX_V2_PROSPECTIVE_TOURNAMENT.md",
              "docs/operations/SHADOW_PROVIDER_RELIABILITY.md",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(
              path
              for path in changed
              if path not in allowed_exact and not path.startswith("ops_tests/")
          )
          if unexpected:
              raise SystemExit(f"ops PR touched non-operational paths: {unexpected}")
          forbidden = sorted(
              path
              for path in changed
              if path.startswith(("src/", "config/", "tests/"))
          )
          if forbidden:
              raise SystemExit(f"ops PR touched frozen-engine paths: {forbidden}")
          if not changed:
              raise SystemExit("ops PR has no changes")
          PY

      - name: Run operations regression tests
        run: python -m unittest discover -s ops_tests -p 'test_*.py' -v

      - name: Assert repository workflow governance is consistent
        run: python scripts/check_governance_consistency.py

      - name: Assert frozen production and serving authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          frozen = "99cc7b51b0cff45462b567084cb1844cfe0a456f"
          production = Path(".github/workflows/apex-v2-daily-production.yml").read_text(encoding="utf-8")
          required = (
              frozen,
              'cron: "17 4 * * *"',
              "group: apex-v2-fpl-auth",
              "cancel-in-progress: false",
              "ref: $" + "{{ env.APEX_CODE_SHA }}",
              "CONTROL_PLANE_SHA: $" + "{{ github.sha }}",
              "apex_v2_auth_ops.py",
              "apex_v2_shadow_provider_ops.py",
              'git show "$FROZEN_APEX_SHA:upstreams.lock.json"',
              "apex-v2 private-store-preflight",
              "apex-v2 official-hash",
              "dastan-run",
              "--max-attempts 2",
              "--wall-clock-seconds 900",
              "--snapshot-output \"$SNAPSHOT_FILE\"",
              'APEX_ALLOW_NETWORK_DURING_SOLVE: "0"',
              "scripts/check_v2_architecture.py",
              "apex-v2 solve",
              "apex-v2 publish",
          )
          missing = [needle for needle in required if needle not in production]
          if missing:
              raise SystemExit(f"daily production contract missing: {missing}")
          for forbidden in ("pull_request:", "\n  push:\n", "cancel-in-progress: true"):
              if forbidden in production:
                  raise SystemExit(f"daily production contract drifted: {forbidden}")

          controller = Path("scripts/apex_v2_shadow_provider_ops.py").read_text(encoding="utf-8")
          for needle in (
              'PRODUCTION_INFLUENCE = "NONE"',
              'EXTERNAL_DIAGNOSTIC_IDS = ("pitchside", "openfpl")',
              'OPENFPL_MIN_GAMEWEEKS = 10',
              '"serve_authorized": False',
              '"auto_promotion": False',
              '"decision_universe_rule": "Official status != \'u\'"',
              '"excluded_unavailable_classification": "NO_FORECAST_EXPECTED"',
              '"TRAINING_NOT_READY"',
              '"READY_FOR_SHADOW_BUILD"',
              '"PROVIDER_LOGIC_OR_INVARIANT_FAILURE"',
          ):
              if needle not in controller:
                  raise SystemExit(f"shadow-provider safety invariant missing: {needle}")
          PY

      - name: Assert shadow-health monitor is read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/apex-v2-shadow-health.yml").read_text(encoding="utf-8")
          for needle in (
              "permissions:\n  contents: read",
              "99cc7b51b0cff45462b567084cb1844cfe0a456f",
              'git show "$FROZEN_APEX_SHA:upstreams.lock.json"',
              "dastan-pin-health",
              "pitchside-health",
              "openfpl-readiness",
          ):
              if needle not in text:
                  raise SystemExit(f"shadow-health contract missing: {needle}")
          for forbidden in (
              "FPL_SESSION_COOKIE",
              "FPL_X_API_AUTHORIZATION",
              "FPL_REFRESH_TOKEN",
              "APEX_PRIVATE_GITHUB_TOKEN",
              "contents: write",
              "apex-v2 solve",
              "apex-v2 publish",
          ):
              if forbidden in text:
                  raise SystemExit(f"shadow-health crossed safety boundary: {forbidden}")
          PY

      - name: Assert prospective tournament is sealed, non-serving and no-hindsight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apex-v2-prospective-tournament.yml").read_text(encoding="utf-8")
          required = (
              'workflows: ["Apex V2 Daily Production"]',
              'cron: "23 * * * *"',
              'FROZEN_APEX_SHA: "99cc7b51b0cff45462b567084cb1844cfe0a456f"',
              "ref: $" + "{{ env.FROZEN_APEX_SHA }}",
              "apex_v2_tournament_common.py",
              "apex_v2_tournament_contract.py",
              "apex_v2_tournament_ops.py",
              "apex_v2_tournament_scoring.py",
              "openfpl-readiness",
              "seal-run",
              "retain-gw2",
              "canonicalize",
              "evaluate",
              "status",
              "APEX_V2_PRIVATE_REPO_TOKEN",
          )
          missing = [needle for needle in required if needle not in workflow]
          if missing:
              raise SystemExit(f"prospective tournament contract missing: {missing}")
          for forbidden in (
              "FPL_SESSION_COOKIE",
              "FPL_X_API_AUTHORIZATION",
              "FPL_REFRESH_TOKEN",
              "apex-v2 intent",
              "apex-v2 official-hash",
              "apex-v2 acquire",
              "apex-v2 solve",
              "apex-v2 publish",
              "scripts/acquire_dastan_shadow.py",
              "run_airsenal_worker.py",
          ):
              if forbidden in workflow:
                  raise SystemExit(f"prospective tournament crossed serving boundary: {forbidden}")

          contract = Path("scripts/apex_v2_tournament_contract.py").read_text(encoding="utf-8")
          for needle in (
              "DIAGNOSTIC_REHEARSAL_NON_CANONICAL",
              "PROSPECTIVE_READY_CANDIDATE",
              "CANONICAL_PROSPECTIVE_OBSERVATION",
              "TRAINING_READY_NO_MODEL",
              "LAST_VALID_COMMON_PREDEADLINE_SEAL",
              '"production_influence": "NONE"',
              '"serving_authorized": False',
          ):
              if needle not in contract:
                  raise SystemExit(f"tournament governance invariant missing: {needle}")

          scoring = Path("scripts/apex_v2_tournament_scoring.py").read_text(encoding="utf-8")
          for needle in (
              "score_predictions",
              "NOT_SCOREABLE",
              "minutes_mae",
              "appearance_probability_brier",
          ):
              if needle not in scoring:
                  raise SystemExit(f"tournament scoring invariant missing: {needle}")
          PY

      - name: Assert auth, deadline, owner and decision diagnostics remain bounded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          keepalive = Path(".github/workflows/apex-v2-auth-keepalive.yml").read_text(encoding="utf-8")
          for needle in ('cron: "22 */6 * * *"', "contents: read", "group: apex-v2-fpl-auth", "--mode keepalive"):
              if needle not in keepalive:
                  raise SystemExit(f"auth keepalive contract missing: {needle}")
          for forbidden in ("apex-v2 acquire", "apex-v2 solve", "apex-v2 publish", "contents: write"):
              if forbidden in keepalive:
                  raise SystemExit(f"auth keepalive crossed safety boundary: {forbidden}")

          deadline = Path(".github/workflows/apex-v2-deadline-watch.yml").read_text(encoding="utf-8")
          for needle in ('cron: "11,41 * * * *"', "actions: write", "--min-minutes 90", "--max-minutes 150"):
              if needle not in deadline:
                  raise SystemExit(f"deadline watcher contract missing: {needle}")
          for forbidden in ("FPL_REFRESH_TOKEN", "FPL_SESSION_COOKIE", "apex-v2 solve", "apex-v2 publish", "contents: write"):
              if forbidden in deadline:
                  raise SystemExit(f"deadline watcher crossed safety boundary: {forbidden}")

          for workflow_name, script in (
              (".github/workflows/apex-v2-owner-brief.yml", "apex_v2_owner_brief_ops.py"),
              (".github/workflows/apex-v2-decision-quality.yml", "apex_v2_decision_quality_ops.py"),
          ):
              text = Path(workflow_name).read_text(encoding="utf-8")
              if "contents: read" not in text or script not in text:
                  raise SystemExit(f"read-only diagnostic contract missing: {workflow_name}")
              for forbidden in ("contents: write", "apex-v2 acquire", "apex-v2 solve", "apex-v2 publish"):
                  if forbidden in text:
                      raise SystemExit(f"diagnostic crossed serving boundary: {workflow_name}: {forbidden}")
          PY

      - name: Assert evaluation and historical orphan policy remain frozen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          evaluation = Path(".github/workflows/apex-v2-daily-evaluation.yml").read_text(encoding="utf-8")
          for needle in (
              "99cc7b51b0cff45462b567084cb1844cfe0a456f",
              'cron: "41 6 * * *"',
              "apex-v2 evaluate-completed",
              "apex-v2 tournament-standings",
          ):
              if needle not in evaluation:
                  raise SystemExit(f"daily evaluation contract missing: {needle}")
          audit = Path("scripts/apex_v2_attempt_audit_ops.py").read_text(encoding="utf-8")
          for run in (
              "33242604422-1",
              "33257608630-1",
              "33260512411-1",
              "33265747805-1",
              "33272866621-1",
              "33312221205-1",
          ):
              if run not in audit:
                  raise SystemExit(f"historical orphan acknowledgement missing: {run}")
          if "unacknowledged_missing_finals" not in audit or "operationally_clear" not in audit:
              raise SystemExit("orphan audit no longer fails closed")
          PY

      - name: Assert legacy compatibility workflows remain manual-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for path in (
              Path(".github/workflows/pinnacle.yml"),
              Path(".github/workflows/airsenal.yml"),
              Path(".github/workflows/refresh-core-pin.yml"),
          ):
              body = path.read_text(encoding="utf-8")
              if "workflow_dispatch:" not in body or "schedule:" in body or "cron:" in body:
                  raise SystemExit(f"legacy workflow is not manual-only: {path}")
              if "RETIRED: manual-only legacy workflow" not in (body.splitlines() or [""])[0]:
                  raise SystemExit(f"legacy retirement marker missing: {path}")
          PY

  readiness:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen pin and untouched engine
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FROZEN_APEX_SHA" main
          test "$(git rev-parse FETCH_HEAD)" = "$FROZEN_APEX_SHA" || true
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- '--snapshot-output'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- 'APEX_ALLOW_NETWORK_DURING_SOLVE'
          git show "$FROZEN_APEX_SHA:.github/workflows/apex-v2-production.yml" | grep -F -- 'apex-v2 publish'
          if git diff --name-only origin/main...HEAD -- src config tests | grep -q .; then
            echo "Operations extension modified frozen-engine source/config/test paths." >&2
            git diff --name-only origin/main...HEAD -- src config tests >&2
            exit 1
          fi
          python - <<'PY'
          import subprocess

          allowed_scripts = {
              "scripts/apex_v2_auth_ops.py",
              "scripts/apex_v2_attempt_audit_ops.py",
              "scripts/apex_v2_deadline_ops.py",
              "scripts/apex_v2_owner_brief_ops.py",
              "scripts/apex_v2_decision_quality_ops.py",
              "scripts/apex_v2_shadow_provider_ops.py",
              "scripts/apex_v2_tournament_common.py",
              "scripts/apex_v2_tournament_contract.py",
              "scripts/apex_v2_tournament_ops.py",
              "scripts/apex_v2_tournament_scoring.py",
              "scripts/check_governance_consistency.py",
          }
          scripts = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD", "--", "scripts"],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(scripts - allowed_scripts)
          if unexpected:
              raise SystemExit(f"Operations extension modified unexpected scripts: {unexpected}")
          PY
