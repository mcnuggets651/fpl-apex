name: FPL Draft Score Final

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  score:
    if: >-
      github.event.pull_request.number == 90 &&
      github.event.label.name == 'draft-score-final' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read corrected Draft live score privately
        shell: bash
        env:
          FPL_X_API_AUTHORIZATION: ${{ secrets.FPL_X_API_AUTHORIZATION }}
          PROOF_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAhHJV7CIwjZ318GzOX4PL
            +yE07h8nR9H3vpYZaLZWNqmD8wIJSUwOB7qF8GgVIAGJ7djwxvfzLsUkzDwjBprf
            BNb0scRyUxJ56UdaJO1mT0M3PqsvQ9moi6kl+80/5WDQfH85Fu4Rkl8A5vB+fuXZ
            YU7dudgqGdyh4nqdp2YMd1J1qZD8y5rTLPJzBzdRF6gY/ukuJqnNUmwrMdyhemoW
            xa2fqlD/L/aCRsOQTD4RppiSXLeDBE0g7bCvgHTM9wyc70TJrh7kuQCdM6Sjn4I6
            TsTV/FlMteARb7sNGpPJh3v0YQLRheC19zI6raGE0P1D0sZJ1Tl5QWU2lcYSF6ef
            2lSdLmXvvL1SeyI/csnem3y0MA7SU+BRW/+/B3z7razV7NqQU841Lv0jseQoOaVr
            vbcq4O1GuX7F+dp62cZygdM3+LINwx2upvgI6BpvceZr6jgfko9QyBf/RldYQ6ef
            0PY8CtyQyEBOEULq/1F8AiqWCKN4RVIPL82rZAUMUB1FJ1iXujJZtsAcBD8zwCjX
            cPl/7xwJpqzfbzs0l+9d/nllCwk+MJFUzoH1D3/Z8oE5UtCwKFp0KgMXmHzT3m9Y
            RTdQ5F0bde7MXkyBoTr6TMzZKPNjyhxHXdmVF3Rz8obI4kNR4JDXhBhMhNd3QJo/
            sA1MRozK3ARGWV++Z9DHmN0CAwEAAQ==
            -----END PUBLIC KEY-----
        run: |
          set +x
          python - <<'PY'
          import json,os,zlib
          from urllib.request import Request,urlopen
          D='https://draft.premierleague.com/api'; t=os.getenv('FPL_X_API_AUTHORIZATION','').strip()
          h={'Accept':'application/json','User-Agent':'fpl-apex-proof/4','Referer':'https://draft.premierleague.com/'}
          if t:h['X-API-Authorization']=t if t.lower().startswith('bearer ') else 'Bearer '+t
          def get(u):
              with urlopen(Request(u,headers=h),timeout=25) as r:return json.loads(r.read().decode())
          boot=get(D+'/bootstrap-static'); nm={int(x['id']):str(x.get('web_name') or x.get('second_name') or x['id']) for x in boot.get('elements',[])}
          ev=get(D+'/entry/172178/event/2'); live=get(D+'/event/2/live'); ps=ev.get('picks') or []
          elems=live.get('elements') or {}; pts={}
          if isinstance(elems,dict):
              for k,v in elems.items():
                  if not isinstance(v,dict):continue
                  st=v.get('stats') if isinstance(v.get('stats'),dict) else v
                  p=st.get('total_points',st.get('points'))
                  if p is not None:pts[int(k)]=int(p)
          elif isinstance(elems,list):
              for v in elems:
                  if not isinstance(v,dict):continue
                  pid=v.get('id',v.get('element')); st=v.get('stats') if isinstance(v.get('stats'),dict) else v; p=st.get('total_points',st.get('points'))
                  if pid is not None and p is not None:pts[int(pid)]=int(p)
          rows=[]; starter_total=0
          for x in sorted(ps,key=lambda r:int(r.get('position',99))):
              pid=int(x['element']); mult=int(x.get('multiplier',0) or 0); p=pts.get(pid)
              if mult>0 and p is not None:starter_total+=p*mult
              rows.append([nm.get(pid,str(pid)),p,mult,int(x.get('position',0) or 0)])
          hist=ev.get('entry_history') if isinstance(ev.get('entry_history'),dict) else {}
          out={'ok':1,'team':'mcnuggets','eid':172178,'gw':2,'rows':rows,'live_sum':starter_total,'history':{k:v for k,v in hist.items() if isinstance(v,(str,int,float,bool)) or v is None},'subs':ev.get('subs')}
          comp=zlib.compress(json.dumps(out,ensure_ascii=False,separators=(',',':')).encode(),9)
          if len(comp)>400:
              out.pop('subs',None); out['history']={k:v for k,v in out['history'].items() if 'point' in k.lower() or 'score' in k.lower() or k in ('event','rank')}; comp=zlib.compress(json.dumps(out,ensure_ascii=False,separators=(',',':')).encode(),9)
          if len(comp)>400:raise RuntimeError(f'packet too large {len(comp)}')
          open('/tmp/out.z','wb').write(comp)
          PY
          printf '%s\n' "$PROOF_PUBLIC_KEY" >/tmp/pub.pem
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/out.z -out /tmp/out.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          echo "APEX_DRAFT_SCORE=$(base64 -w0 /tmp/out.enc)"
          rm -f /tmp/out.z /tmp/out.enc /tmp/pub.pem
