name: Audit FPL Core data pin candidate

on:
  workflow_dispatch:
  schedule:
    # Audit the moving upstream shortly before production. A validated candidate
    # becomes a proposed source change, never an unreviewed direct push to main.
    - cron: "3 */6 * * *"

permissions:
  contents: read

concurrency:
  group: apex-core-pin-audit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install upstream verification dependencies
        run: python -m pip install pandas requests

      - name: Resolve current FPL Core candidate
        id: core
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          import urllib.request

          url = "https://api.github.com/repos/olbauday/FPL-Core-Insights/commits/main"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "apex-fpl-core-pin/2.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          sha = str(payload.get("sha") or "").strip()
          stamp = str(
              payload.get("commit", {}).get("committer", {}).get("date")
              or payload.get("commit", {}).get("author", {}).get("date")
              or ""
          ).strip()
          if not sha or not stamp:
              raise SystemExit("GitHub did not return a usable FPL Core commit")

          committed = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
          age_hours = (datetime.now(timezone.utc) - committed).total_seconds() / 3600
          if age_hours < -0.5:
              raise SystemExit(f"FPL Core commit timestamp is {abs(age_hours):.1f}h in the future")
          if age_hours > 30:
              raise SystemExit(
                  f"FPL Core main is stale ({age_hours:.1f}h old); refusing to propose it"
              )

          print(f"sha={sha}")
          print(f"committed_at={committed.isoformat()}")
          print(f"resolved_at={datetime.now(timezone.utc).isoformat()}")
          print(f"age_hours={max(age_hours, 0):.2f}")
          PY

      - name: Validate candidate FPL Core semantics
        shell: bash
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
          APEX_SEASON: "2026-2027"
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/validate_core_candidate.py \
            --ref "$CORE_SHA" \
            --season "$APEX_SEASON" \
            --cache-dir data/cache/core-candidate

      - name: Materialize proposed immutable data pin
        shell: bash
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
          CORE_COMMITTED_AT: ${{ steps.core.outputs.committed_at }}
          CORE_RESOLVED_AT: ${{ steps.core.outputs.resolved_at }}
          CORE_AGE_HOURS: ${{ steps.core.outputs.age_hours }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("upstreams.lock.json")
          lock = json.loads(path.read_text(encoding="utf-8"))
          source = lock["sources"]["fpl_core_insights"]
          old = source.get("commit", "")
          source["commit"] = os.environ["CORE_SHA"]
          source["committed_at"] = os.environ["CORE_COMMITTED_AT"]
          source["resolved_at"] = os.environ["CORE_RESOLVED_AT"]
          source["resolved_age_hours"] = float(os.environ["CORE_AGE_HOURS"])
          source["newer_revision_available"] = False
          source["resolution_policy"] = (
              "moving main candidate validated semantically before reviewed source promotion"
          )
          path.write_text(json.dumps(lock, indent=2) + "\n", encoding="utf-8")
          print(f"Proposed validated FPL Core pin: {old} -> {source['commit']}")
          PY

      - name: Verify proposed pinned source contract
        run: python scripts/check_upstreams.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Write candidate audit manifest
        shell: bash
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
          CORE_COMMITTED_AT: ${{ steps.core.outputs.committed_at }}
          CORE_RESOLVED_AT: ${{ steps.core.outputs.resolved_at }}
        run: |
          mkdir -p reports/core-pin-candidate
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_name": "apex-core-pin-candidate",
              "schema_version": "1",
              "candidate_sha": os.environ["CORE_SHA"],
              "committed_at": os.environ["CORE_COMMITTED_AT"],
              "resolved_at": os.environ["CORE_RESOLVED_AT"],
              "validated": True,
              "source_control_updated": False,
              "promotion_policy": "reviewed dependency source change required",
          }
          Path("reports/core-pin-candidate/manifest.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Assert audit did not publish source state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "Candidate validated; source pin remains a reviewed repository change."

      - name: Upload proposed pin evidence
        uses: actions/upload-artifact@v4
        with:
          name: fpl-core-pin-candidate-${{ github.run_id }}
          path: |
            upstreams.lock.json
            reports/core-pin-candidate/
          retention-days: 30
