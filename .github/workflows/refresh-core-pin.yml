name: Refresh FPL Core data pin

on:
  workflow_dispatch:
  schedule:
    - cron: "3 */6 * * *"

permissions:
  contents: write

concurrency:
  group: apex-production-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install upstream verification dependencies
        run: python -m pip install pandas requests pyyaml

      - name: Resolve current FPL Core candidate
        id: core
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import urllib.request
          import yaml

          config = yaml.safe_load(Path("config/apex.yaml").read_text(encoding="utf-8")) or {}
          # This is deliberately the same production freshness policy consumed by
          # Apex. The resolver may never promote a source that the very next
          # production run is guaranteed to reject as stale.
          max_age_hours = float(config.get("max_core_age_hours", 18.0))
          if max_age_hours <= 0:
              raise SystemExit("max_core_age_hours must be positive")

          url = "https://api.github.com/repos/olbauday/FPL-Core-Insights/commits/main"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "apex-fpl-core-pin/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          sha = str(payload.get("sha") or "").strip()
          stamp = str(
              payload.get("commit", {}).get("committer", {}).get("date")
              or payload.get("commit", {}).get("author", {}).get("date")
              or ""
          ).strip()
          if not sha or not stamp:
              raise SystemExit("GitHub did not return a usable FPL Core commit")

          committed = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
          age_hours = (datetime.now(timezone.utc) - committed).total_seconds() / 3600
          if age_hours < -0.5:
              raise SystemExit(f"FPL Core commit timestamp is {abs(age_hours):.1f}h in the future")
          if age_hours > max_age_hours:
              raise SystemExit(
                  f"FPL Core main is stale ({age_hours:.1f}h old; production max "
                  f"{max_age_hours:.1f}h); refusing to promote it"
              )

          print(f"sha={sha}")
          print(f"committed_at={committed.isoformat()}")
          print(f"resolved_at={datetime.now(timezone.utc).isoformat()}")
          print(f"age_hours={max(age_hours, 0):.2f}")
          print(f"max_age_hours={max_age_hours:.2f}")
          PY

      - name: Validate candidate FPL Core semantics before publication
        shell: bash
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
          APEX_SEASON: "2026-2027"
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/validate_core_candidate.py \
            --ref "$CORE_SHA" \
            --season "$APEX_SEASON" \
            --cache-dir data/cache/core-candidate

      - name: Update immutable data pin after validation
        shell: bash
        env:
          CORE_SHA: ${{ steps.core.outputs.sha }}
          CORE_COMMITTED_AT: ${{ steps.core.outputs.committed_at }}
          CORE_RESOLVED_AT: ${{ steps.core.outputs.resolved_at }}
          CORE_AGE_HOURS: ${{ steps.core.outputs.age_hours }}
          CORE_MAX_AGE_HOURS: ${{ steps.core.outputs.max_age_hours }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("upstreams.lock.json")
          lock = json.loads(path.read_text(encoding="utf-8"))
          source = lock["sources"]["fpl_core_insights"]
          old = source.get("commit", "")
          source["commit"] = os.environ["CORE_SHA"]
          source["committed_at"] = os.environ["CORE_COMMITTED_AT"]
          source["resolved_at"] = os.environ["CORE_RESOLVED_AT"]
          source["resolved_age_hours"] = float(os.environ["CORE_AGE_HOURS"])
          source["resolver_max_age_hours"] = float(os.environ["CORE_MAX_AGE_HOURS"])
          source["newer_revision_available"] = False
          source["resolution_policy"] = (
              "moving main candidate validated semantically and against production freshness before immutable publication"
          )
          path.write_text(json.dumps(lock, indent=2) + "\n", encoding="utf-8")
          print(f"Validated FPL Core pin: {old} -> {source['commit']}")
          PY

      - name: Verify pinned source contract
        run: python scripts/check_upstreams.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit validated FPL Core revision and invalidate older decision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstreams.lock.json
          if git diff --cached --quiet; then
            echo "FPL Core pin is already current"
            exit 0
          fi
          PYTHONPATH=src python scripts/invalidate_published_decision.py \
            --source fpl_core_insights \
            --reason "validated pinned FPL Core snapshot changed"
          git add \
            data/generated/apex_recommendation_latest.json \
            data/generated/apex_recommendation_latest.md \
            data/generated/apex_answer_context.json
          git commit -m "data: refresh validated pinned FPL Core snapshot"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo "Main changed during candidate validation; refusing a stale-writer publication."
            exit 1
          fi
          git push origin HEAD:main
