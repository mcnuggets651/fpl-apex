name: One-shot preseason evidence patch

on:
  push:
    branches:
      - agent/projection-contract-corrections
    paths:
      - scripts/_one_shot_preseason_evidence_patch.py
      - .github/workflows/one-shot-preseason-evidence-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/projection-contract-corrections
          fetch-depth: 0
      - name: Apply asserted source patch
        run: python scripts/_one_shot_preseason_evidence_patch.py
      - name: Remove one-shot machinery
        run: |
          rm scripts/_one_shot_preseason_evidence_patch.py
          rm .github/workflows/one-shot-preseason-evidence-patch.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: preserve preseason attacking return evidence"
          git push origin HEAD:agent/projection-contract-corrections
