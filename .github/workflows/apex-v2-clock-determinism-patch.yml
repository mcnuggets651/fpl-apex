name: Apex V2 clock determinism patch

on:
  push:
    branches: [agent/apex-v2-cleanroom]
    paths: [.github/workflows/apex-v2-clock-determinism-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'mcnuggets651/fpl-apex' && github.ref_name == 'agent/apex-v2-cleanroom'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apex-v2-cleanroom
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make certification tests clock-deterministic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cert = Path('src/apex/governance/certification.py')
          text = cert.read_text(encoding='utf-8')
          old = 'valid_until: str | None=None) -> CertificationResult:'
          new = 'valid_until: str | None=None, now: datetime | None=None) -> CertificationResult:'
          if old not in text:
              raise SystemExit('certify signature anchor missing')
          text = text.replace(old, new, 1)
          old = '    if valid_until:\n        expiry = datetime.fromisoformat(valid_until.replace(\'Z\', \'+00:00\'))'
          new = '    now = (now or datetime.now(timezone.utc)).astimezone(timezone.utc)\n    if valid_until:\n        expiry = datetime.fromisoformat(valid_until.replace(\'Z\', \'+00:00\'))'
          if old not in text:
              raise SystemExit('certify expiry anchor missing')
          text = text.replace(old, new, 1)
          old = '        if datetime.now(timezone.utc) >= expiry.astimezone(timezone.utc):'
          new = '        if now >= expiry.astimezone(timezone.utc):'
          if old not in text:
              raise SystemExit('certify now comparison anchor missing')
          cert.write_text(text.replace(old, new, 1), encoding='utf-8')

          solve = Path('src/apex/runtime/solve.py')
          text = solve.read_text(encoding='utf-8')
          old = 'import json\nimport os\nfrom pathlib import Path\n'
          new = 'import json\nimport os\nfrom datetime import datetime\nfrom pathlib import Path\n'
          if old not in text:
              raise SystemExit('solve import anchor missing')
          text = text.replace(old, new, 1)
          old = 'def solve_snapshot(snapshot_path: Path, output: Path) -> DecisionBundle:'
          new = 'def solve_snapshot(\n    snapshot_path: Path,\n    output: Path,\n    *,\n    now: datetime | None = None,\n) -> DecisionBundle:'
          if old not in text:
              raise SystemExit('solve signature anchor missing')
          text = text.replace(old, new, 1)
          old = '        degraded_warnings=tuple(warnings),\n        valid_until=run["deadline"],\n    )'
          new = '        degraded_warnings=tuple(warnings),\n        valid_until=run["deadline"],\n        now=now,\n    )'
          if old not in text:
              raise SystemExit('solve certify call anchor missing')
          solve.write_text(text.replace(old, new, 1), encoding='utf-8')

          adapters = Path('tests/test_apex_v2_adapters.py')
          text = adapters.read_text(encoding='utf-8')
          old = 'from pathlib import Path\n'
          new = 'from datetime import datetime, timezone\nfrom pathlib import Path\n'
          if old not in text:
              raise SystemExit('adapter import anchor missing')
          text = text.replace(old, new, 1)
          old = '        requested_horizons=(1,),\n        max_age_hours=24,\n    )'
          new = '        requested_horizons=(1,),\n        max_age_hours=24,\n        now=datetime(2026, 8, 28, 11, 0, tzinfo=timezone.utc),\n    )'
          if old not in text:
              raise SystemExit('adapter qualification anchor missing')
          adapters.write_text(text.replace(old, new, 1), encoding='utf-8')

          scoring = Path('tests/test_v2_scoring_compatibility.py')
          text = scoring.read_text(encoding='utf-8')
          old = 'from pathlib import Path\n'
          new = 'from datetime import datetime, timezone\nfrom pathlib import Path\n'
          if old not in text:
              raise SystemExit('scoring import anchor missing')
          text = text.replace(old, new, 1)
          old = 'CURRENT_RULES = "fpl-2026-27-v1"\n'
          new = 'CURRENT_RULES = "fpl-2026-27-v1"\nTEST_NOW = datetime(2026, 8, 28, 11, 0, tzinfo=timezone.utc)\n'
          if old not in text:
              raise SystemExit('scoring clock anchor missing')
          text = text.replace(old, new, 1)
          old = '        required_scoring_rules_version=CURRENT_RULES,\n    )'
          new = '        required_scoring_rules_version=CURRENT_RULES,\n        now=TEST_NOW,\n    )'
          if text.count(old) != 2:
              raise SystemExit(f'expected two scoring qualification anchors, got {text.count(old)}')
          scoring.write_text(text.replace(old, new), encoding='utf-8')

          e2e = Path('tests/test_v2_end_to_end.py')
          text = e2e.read_text(encoding='utf-8')
          old = 'from pathlib import Path\nimport json\n'
          new = 'from datetime import datetime, timezone\nfrom pathlib import Path\nimport json\n'
          if old not in text:
              raise SystemExit('e2e import anchor missing')
          text = text.replace(old, new, 1)
          marker = 'from apex.runtime.solve import solve_snapshot\n'
          addition = 'from apex.runtime.solve import solve_snapshot\n\nTEST_NOW = datetime(2026, 8, 28, 12, 0, tzinfo=timezone.utc)\n'
          if marker not in text:
              raise SystemExit('e2e test clock marker missing')
          text = text.replace(marker, addition, 1)
          old = 'bundle = solve_snapshot(snapshot.root, output)'
          new = 'bundle = solve_snapshot(snapshot.root, output, now=TEST_NOW)'
          if text.count(old) != 2:
              raise SystemExit(f'expected two solve calls, got {text.count(old)}')
          e2e.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/apex-v2-clock-determinism-patch.yml
      - name: Validate focused and full V2 contracts
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]'
          pytest -q tests/test_apex_v2_adapters.py tests/test_v2_end_to_end.py tests/test_v2_scoring_compatibility.py
          pytest -q tests/test_apex_v2_core.py tests/test_apex_v2_adapters.py tests/test_v2_*.py
          python scripts/check_v2_architecture.py
          ruff check src/apex/governance/certification.py src/apex/runtime/solve.py tests/test_apex_v2_adapters.py tests/test_v2_end_to_end.py tests/test_v2_scoring_compatibility.py
      - name: Commit permanent clock fix and self-delete bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/apex/governance/certification.py src/apex/runtime/solve.py tests/test_apex_v2_adapters.py tests/test_v2_end_to_end.py tests/test_v2_scoring_compatibility.py .github/workflows/apex-v2-clock-determinism-patch.yml
          git commit -m 'Make V2 certification clock deterministic in tests'
          git push origin HEAD:agent/apex-v2-cleanroom
