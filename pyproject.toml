[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-fpl"
version = "0.1.0"
description = "Data-driven FPL intelligence and optimisation engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "requests>=2.32,<3",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scipy>=1.11,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]
airsenal = ["airsenal @ git+https://github.com/alan-turing-institute/AIrsenal.git@8c7e18eba1488dd5a7d4bdb00d4da0a75e895717"]

[project.scripts]
apex-fpl = "apex_fpl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI semantics stable across Ruff releases. Broader style modernisation is
# useful as a separate migration, but must not appear silently in a release gate.
select = ["E4", "E7", "E9", "F"]
