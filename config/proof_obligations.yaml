schema_version: 1
proof_obligations:
  - proof_id: PO-RUNTIME-IDENTITY-001
    claim: The executing Apex runtime is exactly identified by immutable provenance.
    proof_class: PROVENANCE_ASSERTION
    scope: release
    required_evidence: [BuildManifest, source_sha, dependency_lock_digest, runtime_digest]
    required_tests: [test_build_manifest_identity_is_content_bound]
    failure_consequence: Block release; runtime origin is not provable.
    release_policy: REQUIRED
    owner: control.provenance

  - proof_id: PO-ARTIFACT-INTEGRITY-001
    claim: Every decision-critical durable artifact matches its declared content identity.
    proof_class: DATA_INTEGRITY_ASSERTION
    scope: release
    required_evidence: [ArtifactManifest, sha256_verification]
    required_tests: [test_artifact_store_is_content_addressed_immutable_and_verified]
    failure_consequence: Block release and quarantine corrupt artifacts.
    release_policy: REQUIRED
    owner: control.artifact_store

  - proof_id: PO-RELEASE-CAS-001
    claim: A stale concurrent writer cannot replace the current certified release.
    proof_class: ALGORITHMIC_CERTIFICATE
    scope: season-entry-gameweek
    required_evidence: [ReleaseRegistry_current_pointer, CAS_result]
    required_tests: [test_release_registry_rejects_stale_writer]
    failure_consequence: Block publication because current-release identity is unsafe.
    release_policy: REQUIRED
    owner: control.release_registry

  - proof_id: PO-GLOBAL-WORLD-SEAL-001
    claim: Every GlobalWorld is derived from retained immutable raw captures and can be replayed without network access.
    proof_class: DATA_INTEGRITY_ASSERTION
    scope: global_world
    required_evidence: [RawCapture_manifest, raw_sha256, GlobalWorldId, sealed_world_manifest]
    required_tests: [test_same_source_bytes_produce_same_world_across_different_acquisition_runs, test_replay_requires_no_transport_and_sealed_transport_rejects_network, test_corrupted_raw_capture_is_detected_during_replay]
    failure_consequence: Block V2 world use; acquisition lineage or world seal is not provable.
    release_policy: REQUIRED
    owner: acquisition.sealed_world

  - proof_id: PO-OFFICIAL-PLAYER-IDENTITY-001
    claim: Decision-critical player evidence attaches only through an exact current Official FPL integer ID or an explicitly reviewed cross-season PersonId link; names never establish identity.
    proof_class: DATA_INTEGRITY_ASSERTION
    scope: global_world
    required_evidence: [OfficialFPL_player_registry, IdentityResolution, reviewed_PersonLink]
    required_tests: [test_current_official_integer_id_is_exact_identity, test_name_alone_never_resolves_decision_critical_identity, test_conflicting_identity_witness_is_ambiguous_and_blocks, test_official_registry_rejects_non_integer_and_duplicate_ids]
    failure_consequence: Block the affected evidence and any decision that requires it; never guess identity from a name.
    release_policy: REQUIRED
    owner: core.identity

  - proof_id: PO-RULESET-PROVENANCE-001
    claim: The active season RuleSet is deterministic, versioned, complete for its declared capabilities and every rule cites reviewed Official Premier League evidence.
    proof_class: PROVENANCE_ASSERTION
    scope: ruleset
    required_evidence: [RuleSet, RuleSetId, OfficialRuleSource]
    required_tests: [test_ruleset_is_versioned_official_and_provenance_complete, test_ruleset_semantic_identity_changes_when_rule_changes, test_ruleset_semantic_values_reject_uncontrolled_floats]
    failure_consequence: Block use of the RuleSet and therefore block any action whose legality depends on it.
    release_policy: REQUIRED
    owner: control.ruleset_registry

  - proof_id: PO-MANAGER-PUBLIC-SEAL-001
    claim: Manager-specific Official FPL summary, history, transfer and picks bytes are retained under immutable content identity and replayed without network or clock access before manager-state reconstruction.
    proof_class: DATA_INTEGRITY_ASSERTION
    scope: manager_public_snapshot
    required_evidence: [ManagerPublicSnapshotId, manager_raw_capture_manifests, sealed_manager_public_manifest, raw_sha256]
    required_tests: [test_same_manager_source_bytes_have_same_semantic_snapshot_across_capture_times, test_manager_acquisition_retains_all_four_raw_official_surfaces_and_replays_offline, test_manager_replay_api_exposes_no_network_or_clock_port, test_corrupted_manager_raw_capture_is_detected_during_replay]
    failure_consequence: Block manager-state reconstruction; V1 CachedHttp or mutable files cannot substitute for sealed manager evidence.
    release_policy: REQUIRED
    owner: acquisition.sealed_manager

  - proof_id: PO-INITIAL-MANAGER-BASIS-001
    claim: Original purchase bases come only from a retained Official price universe captured before the first deadline plus the sealed GW1 manager picks, with the resulting initial bank reconciled to Official FPL.
    proof_class: DATA_INTEGRITY_ASSERTION
    scope: manager_state
    required_evidence: [InitialManagerBasisId, pre_gw1_GlobalWorldId, GW1_ManagerPublicSnapshotId, pre_deadline_bootstrap_capture_time, Official_GW1_bank]
    required_tests: [test_initial_basis_requires_real_pre_deadline_bootstrap_and_replays_offline, test_post_deadline_bootstrap_cannot_be_mislabeled_as_initial_purchase_basis, test_initial_basis_rejects_bank_that_does_not_reconcile_to_pre_gw1_prices]
    failure_consequence: Abstain from in-season financial action; current prices or guessed purchase bases are not spendable truth.
    release_policy: REQUIRED
    owner: control.initial_manager_basis

  - proof_id: PO-MANAGER-STATE-001
    claim: Every live in-season action is based on one current-exact ManagerState with exact current 15, integer-tenths bank and prices, purchase bases, realised selling values, free transfers, chip state and immutable reconciled transfer/provenance evidence.
    proof_class: FORMAL_INVARIANT
    scope: decision_world
    required_evidence: [ManagerState, ManagerStateId, RuleSetId, current_exact_scope, InitialManagerBasis, current_Official_price_surface, HistoricalTransferLedger, Official_realised_sale_receipts, provenance_artifacts, current_state_attestation_or_full_override]
    required_tests: [test_selling_price_boundaries_are_exact_integer_tenths, test_current_exact_state_accepts_zero_free_transfers_and_rejects_unproven_scope, test_rebuy_resets_purchase_basis_and_future_selling_price, test_tampered_transfer_ledger_bank_hit_and_selling_values_fail_closed, test_public_transfer_contract_uses_official_realised_sale_not_invented_market_price, test_sealed_gw2_reconstruction_uses_official_sale_receipt_and_current_price_surface, test_full_override_is_immutable_provenance_and_partial_override_fails]
    failure_consequence: Abstain from any in-season action; approximate or deadline-only financial state cannot become spendable truth.
    release_policy: REQUIRED
    owner: core.manager_state

  - proof_id: PO-SOURCE-GOVERNANCE-001
    claim: Every production source capability has explicit criticality, multidimensional health, host-bound provenance, verified admission evidence and only prequalified degradation/freshness behavior; shadow sources remain observe-only.
    proof_class: PROVENANCE_ASSERTION
    scope: evidence
    required_evidence: [SourceRegistry, SourceCapability, SourceHealth, source_qualification_certificate, qualified_degradation_profile, qualified_deadline_freshness_policy]
    required_tests: [test_v2_catalogue_starts_legacy_news_and_specialists_in_shadow, test_source_url_impersonation_and_unknown_player_fail_closed, test_qualified_source_with_missing_runtime_artifact_is_blocked, test_shadow_source_is_observe_only_even_when_all_health_dimensions_pass, test_shadow_promotion_requires_policy_metrics_and_zero_unqualified_shortcuts, test_missing_freshness_policy_is_unknown_not_implicitly_fresh]
    failure_consequence: Block the affected source capability; an unqualified or unverifiable source cannot influence production.
    release_policy: REQUIRED
    owner: control.source_registry

  - proof_id: PO-EVIDENCE-RELIABILITY-001
    claim: Reliability used to weight evidence is qualified specifically for source, claim type, horizon and recency; missing calibration remains UNKNOWN with no numeric coefficient.
    proof_class: EMPIRICAL_QUALIFICATION
    scope: evidence
    required_evidence: [ReliabilityContext, ReliabilityRegistry, qualification_artifact, calibration_sample_count]
    required_tests: [test_missing_contextual_reliability_is_unknown_with_no_numeric_default, test_production_evidence_requires_verified_source_and_reliability_qualification]
    failure_consequence: Retain the claim for audit/shadow use but prohibit weighted production influence.
    release_policy: CONDITIONAL
    owner: control.reliability_registry

  - proof_id: PO-EVIDENCE-LEDGER-001
    claim: External text can influence Apex only through constrained exact-ID structured claims backed by immutable raw artifacts and an append-only superseding evidence ledger; raw text never becomes executable instruction.
    proof_class: DATA_INTEGRITY_ASSERTION
    scope: evidence
    required_evidence: [raw_source_artifact, EvidenceClaim, EvidenceLedger, parent_ledger_artifact, exact_Official_player_id, source_host_registration]
    required_tests: [test_prompt_injection_text_stays_opaque_and_shadow_cannot_become_production, test_source_url_impersonation_and_unknown_player_fail_closed, test_append_only_ledger_preserves_parent_and_supersession_history, test_supersession_cannot_rewrite_another_player_claim]
    failure_consequence: Quarantine affected evidence and block any decision that depends on it.
    release_policy: REQUIRED
    owner: control.evidence_ingestion

  - proof_id: PO-FEATURE-TIME-TRAVEL-001
    claim: Every FeatureSnapshot contains only feature observations and derived batches actually knowable by its declared cutoff, with exact immutable lineage and no future-data leakage.
    proof_class: DATA_INTEGRITY_ASSERTION
    scope: feature_snapshot
    required_evidence: [FeatureSnapshotId, cutoff, GlobalWorldId, input_artifact_ids, FeatureObservation_first_known_at, FeatureBatch_available_at, derivation_id]
    required_tests: [test_feature_snapshot_rejects_any_feature_first_known_after_cutoff, test_later_official_world_cannot_leak_into_earlier_feature_cutoff, test_later_derived_feature_batch_cannot_be_used_at_earlier_cutoff, test_feature_snapshot_records_exact_cutoff_lineage_and_replays_offline]
    failure_consequence: Block the FeatureSnapshot and every forecast/decision derived from it.
    release_policy: REQUIRED
    owner: control.feature_assembly

  - proof_id: PO-OUTCOME-TRUTH-001
    claim: Every calibration target explicitly names one verified post-event truth authority or is marked UNRESOLVED; no experiment silently chooses a convenient truth provider.
    proof_class: PROVENANCE_ASSERTION
    scope: learning
    required_evidence: [OutcomeTruthRegistry, target_authority_status, source_reference, field_contract]
    required_tests: [test_outcome_truth_registry_never_silently_selects_unverified_truth_provider]
    failure_consequence: Block calibration/evaluation for unresolved or unregistered targets; never backfill from an undeclared provider.
    release_policy: REQUIRED
    owner: control.outcome_truth_registry

  - proof_id: PO-MINUTES-FEATURE-INPUT-001
    claim: Minutes-model inputs preserve exact point-in-time status/history/preseason facts, explicit missingness and reviewed cross-season identity without producing or overriding expected minutes.
    proof_class: DATA_INTEGRITY_ASSERTION
    scope: feature_snapshot
    required_evidence: [MinutesFeatureVector, FeatureSnapshotId, known_observation_ids, missing_features, reviewed_PersonLink, preseason_source_artifacts]
    required_tests: [test_minutes_vector_has_no_implicit_prior_or_preseason_defaults, test_isolated_preseason_cameo_is_preserved_beside_mature_history_not_blended_over_it, test_prior_season_minutes_require_reviewed_person_link_not_name_or_old_id, test_preseason_aggregation_excludes_appearance_first_known_after_cutoff, test_v2_feature_path_has_no_network_wall_clock_dataframe_or_v1_service_dependency]
    failure_consequence: Block minutes-model input use; expected minutes cannot be supplied by manual override or implicit fallback.
    release_policy: REQUIRED
    owner: core.minutes_features

  - proof_id: PO-FORECAST-LINEAGE-001
    claim: Every compiled Forecast is replayable from one exact sealed FeatureSnapshot, GlobalWorld, RuleSet, registered ModelArtifact and immutable PredictionBatch with no network or wall-clock access after seal.
    proof_class: DATA_INTEGRITY_ASSERTION
    scope: forecast
    required_evidence: [ForecastId, FeatureSnapshotId, GlobalWorldId, RuleSetId, ModelArtifactId, PredictionBatchId, forecast_artifact]
    required_tests: [test_shadow_forecast_compiles_and_replays_but_is_not_production_eligible, test_forecast_target_builder_rejects_later_world_or_later_capture]
    failure_consequence: Block forecast use; lineage mismatch or post-cutoff world data cannot be repaired by a default.
    release_policy: REQUIRED
    owner: forecast.engine

  - proof_id: PO-FORECAST-SCORING-001
    claim: FPL point distributions are derived independently from model football-outcome scenarios using the exact sealed season RuleSet.
    proof_class: ALGORITHMIC_CERTIFICATE
    scope: forecast
    required_evidence: [PredictionBatch, PlayerMatchOutcome, RuleSetId, points_distribution, expectation_reconciliation]
    required_tests: [test_ruleset_scoring_boundaries_are_applied_independently_of_model_xp, test_model_scenarios_compile_to_exact_minutes_and_points_distributions]
    failure_consequence: Block forecast publication; a model-provided xP number cannot substitute for RuleSet scoring.
    release_policy: REQUIRED
    owner: core.forecast

  - proof_id: PO-FORECAST-COVERAGE-001
    claim: Production prediction rows exactly cover the Official player-fixture universe for the declared horizon and no required target is silently omitted, altered or neutral-filled.
    proof_class: FORMAL_INVARIANT
    scope: forecast
    required_evidence: [OfficialForecastTargetSet, PredictionBatch, coverage_reconciliation, explicit_abstentions]
    required_tests: [test_prediction_batch_requires_exact_official_target_coverage, test_production_forecast_requires_qualified_registered_champion_and_complete_predictions]
    failure_consequence: Block production forecast and therefore any optimiser that could otherwise mistake missing candidates for zero value.
    release_policy: REQUIRED
    owner: forecast.targets

  - proof_id: PO-FORECAST-QUALIFICATION-001
    claim: The active production forecast model is the registered empirically qualified champion and is used only within its declared no-hindsight season/horizon validity scope; qualification is a replay-derived typed certificate for the exact stable forecast-model subject, not artifact existence.
    proof_class: EMPIRICAL_QUALIFICATION
    scope: forecast
    required_evidence: [ForecastModelArtifact, parameter_artifacts, EmpiricalQualificationCertificate, ExperimentRegistry, ExperimentDefinition, ExperimentResult, exact_subject_identity, qualification_metrics, validity_scope, champion_model_id]
    required_tests: [test_registry_has_no_fabricated_default_champion_and_unqualified_model_cannot_produce, test_no_hindsight_model_validity_blocks_future_training_and_future_model_availability, test_model_horizon_uses_calendar_span_not_number_of_selected_gameweeks, test_supported_certificate_replays_from_registered_immutable_evidence, test_typed_admission_rejects_wrong_subject_future_and_expired_certificate, test_production_empirical_proof_rejects_wrong_release_subject_kind]
    failure_consequence: Keep the model in shadow or abstain; unqualified, future-trained, expired or semantically mismatched models cannot influence production.
    release_policy: REQUIRED
    owner: learning.model_registry

  - proof_id: PO-FOOTBALL-UNCERTAINTY-001
    claim: Future football outcomes remain probabilistic; only official suspension/ineligibility may be represented as a structurally certain zero-minute state.
    proof_class: IRREDUCIBLY_UNCERTAIN
    scope: forecast
    required_evidence: [DiscreteIntegerDistribution, ForecastUncertainty, scenario_probabilities, structural_zero_reason]
    required_tests: [test_discrete_distribution_is_exact_and_rejects_unbalanced_probability_mass, test_prediction_contract_rejects_fake_deterministic_90_and_impossible_zero_minute_events, test_official_suspension_can_be_structural_zero_without_claiming_general_football_certainty]
    failure_consequence: Block publication of falsely certain football claims.
    release_policy: REQUIRED
    owner: forecast.contract

  - proof_id: PO-FPL-LEGALITY-001
    claim: Every selected Slice 8 action is legal under the sealed RuleSet and exact ManagerState; in-season affordability uses realised selling resources rather than fresh-squad market value.
    proof_class: FORMAL_INVARIANT
    scope: decision
    required_evidence: [RuleSetId, ManagerStateId, DecisionInputId, DecisionAction, candidate_universe_id]
    required_tests: [test_small_universe_decision_matches_independent_bruteforce_true_optimum, test_inseason_budget_uses_realised_selling_value_not_fresh_market_value, test_wildcard_and_free_hit_rebuild_paths_use_verified_ruleset_keys]
    failure_consequence: Block the decision; never publish an illegal or financially impossible action.
    release_policy: REQUIRED
    owner: decision.engine

  - proof_id: PO-DECISION-MECHANICS-001
    claim: Slice 8 integrates transfers, hit costs, XI, captain, vice, bench order and chip mechanics inside the exact objective rather than post-processing them with arbitrary weights, and the typed action reconciles mechanics arithmetic before it can become evidence.
    proof_class: ALGORITHMIC_CERTIFICATE
    scope: decision
    required_evidence: [DecisionMechanics, exact_rational_objective, transfer_frontier, submission_objective]
    required_tests: [test_second_transfer_is_exactly_one_four_point_hit_not_double_counted, test_submission_optimises_bench_order_and_captain_inside_exact_objective, test_triple_captain_and_bench_boost_are_integrated_action_choices, test_zero_transfer_state_is_preserved_when_no_move_beats_hold, test_decision_action_rejects_hit_or_points_arithmetic_laundering, test_bench_boost_cannot_simultaneously_claim_autosub_points]
    failure_consequence: Block the decision; mechanics reconciliation is not trustworthy.
    release_policy: REQUIRED
    owner: decision.mechanics

  - proof_id: PO-DECISION-SOLVER-EXACTNESS-001
    claim: Solver termination state, incumbent, best bound, gap, selected objective, candidate scope and numeric error are represented and reconciled explicitly; solver limit or error is never relabelled as infeasible or globally optimal.
    proof_class: ALGORITHMIC_CERTIFICATE
    scope: decision
    required_evidence: [SolverCertificate, ExactnessClaim, numeric_policy_id, incumbent_objective, best_bound, gap, numeric_error_bound]
    required_tests: [test_solver_limit_and_error_are_not_constructible_as_infeasible_shortcuts, test_solver_limit_error_and_true_infeasibility_remain_distinct_outcomes, test_global_optimal_exactness_requires_full_universe_complete_surface_and_zero_gap, test_rational_numeric_policy_has_exact_semantic_normalisation, test_solver_certificate_rejects_zero_gap_that_does_not_reconcile_bound, test_decision_result_rejects_solver_incumbent_not_equal_to_selected_objective, test_decision_result_rejects_returned_alternative_better_than_selected]
    failure_consequence: Mark the solve INCONCLUSIVE or block publication; never fabricate exactness.
    release_policy: REQUIRED
    owner: core.decision

  - proof_id: PO-DECISION-POLICY-QUALIFICATION-001
    claim: Production optimisation uses only the registered empirically qualified DecisionPolicy for the current season, with explicit horizon, continuation value, chip option value, price policy, candidate policy and implemented tie-breaking identity; qualification replays from a predeclared typed experiment for the exact stable DecisionPolicy subject at the decision cutoff.
    proof_class: EMPIRICAL_QUALIFICATION
    scope: decision_policy
    required_evidence: [DecisionPolicyId, champion_policy_id, EmpiricalQualificationCertificate, ExperimentRegistry, ExperimentDefinition, ExperimentResult, exact_subject_identity, continuation_value_artifact, chip_option_value_artifact, price_policy_artifact, candidate_policy_artifact, tie_break_policy]
    required_tests: [test_empty_registry_has_no_fabricated_production_decision_policy, test_qualified_policy_without_price_and_candidate_policy_cannot_be_constructed, test_qualified_policy_supports_must_replay_and_champion_must_be_qualified, test_tactical_policy_rejects_unimplemented_tie_break_semantics, test_receding_policy_requires_every_support_and_canonical_semantics, test_tactical_engine_refuses_production_even_with_full_universe, test_supported_certificate_replays_from_registered_immutable_evidence, test_typed_admission_rejects_wrong_subject_future_and_expired_certificate, test_production_empirical_proof_rejects_wrong_release_subject_kind]
    failure_consequence: Keep the policy shadow-only or abstain; a tactical one-Gameweek solve, future/expired certificate or mismatched policy semantics cannot become production max-EV-over-time.
    release_policy: REQUIRED
    owner: control.decision_policy_registry

  - proof_id: PO-CANDIDATE-UNIVERSE-001
    claim: Candidate-universe identity and filter lineage are immutable; a strict-superset expansion is monotone, its result exactly reconciles objective delta versus materiality threshold, and a scoped optimum is promoted only after a FULL_OFFICIAL expansion finds no material improvement under identical DecisionPolicy semantics.
    proof_class: ALGORITHMIC_CERTIFICATE
    scope: decision
    required_evidence: [CandidateUniverseId, filter_artifact_id, CandidateExpansionCertificate, baseline_objective, expanded_objective, materiality_threshold, ExactnessClaim, DecisionPolicyId]
    required_tests: [test_materially_better_expanded_pool_invalidates_narrow_search_claim, test_full_official_expansion_without_material_improvement_certifies_scoped_pool, test_expansion_certificate_rejects_expanded_optimum_below_baseline, test_expansion_certificate_rejects_result_label_that_disagrees_with_objectives]
    failure_consequence: Downgrade exactness, flag a search defect, or block if expansion arithmetic, monotonicity or certified/full coverage cannot be proven.
    release_policy: REQUIRED
    owner: decision.expansion

  - proof_id: PO-DECISION-REPLAY-001
    claim: Candidate universes and decisions are immutable content-addressed artifacts that replay offline with the same semantic identities, strict typed parsing and reconciled decision certificate semantics.
    proof_class: DATA_INTEGRITY_ASSERTION
    scope: decision
    required_evidence: [candidate_universe_artifact, decision_result_artifact, CandidateUniverseId, DecisionId, DecisionPolicyId]
    required_tests: [test_candidate_universe_and_decision_replay_preserve_semantic_identities, test_decision_replay_rejects_declared_semantic_identity_mismatch, test_decision_replay_rejects_bool_fields_laundered_as_integers, test_decision_result_rejects_solver_incumbent_not_equal_to_selected_objective]
    failure_consequence: Quarantine the artifact and block any assurance/release claim derived from it.
    release_policy: REQUIRED
    owner: decision.store

  - proof_id: PO-SCENARIO-CONVERGENCE-001
    claim: Robustness evidence comes only from one immutable joint scenario stream with explicit generator/RNG/seed/weight/order identity; the generator and convergence policy are separately qualified under internal registry contracts, while the constitutional release proof is a replay-derived typed certificate for the realised apex.scenario-convergence subject. All compared submitted actions use common nested prefixes, exact realised FPL mechanics, complete Forecast xP reconciliation and governed tolerances; nonconvergence remains INCONCLUSIVE.
    proof_class: EMPIRICAL_QUALIFICATION
    scope: scenario_set
    required_evidence: [ScenarioSetId, ScenarioGeneratorId, ScenarioPolicyId, generator_internal_qualification, policy_internal_qualification, EmpiricalQualificationCertificate, ExperimentRegistry, ExperimentDefinition, ExperimentResult, apex.scenario-convergence_subject_id, source_artifacts, common_nested_prefixes, RobustnessReportId, convergence_checkpoints, exact_weighted_mean, exact_lower_CVaR, tail_quantile, xp_reconciliation, max_ev_regret_tolerance, offline_replay]
    required_tests: [test_scenario_policy_has_historical_floor_and_registry_has_no_fabricated_champion, test_fixed_action_scenario_scoring_applies_autosub_and_vice_without_hindsight, test_common_nested_stream_converges_and_preserves_ev_anchor, test_robustness_preference_cannot_leave_governed_ev_regret_band, test_nonconverged_stream_is_inconclusive_not_stable, test_future_convergence_policy_cannot_retroactively_govern_forecast, test_missing_forecast_reconciliation_target_fails_closed, test_scenario_and_robustness_replay_preserve_semantic_identity, test_qualified_registry_requires_real_artifacts_and_champions, test_v2_scenario_path_uses_only_sealed_joint_artifacts_not_runtime_rng_or_marginal_labels, test_production_empirical_proof_rejects_wrong_release_subject_kind, test_structural_mismatch_is_rejected_even_when_sample_is_also_incomplete]
    failure_consequence: Mark robustness INCONCLUSIVE or withhold robustness evidence; a qualified generator/policy alone, a wrong release subject, marginal labels, missing/corrupt worker evidence or an unstable stream cannot satisfy convergence.
    release_policy: REQUIRED
    owner: decision.robustness

  - proof_id: PO-MECHANICS-RECONCILIATION-001
    claim: Independent assurance reproduces the selected action's sealed-input identity, exact current state, owned-player facts, chip availability, transfer set and positions, realised selling-resource finance, hit cost, RuleSet squad/XI/bench/captain structure and expected mechanics using an algorithm that does not import or reuse DecisionEngine mechanics.
    proof_class: ALGORITHMIC_CERTIFICATE
    scope: decision_assurance
    required_evidence: [ReferenceMechanicsCertificateId, DecisionId, DecisionInputId, ManagerStateId, ForecastId, RuleSetId, CandidateUniverseId, independent_algorithm_id, reference_checks, recomputed_bank_after_tenths, recomputed_hit_points, recomputed_mechanics, source_artifacts, offline_replay]
    required_tests: [test_reference_mechanics_reconciles_selected_action_with_different_autosub_algorithm, test_reference_mechanics_detects_self_consistent_objective_tampering, test_assurance_certificates_and_report_replay_with_same_semantic_identity, test_reference_mechanics_replay_requires_retained_source_artifact, test_v2_independent_assurance_cannot_import_decision_engine_or_v1_runtime]
    failure_consequence: Block release; the selected action has not been independently reconciled against sealed FPL mechanics.
    release_policy: REQUIRED
    owner: assurance.reference_mechanics

  - proof_id: PO-REFERENCE-SOLVER-PARITY-001
    claim: Production receding-horizon optimality is independently corroborated by a replay-valid PlanningReferenceSolverCertificate over the exact same schema-v2 PlanningResultId, DecisionInput, FULL_OFFICIAL CandidateUniverse and DecisionPolicy/horizon, produced by the registered artifact-verified season/horizon-valid planning-v2 qualified champion worker; only complete OPTIMAL zero-gap objective, root-action and selected-trajectory parity may satisfy the proof, while missing, limited, errored, tactical-v1, unqualified, non-champion or mismatched evidence fails closed.
    proof_class: ALGORITHMIC_CERTIFICATE
    scope: decision_assurance
    required_evidence: [PlanningReferenceSolverCertificateId, ReferenceSolverAuthorizationId, PlanningResultId, PlanningTrajectoryId, ReferenceSolverWorkerId, champion_worker_id, worker_code_artifact, planning_v2_worker_qualification_artifact, planning_qualification_corpus_artifact, solver_request_artifact, solver_run_artifact, DecisionInputId, CandidateUniverseId, DecisionPolicyId, solver_status, search_complete, best_objective, best_bound, gap, tie_break_policy_id, offline_replay]
