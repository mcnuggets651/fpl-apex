schema_version: 1
requirements:
  - requirement_id: REQ-RUNTIME-STATE-SEPARATION
    requirement: Live recommendation state is not source-controlled runtime state.
    critical: true
    invariants: [INV-SOURCE-NOT-RUNTIME, INV-IMMUTABLE-RELEASE]
    implementation: [src/apex_fpl/control/artifact_store.py, src/apex_fpl/control/release_registry.py]
    tests: [tests/test_runtime_state_separation.py, tests/test_production_publication_contract.py]
    proof_obligations: [PO-ARTIFACT-INTEGRITY-001, PO-RELEASE-CAS-001]

  - requirement_id: REQ-RUNTIME-PROVENANCE
    requirement: Every release identifies exact code, dependencies and runtime artifact.
    critical: true
    invariants: [INV-RUNTIME-CONTENT-IDENTITY]
    implementation: [src/apex_fpl/control/provenance.py]
    tests: [tests/test_v2_proof_framework.py]
    proof_obligations: [PO-RUNTIME-IDENTITY-001]

  - requirement_id: REQ-SEALED-GLOBAL-WORLD
    requirement: Decision-global football data is acquired once, retained byte-for-byte, sealed under deterministic identity and replayable without network access.
    critical: true
    invariants: [INV-RAW-CAPTURE-RETENTION, INV-DETERMINISTIC-GLOBAL-WORLD, INV-NO-NETWORK-AFTER-SEAL, INV-GLOBAL-WORLD-MANAGER-NEUTRAL]
    implementation: [src/apex_fpl/core/world.py, src/apex_fpl/acquisition/contracts.py, src/apex_fpl/acquisition/sealed_world.py]
    tests: [tests/test_sealed_global_world.py]
    proof_obligations: [PO-ARTIFACT-INTEGRITY-001, PO-GLOBAL-WORLD-SEAL-001]

  - requirement_id: REQ-OFFICIAL-PLAYER-IDENTITY
    requirement: Current-season player identity is the exact Official FPL integer ID; cross-season linkage uses only reviewed PersonId mappings and names are display-only witnesses.
    critical: true
    invariants: [INV-OFFICIAL-ID-AUTHORITY, INV-NAME-NEVER-IDENTITY, INV-AMBIGUITY-FAILS-CLOSED]
    implementation: [src/apex_fpl/core/identity.py, src/apex_fpl/core/ids.py]
    tests: [tests/test_v2_identity_ruleset.py]
    proof_obligations: [PO-OFFICIAL-PLAYER-IDENTITY-001]

  - requirement_id: REQ-VERSIONED-RULESET
    requirement: All FPL mechanics used by V2 are represented by a deterministic effective-season RuleSet with reviewed Official Premier League provenance.
    critical: true
    invariants: [INV-RULESET-CONTENT-IDENTITY, INV-RULE-PROVENANCE, INV-NO-UNCONTROLLED-RULE-FLOATS]
    implementation: [src/apex_fpl/core/rules.py, src/apex_fpl/control/ruleset_registry.py, config/rules/2026-2027.yaml]
    tests: [tests/test_v2_identity_ruleset.py]
    proof_obligations: [PO-RULESET-PROVENANCE-001]

  - requirement_id: REQ-SEALED-MANAGER-PUBLIC-DATA
    requirement: Manager-specific Official FPL summary, history, transfer and picks data is retained byte-for-byte under content identity and replayed offline before state reconstruction.
    critical: true
    invariants: [INV-MANAGER-PUBLIC-SEALED, INV-NO-NETWORK-AFTER-SEAL]
    implementation: [src/apex_fpl/acquisition/sealed_manager.py, src/apex_fpl/acquisition/contracts.py]
    tests: [tests/test_sealed_manager_public_data.py]
    proof_obligations: [PO-MANAGER-PUBLIC-SEAL-001, PO-ARTIFACT-INTEGRITY-001]

  - requirement_id: REQ-INITIAL-MANAGER-BASIS
    requirement: Original purchase bases are derived only from retained GW1 picks and an Official price universe captured before the first deadline, with the initial bank reconciled exactly.
    critical: true
    invariants: [INV-INITIAL-BASIS-PREDEADLINE, INV-NO-UNPROVEN-SPENDABLE-CASH]
    implementation: [src/apex_fpl/control/initial_manager_basis.py]
    tests: [tests/test_initial_manager_basis_and_sealed_reconstruction.py]
    proof_obligations: [PO-INITIAL-MANAGER-BASIS-001, PO-ARTIFACT-INTEGRITY-001]

  - requirement_id: REQ-EXACT-MANAGER-STATE
    requirement: Live in-season action requires one current-exact manager state with exact permanent 15, bank, free transfers, purchase bases, current realised selling values, chip state and reconciled immutable transfer provenance.
    critical: true
    invariants: [INV-NO-UNPROVEN-SPENDABLE-CASH, INV-MONEY-IN-TENTHS, INV-SELLING-PRICE-EXACT, INV-REBUY-RESETS-BASIS, INV-DEADLINE-SNAPSHOT-NOT-CURRENT, INV-MANAGER-LEDGER-RECONCILED, INV-OFFICIAL-SALE-RECEIPT, INV-FULL-OVERRIDE-ONLY]
    implementation: [src/apex_fpl/core/manager_state.py, src/apex_fpl/control/manager_state_reconstruction.py, src/apex_fpl/control/manager_state_from_seals.py, src/apex_fpl/control/manager_state_override.py]
    tests: [tests/test_v2_manager_state.py, tests/test_v2_manager_state_adversarial.py, tests/test_v2_manager_state_reconstruction.py, tests/test_initial_manager_basis_and_sealed_reconstruction.py]
    proof_obligations: [PO-MANAGER-STATE-001, PO-MANAGER-PUBLIC-SEAL-001, PO-INITIAL-MANAGER-BASIS-001, PO-ARTIFACT-INTEGRITY-001]

  - requirement_id: REQ-EVIDENCE-SOURCE-GOVERNANCE
    requirement: Production evidence uses only capability-registered sources with multidimensional health, verified shadow admission, qualified degradation/freshness, exact Official-ID attachment, contextual reliability and append-only immutable provenance; raw source text is never executable authority.
    critical: true
    invariants: [INV-SOURCE-HEALTH-MULTIDIMENSIONAL, INV-SHADOW-BEFORE-QUALIFIED, INV-DEGRADATION-MUST-BE-QUALIFIED, INV-DEADLINE-RELATIVE-FRESHNESS, INV-NO-FABRICATED-RELIABILITY, INV-RAW-TEXT-IS-DATA, INV-EVIDENCE-EXACT-ID-ATTACHMENT, INV-SOURCE-PROVENANCE-HOST-BOUND, INV-EVIDENCE-APPEND-ONLY]
    implementation: [src/apex_fpl/core/sources.py, src/apex_fpl/core/freshness.py, src/apex_fpl/core/reliability.py, src/apex_fpl/core/evidence.py, src/apex_fpl/control/source_registry.py, src/apex_fpl/control/source_admission.py, src/apex_fpl/control/source_runtime.py, src/apex_fpl/control/freshness_registry.py, src/apex_fpl/control/reliability_registry.py, src/apex_fpl/control/evidence_ingestion.py, src/apex_fpl/control/evidence_ledger_store.py, config/sources_v2.yaml, config/source_reliability_v2.yaml, config/evidence_freshness_v2.yaml]
    tests: [tests/test_v2_evidence_source_governance.py]
    proof_obligations: [PO-SOURCE-GOVERNANCE-001, PO-EVIDENCE-RELIABILITY-001, PO-EVIDENCE-LEDGER-001, PO-ARTIFACT-INTEGRITY-001, PO-OFFICIAL-PLAYER-IDENTITY-001]

  - requirement_id: REQ-POINT-IN-TIME-FEATURES
    requirement: Forecast inputs are immutable point-in-time FeatureSnapshots whose facts, derived batches, identities and truth authorities are explicit at the cutoff; missing information is not replaced by neutral defaults and expected minutes is not written by feature engineering.
    critical: true
    invariants: [INV-FEATURES-POINT-IN-TIME, INV-FEATURE-LINEAGE-EXACT, INV-MISSING-NEVER-NEUTRAL-DEFAULT, INV-DERIVED-BATCH-TIME-BOUND, INV-CROSS-SEASON-FEATURE-ID-REVIEWED, INV-OUTCOME-TRUTH-EXPLICIT, INV-EXPECTED-MINUTES-IS-MODEL-OUTPUT]
    implementation: [src/apex_fpl/core/features.py, src/apex_fpl/core/minutes_features.py, src/apex_fpl/core/minutes_history.py, src/apex_fpl/core/outcome_truth.py, src/apex_fpl/control/feature_snapshot.py, src/apex_fpl/control/feature_batch.py, src/apex_fpl/control/feature_assembly.py, src/apex_fpl/control/official_features.py, src/apex_fpl/control/outcome_truth_registry.py, config/outcome_truth_v2.yaml]
    tests: [tests/test_v2_point_in_time_features.py, tests/test_v2_feature_batches_minutes_history.py, tests/test_v2_architecture_boundaries.py]
    proof_obligations: [PO-FEATURE-TIME-TRAVEL-001, PO-OUTCOME-TRUTH-001, PO-MINUTES-FEATURE-INPUT-001, PO-ARTIFACT-INTEGRITY-001, PO-OFFICIAL-PLAYER-IDENTITY-001]

  - requirement_id: REQ-SEALED-PROBABILISTIC-FORECAST
    requirement: Every forecast is an immutable distribution-first transformation of one sealed FeatureSnapshot and one immutable model PredictionBatch over the exact Official player-fixture universe, with FPL points independently compiled under the sealed RuleSet.
    critical: true
    invariants: [INV-FORECAST-DISTRIBUTION-FIRST, INV-FORECAST-RULESET-SCORED, INV-FORECAST-SEALED-LINEAGE, INV-FORECAST-OFFICIAL-TARGET-COVERAGE, INV-FORECAST-ABSTENTION-EXPLICIT, INV-STRUCTURAL-ZERO-ONLY-CERTAINTY, INV-NO-FUTURE-CERTAINTY]
    implementation: [src/apex_fpl/core/forecast.py, src/apex_fpl/forecast/targets.py, src/apex_fpl/forecast/prediction_store.py, src/apex_fpl/forecast/validation.py, src/apex_fpl/forecast/engine.py, src/apex_fpl/forecast/forecast_store.py]
    tests: [tests/test_v2_probabilistic_forecast.py, tests/test_v2_architecture_boundaries.py]
    proof_obligations: [PO-FORECAST-LINEAGE-001, PO-FORECAST-SCORING-001, PO-FORECAST-COVERAGE-001, PO-FOOTBALL-UNCERTAINTY-001, PO-ARTIFACT-INTEGRITY-001, PO-RULESET-PROVENANCE-001]

  - requirement_id: REQ-FORECAST-QUALIFICATION
    requirement: Production forecasts use only the registered empirically qualified champion model within its declared no-hindsight season and horizon validity scope; no default champion or hidden model fallback exists.
    critical: true
    invariants: [INV-EMPIRICAL-CLAIMS-QUALIFIED, INV-FORECAST-MODEL-NO-HINDSIGHT, INV-FORECAST-CHAMPION-QUALIFIED]
    implementation: [src/apex_fpl/core/forecast.py, src/apex_fpl/control/forecast_model_registry.py, src/apex_fpl/forecast/engine.py, config/forecast_models_v2.yaml, slice-11-learning-governance]
    tests: [tests/test_v2_probabilistic_forecast.py]
    proof_obligations: [PO-FORECAST-QUALIFICATION-001, PO-ARTIFACT-INTEGRITY-001]

  - requirement_id: REQ-PROBABILISTIC-FOOTBALL
    requirement: Irreducibly uncertain future football outcomes remain explicit probability distributions; ordinary future minutes/performance cannot be represented as certainty.
    critical: true
    invariants: [INV-NO-FUTURE-CERTAINTY, INV-FORECAST-DISTRIBUTION-FIRST, INV-STRUCTURAL-ZERO-ONLY-CERTAINTY]
    implementation: [src/apex_fpl/core/forecast.py, src/apex_fpl/forecast/validation.py]
    tests: [tests/test_v2_probabilistic_forecast.py]
    proof_obligations: [PO-FOOTBALL-UNCERTAINTY-001]

  - requirement_id: REQ-DECISION-SEALED-INPUTS
    requirement: DecisionEngine consumes only exact ManagerState, sealed Forecast, active RuleSet, immutable candidate universe and versioned DecisionPolicy identities, with no network or wall-clock authority after seal.
    critical: true
    invariants: [INV-DECISION-SEALED-INPUTS, INV-DECISION-POLICY-IDENTITY]
    implementation: [src/apex_fpl/core/decision.py, src/apex_fpl/core/decision_policy.py, src/apex_fpl/decision/engine.py, src/apex_fpl/decision/universe.py]
    tests: [tests/test_v2_decision_engine.py, tests/test_v2_architecture_boundaries.py]
    proof_obligations: [PO-FPL-LEGALITY-001, PO-ARTIFACT-INTEGRITY-001]

  - requirement_id: REQ-DECISION-MECHANICS
    requirement: Transfers, hit costs, legal XI, captain, vice, bench order and chips are integrated into the exact decision objective and in-season affordability uses realised selling resources.
    critical: true
    invariants: [INV-MECHANICS-INTEGRATED, INV-NO-ARBITRARY-BENCH-WEIGHT, INV-LEGAL-CURRENT-ACTION, INV-MONEY-IN-TENTHS]
    implementation: [src/apex_fpl/decision/engine.py, src/apex_fpl/decision/mechanics.py, src/apex_fpl/core/decision.py]
    tests: [tests/test_v2_decision_engine.py, tests/test_v2_decision_mechanics_regressions.py]
    proof_obligations: [PO-FPL-LEGALITY-001, PO-DECISION-MECHANICS-001]

  - requirement_id: REQ-DECISION-SOLVER-EXACTNESS
    requirement: Decision solver outcomes preserve typed termination status, exactness scope, best bound, gap, candidate filter/expansion state and numeric error without laundering limits/errors into infeasibility or optimality.
    critical: true
    invariants: [INV-SOLVER-STATUS-TYPED, INV-EXACTNESS-TYPED-SCOPED, INV-DECISION-RATIONAL-NUMERICS, INV-NO-FALSE-GLOBAL-OPTIMALITY]
    implementation: [src/apex_fpl/core/decision.py, src/apex_fpl/core/decision_search.py, src/apex_fpl/decision/engine.py]
    tests: [tests/test_v2_decision_contracts.py, tests/test_v2_decision_search.py, tests/test_v2_decision_engine.py]
    proof_obligations: [PO-DECISION-SOLVER-EXACTNESS-001]

  - requirement_id: REQ-DECISION-POLICY-QUALIFICATION
    requirement: Production max-EV-over-time requires the registered empirically qualified DecisionPolicy with explicit receding horizon, continuation value, chip option value, price policy, candidate policy and tie-breaking identity; tactical current-GW policy remains shadow-only.
    critical: true
    invariants: [INV-DECISION-POLICY-IDENTITY, INV-TACTICAL-NOT-PRODUCTION, INV-DECISION-POLICY-QUALIFIED, INV-EMPIRICAL-CLAIMS-QUALIFIED]
    implementation: [src/apex_fpl/core/decision_policy.py, src/apex_fpl/control/decision_policy_registry.py, config/decision_policies_v2.yaml]
    tests: [tests/test_v2_decision_contracts.py, tests/test_v2_decision_engine.py]
    proof_obligations: [PO-DECISION-POLICY-QUALIFICATION-001, PO-ARTIFACT-INTEGRITY-001]

  - requirement_id: REQ-CANDIDATE-EXACTNESS
    requirement: Candidate filters are immutable and optimisation exactness states the searched universe and expansion evidence truthfully; a materially better expanded pool invalidates the narrow claim.
    critical: true
    invariants: [INV-CANDIDATE-FILTER-IMMUTABLE, INV-CANDIDATE-EXPANSION-FAILS-CLOSED, INV-NO-FALSE-GLOBAL-OPTIMALITY]
    implementation: [src/apex_fpl/core/decision.py, src/apex_fpl/decision/universe.py, src/apex_fpl/decision/expansion.py]
    tests: [tests/test_v2_decision_expansion.py]
    proof_obligations: [PO-CANDIDATE-UNIVERSE-001, PO-DECISION-SOLVER-EXACTNESS-001]

  - requirement_id: REQ-DECISION-REPLAY
    requirement: Candidate universes and DecisionResults are content-addressed, strict-typed and replayable offline with identical semantic IDs.
    critical: true
    invariants: [INV-IMMUTABLE-RELEASE, INV-DECISION-POLICY-IDENTITY, INV-DECISION-SEALED-INPUTS]
    implementation: [src/apex_fpl/decision/store.py, src/apex_fpl/core/decision.py]
    tests: [tests/test_v2_decision_replay.py]
    proof_obligations: [PO-DECISION-REPLAY-001, PO-ARTIFACT-INTEGRITY-001]

  - requirement_id: REQ-LEGAL-ACTION
    requirement: Every published current action is independently legal under the sealed RuleSet and exact state transition, without trusting the DecisionEngine's own legality implementation.
    critical: true
    invariants: [INV-LEGAL-CURRENT-ACTION]
    implementation: [src/apex_fpl/decision/engine.py, slice-10-independent-assurance]
    tests: [tests/test_v2_decision_engine.py, test_reference_mechanics_reconciles_selected_action]
    proof_obligations: [PO-FPL-LEGALITY-001, PO-MECHANICS-RECONCILIATION-001]

  - requirement_id: REQ-SCENARIO-CONVERGENCE
    requirement: Robustness metrics cannot be treated as stable before governed convergence.
    critical: true
    invariants: [INV-NONCONVERGENCE-INCONCLUSIVE]
    implementation: [slice-9-scenario-convergence]
    tests: [test_nonconverged_scenarios_are_inconclusive]
    proof_obligations: [PO-SCENARIO-CONVERGENCE-001]
