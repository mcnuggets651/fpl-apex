schema_version: 1
policy_version: openfpl-current-training-v1
season: 2026-2027
exact_rule_season: 2026-27
scoring_rules_version: fpl-2026-27-v1
feature_contract_version: openfpl-current-nonscore-v1

# OpenFPL's published model was developed on four complete legacy seasons and
# uses 1/3/5/10/38-match rolling features. For a current-rules adaptation Apex
# removes all score-dependent legacy feature families and trains labels only on
# 2026/27 exact-rule player-match outcomes. Ten completed GWs is the earliest
# governed floor because it spans the complete short/medium-form window family
# through 10 matches while still treating the 38-match horizon as historical
# context, not a reason to ingest legacy-scoring labels.
minimum_exact_rule_gameweeks: 10
training_label_seasons:
  - 2026-27
historical_context_allowed: true
historical_context_must_be_score_independent: true

excluded_score_dependent_feature_families:
  - player fpl points
  - player relevant fpl points
  - player bps
  - player fpl bonus points

reference_rolling_windows:
  - 1
  - 3
  - 5
  - 10
  - 38

model_contract:
  positions:
    - GK
    - DEF
    - MID
    - FWD
  team_grouped_cross_validation: true
  cross_validation_folds: 5
  target: current-rule FPL points in the upcoming match
  legacy_reference_weights_reused: false
  placeholder_invariance_required: true
  official_decision_universe_coverage_required: 1.0
  serve_authorized: false

rationale:
  - 2026/27 retains defensive-contribution points but changes BPS relative to the published OpenFPL reference era.
  - Legacy FPL-points, relevant-FPL-points, BPS and bonus rolling features encode obsolete scoring and are excluded rather than relabelled.
  - Current-model target labels must come only from completed 2026/27 gameweeks and must be strictly earlier than the forecast target.
  - Ten completed exact-rule gameweeks cover OpenFPL's full 1/3/5/10-match adaptive form family before model construction is permitted.
  - The 38-match window may use score-independent historical context only; it cannot import legacy-scoring labels or legacy fitted weights.
  - Meeting this training floor authorizes only model construction in SHADOW. It does not satisfy prospective serving promotion.
