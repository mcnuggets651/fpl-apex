season: "2026-2027"
horizon: 8
budget: 100.0
max_per_team: 3
fpl_entry_id: 63984
# Pre-GW1 prior policy across the three production experts that actually exist.
# These preserve the prior 24:46:20 relative weights after removing the dormant
# 10% market slot, so the change is semantic/auditable rather than a retune to a
# preferred squad. Recalibration remains blocked until genuine sealed outcomes meet
# the >=8 completed-GW / >=200-row promotion contract.
weights:
  official_ep: 0.2666666667
  apex_model: 0.5111111111
  airsenal: 0.2222222222
  market: 0.0
fixture_decay: 0.90
# Used only to generate the internal near-optimal diagnostic shortlist. The final
# production team is chosen later by the GW1-first/receding-horizon strategy gate.
# This is a resource ceiling, never a completeness certificate: production still
# fails closed unless enumeration actually exhausts the governed regret band. The
# previous ceiling of 16 was too small for the live GW2-GW9 surface on 2026-08-22.
exact_candidate_limit: 64
exact_candidate_regret_fraction: 0.005
exact_near_equivalent_points: 0.25
risk_penalty: 0.15
understat_enabled: true
understat_history_seasons: 5
# Promoted 2026-08-13 after Premier-League-only no-hindsight validation on 760
# untouched 2024/25 + 2025/26 matches. Used as the complete team-goal fallback
# while official FPL attack/defence strengths are zeroed and live EPL Elo is absent.
understat_team_model_mode: production
max_official_age_hours: 26
max_core_age_hours: 18
# AIrsenal is a required forecast expert. Missing required players must fail closed
# rather than silently renormalising ensemble weights for only part of the pool.
min_airsenal_player_coverage: 1.0
required_sources:
  - official_fpl
  - team_state
  - fpl_core_playerstats
  - fixture_model
  - airsenal
  - news_feeds
source_confidence:
  official_fpl: 1.00
  official_club: 0.95
  fpl_core: 0.88
  trusted_media: 0.78
  market_odds: 0.82
  manual: 0.70
